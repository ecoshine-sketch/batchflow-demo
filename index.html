_cookies_v1.md", "name": "CHOC CHIP COOKIES — V1.0", "recipeType": "standard", "phases": [{"id": "903de2a9", "name": "Wet (49.5g | 49.5%)", "letter": "A", "temperature": null, "ingredients": [{"id": "f84b2ad7", "number": 1, "name": "Unsalted Butter (browned, cooled)", "grams": 20.0, "percent": 20.0, "function": "Flavour + tenderness"}, {"id": "d2fe94a5", "number": 2, "name": "Brown Sugar", "grams": 14.0, "percent": 14.0, "function": "Chewiness + caramel notes"}, {"id": "9b8d3191", "number": 3, "name": "Caster Sugar", "grams": 6.0, "percent": 6.0, "function": "Crisp edges"}, {"id": "2e194bf7", "number": 4, "name": "Eggs (whole, large)", "grams": 9.0, "percent": 9.0, "function": "Bind"}, {"id": "b9b66842", "number": 5, "name": "Vanilla Extract", "grams": 0.5, "percent": 0.5, "function": "Flavour rounding"}]}, {"id": "239ba2c9", "name": "Dry (26.9g | 26.9%)", "letter": "B", "temperature": null, "ingredients": [{"id": "2898cdf3", "number": 1, "name": "All-Purpose Flour", "grams": 26.0, "percent": 26.0, "function": "Structure"}, {"id": "19181abc", "number": 2, "name": "Baking Soda", "grams": 0.5, "percent": 0.5, "function": "Lift + spread"}, {"id": "313d0e21", "number": 3, "name": "Sea Salt (fine)", "grams": 0.4, "percent": 0.4, "function": "Flavour"}]}, {"id": "fd8e898b", "name": "Inclusions (22.6g | 22.6%)", "letter": "C", "temperature": null, "ingredients": [{"id": "a9d969f0", "number": 1, "name": "Dark Chocolate Chunks (70%)", "grams": 22.0, "percent": 22.0, "function": "Signature feature"}, {"id": "66ae4345", "number": 2, "name": "Flaky Sea Salt (top)", "grams": 0.6, "percent": 0.6, "function": "Finishing"}]}], "scentProfiles": [{"name": "Classic", "description": "Default — dark chocolate chunk.", "ingredients": []}, {"name": "Salted Caramel", "description": "Soft caramel pieces folded in.", "ingredients": [{"name": "Caramel Pieces (chopped)", "grams": 10.0, "notes": "Replaces 10g chocolate"}]}, {"name": "Triple Chocolate", "description": "White + milk + dark.", "in // UTILITIES
// ============================================================
function uid(){
  try {
    if(typeof crypto !== 'undefined' && crypto.randomUUID){
      // Strip dashes and trim — keeps existing 9-char format compatibility for older code paths
      return crypto.randomUUID().replace(/-/g,'').slice(0,12);
    }
  } catch(e){}
  return Math.random().toString(36).substr(2,9) + Math.random().toString(36).substr(2,3);
}
function ls(k,d){try{var v=localStorage.getItem('gecko_'+k);return v?JSON.parse(v):d}catch(e){return d}}

// localStorage quota tracking — iOS Safari hard-caps at ~5 MB. Once you hit
// it, every save fails silently. lsSet now surfaces that as a one-time warning
// and the Dashboard shows a "storage almost full" banner above 80%.
var LS_QUOTA_BYTES = 5 * 1024 * 1024; // pessimistic for iOS Safari
var _quotaWarned = false;
function lsUsedBytes(){
  // Sum of every gecko_* key+value length (JS strings are UTF-16, ~2 bytes/char)
  var total = 0;
  try {
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf('gecko_')===0){
        total += (k.length + (localStorage.getItem(k)||'').length) * 2;
      }
    }
  } catch(e){}
  return total;
}
function lsUsedFraction(){
  return lsUsedBytes() / LS_QUOTA_BYTES;
}
function lsSet(k,v){
  try{
    localStorage.setItem('gecko_'+k,JSON.stringify(v));
  }catch(e){
    var isQuota = e && (e.name==='QuotaExceededError' || e.code===22 || e.code===1014 || /quota|storage/i.test(e.message||''));
    if(isQuota){
      console.error('lsSet QUOTA EXCEEDED for key', k, '— bytes used:', lsUsedBytes());
      if(!_quotaWarned){
        _quotaWarned = true;
        if(typeof showToast==='function') showToast('Storage full — export a backup and trim Trash + version history');
        if(typeof dialogAlert==='function'){
          // Defer the dialog so we don't open it during a render cycle
          setTimeout(function(){
            dialogAlert(
              'Storage full',
              'This device can\'t save any more changes. Until you free up space, your edits won\'t stick.\n\n'+
              'Quick wins:\n'+
              '• Settings → Trash → Empty Trash\n'+
              '• Settings → Export Backup, then clear old recipe versions\n'+
              '• Delete batches older than a year (Trash keeps them recoverable)'
            );
          }, 100);
        }
      }
    }
  }
  if(typeof scheduleSyncPush==='function'&&k!=='syncConfig'&&k!=='lastSyncTime'&&k!=='deviceId'&&k!=='syncStatus') scheduleSyncPush();
}

// Apply persisted ingredient renames and removals on load
(function applyIngredientEdits(){
  var renames = ls('ingredientRenames',{});
  var removals = ls('ingredientRemovals',[]);
  var descEdits = ls('ingredientDescEdits',{});
  // Apply renames to RECIPES and INGREDIENTS_DB
  var renameKeys = Object.keys(renames);
  if(renameKeys.length > 0){
    renameKeys.forEach(function(oldName){
      var newName = renames[oldName];
      RECIPES.forEach(function(r){ r.phases.forEach(function(p){ p.ingredients.forEach(function(ing){ if(ing.name===oldName) ing.name=newName; }); }); });
      var dbItem = INGREDIENTS_DB.find(function(i){ return i.name===oldName; });
      if(dbItem) dbItem.name = newName;
    });
  }
  // Apply removals
  if(removals.length > 0){
    removals.forEach(function(name){
      var idx = INGREDIENTS_DB.findIndex(function(i){ return i.name===name; });
      if(idx !== -1) INGREDIENTS_DB.splice(idx,1);
    });
  }
  // Apply description edits
  var descKeys = Object.keys(descEdits);
  if(descKeys.length > 0){
    descKeys.forEach(function(name){
      var dbItem = INGREDIENTS_DB.find(function(i){ return i.name===name; });
      if(dbItem) dbItem.description = descEdits[name];
    });
  }
})();

function getAllRecipes(){var del=ls('deletedRecipes',[]);return RECIPES.filter(function(r){return del.indexOf(r.id)===-1}).concat(ls('userRecipes',[]))}

// One-time migration: drop the embedded barcode SVG (~3 KB each) from existing
// batch logs. Barcodes are deterministic from batchNumber and regenerated on render.
(function migrateStripBarcodes(){
  if(ls('migration_dropBarcodes', false)) return;
  try {
    var logs = ls('batchLogs', []);
    var changed = false;
    logs.forEach(function(b){
      if(b && b.barcode){ delete b.barcode; changed = true; }
    });
    if(changed){
      // Use direct localStorage to avoid triggering scheduleSyncPush + this isn't a "user change"
      try{ localStorage.setItem('gecko_batchLogs', JSON.stringify(logs)); }catch(e){}
    }
    try{ localStorage.setItem('gecko_migration_dropBarcodes', 'true'); }catch(e){}
  } catch(e){ console.warn('barcode migration skipped:', e); }
})();

var SYNC_DEBOUNCE=null;
var SYNC_KEYS=['batchLogs','userRecipes','deletedRecipes','profiles','activeProfile','workshopMode','defaultOverage','giftBundles','scheduledBatches','ingredientData','lastBackupDate','activityFeed','userPresence','customGroups','recipeGroupOverrides','ingredientRenames','ingredientRemovals','ingredientDescEdits','trash','stockMovements','lowStockThreshold','businessInfo','autoAdvanceTimer','darkMode',
  // Tombstones — per-array deleted-id maps. Without these, a delete on
  // device A is reverted when device B pushes its older state.
  'tombstones_batchLogs','tombstones_userRecipes','tombstones_scheduledBatches','tombstones_giftBundles','tombstones_trash'];

function getSyncableData(){
  var data={};
  SYNC_KEYS.forEach(function(k){var v=ls(k,null);if(v!==null)data[k]=v});
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf('gecko_')===0){
      var sk=k.substring(6);
      if(sk.indexOf('notes_')===0||sk.indexOf('recipeVersions_')===0||sk.indexOf('recipeEdits_')===0||sk.indexOf('sectionState_')===0){
        try{data[sk]=JSON.parse(localStorage.getItem(k))}catch(e){}
      }
    }
  }
  data._syncTime=new Date().toISOString();
  data._device=ls('deviceId','unknown');
  return data;
}

// Per-array tombstone keys: when an item is deleted locally we record
// its id here with a timestamp; the merge skips remote items whose id
// is in the tombstone (so locally-deleted batches don't come back from
// the dead when another device pushed them).
//
// Tombstones older than 90 days are pruned to keep the gist small —
// after 90 days a manually-restored remote item wins, which is fine.
var TOMBSTONE_KEYS = {
  batchLogs: 'tombstones_batchLogs',
  userRecipes: 'tombstones_userRecipes',
  scheduledBatches: 'tombstones_scheduledBatches',
  giftBundles: 'tombstones_giftBundles',
  trash: 'tombstones_trash'
};
function recordTombstone(arrayKey, itemId){
  if(!arrayKey || !itemId) return;
  var tombKey = TOMBSTONE_KEYS[arrayKey];
  if(!tombKey) return;
  var stones = ls(tombKey, {});
  stones[itemId] = Date.now();
  // Prune entries older than 90 days
  var cutoff = Date.now() - 90 * 86400 * 1000;
  Object.keys(stones).forEach(function(id){ if(stones[id] < cutoff) delete stones[id]; });
  lsSet(tombKey, stones);
}
function _itemId(item){
  return item && (item.id || item.batchNumber || (typeof item === 'object' ? JSON.stringify(item) : item));
}

function mergeSyncData(local,remote){
  // Smart merge: arrays by ID with tombstone-aware deletion, scalars
  // last-write-wins. Tombstones from BOTH sides are honoured so a
  // deletion on phone A propagates even after phone B re-syncs.
  var merged={};
  var allKeys={};
  Object.keys(local).forEach(function(k){allKeys[k]=true});
  Object.keys(remote).forEach(function(k){allKeys[k]=true});
  // Pre-compute the union of tombstones for each tracked array
  var combinedTombs = {};
  Object.keys(TOMBSTONE_KEYS).forEach(function(arrayKey){
    var tk = TOMBSTONE_KEYS[arrayKey];
    var localT = (local[tk] && typeof local[tk] === 'object') ? local[tk] : ls(tk, {});
    var remoteT = (remote[tk] && typeof remote[tk] === 'object') ? remote[tk] : {};
    var unionT = {};
    Object.keys(localT).forEach(function(id){ unionT[id] = Math.max(unionT[id]||0, localT[id]||0); });
    Object.keys(remoteT).forEach(function(id){ unionT[id] = Math.max(unionT[id]||0, remoteT[id]||0); });
    combinedTombs[arrayKey] = unionT;
    // Stamp the merged tombstone set into the output
    merged[tk] = unionT;
  });
  Object.keys(allKeys).forEach(function(k){
    if(k.charAt(0)==='_') return;
    if(merged.hasOwnProperty(k)) return; // tombstone keys already handled
    var lv=local[k], rv=remote[k];
    if(rv===undefined){merged[k]=lv;return}
    if(lv===undefined){merged[k]=rv;return}
    if(Array.isArray(lv)&&Array.isArray(rv)){
      var tombs = combinedTombs[k] || {};
      var ids={};
      var result=[];
      rv.forEach(function(item){
        var id=_itemId(item);
        if(tombs[id]) return;            // skip remote items deleted on either side
        if(!ids[id]){ids[id]=true;result.push(item)}
      });
      lv.forEach(function(item){
        var id=_itemId(item);
        if(tombs[id]) return;            // and skip local entries that ARE the tombstone target
        if(!ids[id]){ids[id]=true;result.push(item)}
      });
      merged[k]=result;
    } else {
      merged[k]=rv;
    }
  });
  return merged;
}

function applySyncData(data){
  if(!data)return;
  // Get current local data for merge
  var localData=getSyncableData();
  var merged=mergeSyncData(localData,data);
  Object.keys(merged).forEach(function(k){
    if(k.charAt(0)==='_')return;
    try{localStorage.setItem('gecko_'+k,JSON.stringify(merged[k]))}catch(e){}
  });
}

// ============================================================
// fetchWithTimeout — wraps fetch with an AbortController so a stalled
// request fails fast instead of stacking up under flaky workshop wifi.
// Default 10s; pass a larger value via options.timeoutMs for big bodies
// (e.g. photo uploads use 60s). Falls back to a plain fetch on the rare
// browser without AbortController so we never break old iOS Safari.
// ============================================================
function fetchWithTimeout(url, options, timeoutMs){
  options = options || {};
  var ms = typeof timeoutMs === 'number' ? timeoutMs
         : (typeof options.timeoutMs === 'number' ? options.timeoutMs : 10000);
  if(typeof AbortController === 'undefined'){
    return fetch(url, options);
  }
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ try{ctrl.abort()}catch(e){} }, ms);
  // If the caller already passed a signal, leave it alone — we only add ours
  // when one isn't there. Strip our own timeoutMs from the forwarded options
  // so it doesn't accidentally land on the request init.
  var opts = {};
  Object.keys(options).forEach(function(k){ if(k !== 'timeoutMs') opts[k] = options[k]; });
  if(!opts.signal) opts.signal = ctrl.signal;
  return fetch(url, opts).then(function(r){
    clearTimeout(timer);
    return r;
  }).catch(function(err){
    clearTimeout(timer);
    // Surface a friendlier error so callers can show 'Network timed out'
    // instead of a raw AbortError.
    if(err && err.name === 'AbortError'){
      var e = new Error('Network timeout after ' + Math.round(ms/1000) + 's');
      e.code = 'TIMEOUT';
      throw e;
    }
    throw err;
  });
}

// ============================================================
// SYNC RATE-LIMIT BACKOFF
// ============================================================
// GitHub's gist API throws a verbose 403 ("secondary rate limit") when bursted.
// Track per-device cooldown windows + dedup toasts so we don't hammer the API
// and don't spam the user with the long error message.
var _syncCooldownUntil = 0;
var _syncFailCount = 0;
var _lastToastMsg = '';
var _lastToastTime = 0;

function isSyncCooldown(){
  return Date.now() < _syncCooldownUntil;
}
function syncCooldownRemainingSec(){
  if(!isSyncCooldown()) return 0;
  return Math.ceil((_syncCooldownUntil - Date.now()) / 1000);
}
function _isRateLimitError(err){
  if(!err) return false;
  var m = String(err.message || err);
  return m.indexOf('HTTP 403') === 0 || m.indexOf('HTTP 429') === 0 ||
         /rate limit|abuse|secondary rate/i.test(m);
}
function _isAuthError(err){
  if(!err) return false;
  var m = String(err.message || err);
  return m.indexOf('HTTP 401') === 0 || m.indexOf('HTTP 404') === 0;
}
function _isNetworkError(err){
  if(!err) return false;
  var m = String(err.message || err);
  return /Failed to fetch|NetworkError|network/i.test(m) && m.indexOf('HTTP') !== 0;
}
function _setSyncCooldown(){
  _syncFailCount = Math.min(_syncFailCount + 1, 6);
  // 30s, 60s, 120s, 240s, 300s, 300s
  var seconds = Math.min(30 * Math.pow(2, _syncFailCount - 1), 300);
  _syncCooldownUntil = Date.now() + seconds * 1000;
  // Re-render the cloud-icon now and again when cooldown ends
  window.dispatchEvent(new CustomEvent('gecko-sync-update'));
  setTimeout(function(){window.dispatchEvent(new CustomEvent('gecko-sync-update'))}, seconds*1000 + 100);
  return seconds;
}
function _resetSyncCooldown(){
  if(_syncFailCount > 0 || _syncCooldownUntil > 0){
    _syncFailCount = 0;
    _syncCooldownUntil = 0;
    window.dispatchEvent(new CustomEvent('gecko-sync-update'));
  }
}
function _toastDedup(msg){
  // Don't repeat the same toast within 60s
  if(msg === _lastToastMsg && Date.now() - _lastToastTime < 60000) return;
  _lastToastMsg = msg;
  _lastToastTime = Date.now();
  if(typeof showToast === 'function') showToast(msg);
}
function _handleSyncError(err, op){
  var status = '';
  if(_isRateLimitError(err)){
    var secs = _setSyncCooldown();
    var label = secs >= 60 ? Math.round(secs/60) + ' min' : secs + 's';
    _toastDedup('Sync paused — too many changes, retrying in ' + label);
    status = 'rate-limited';
  } else if(_isAuthError(err)){
    _toastDedup('Sync token rejected — check Settings');
    status = 'auth-error';
  } else if(_isNetworkError(err)){
    // Likely offline — silent. The cloud icon will go orange.
    status = 'offline';
  } else {
    _toastDedup('Sync error — see console');
    console.error(op + ' error:', err);
    status = 'error';
  }
  try{localStorage.setItem('gecko_syncStatus',JSON.stringify(status))}catch(e){}
}

function cloudPush(){
  var config=ls('syncConfig',null);
  if(!config){console.warn('cloudPush: no config');return Promise.resolve()}
  if(isSyncCooldown()) return Promise.resolve('cooldown');
  var pat = getActivePAT();
  if(!pat){console.warn('cloudPush: no active PAT (locked workspace?)');return Promise.resolve()}
  var data=getSyncableData();
  var body={files:{'gecko_sync.json':{content:JSON.stringify(data)}}};
  var url,method;
  if(config.gistId){url='https://api.github.com/gists/'+config.gistId;method='PATCH'}
  else{url='https://api.github.com/gists';method='POST';body.description='BatchFlow App Sync';body.public=false}
  console.log('cloudPush:',method,url,'keys:',Object.keys(data).length);
  return fetchWithTimeout(url,{method:method,headers:{'Authorization':'token '+pat,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)},15000)
  .then(function(r){
    if(!r.ok){return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t)})}
    return r.json();
  }).then(function(result){
    if(result.id){
      if(!config.gistId){config.gistId=result.id;try{localStorage.setItem('gecko_syncConfig',JSON.stringify(config))}catch(e){}}
      try{localStorage.setItem('gecko_lastSyncTime',JSON.stringify(new Date().toISOString()))}catch(e){}
      try{localStorage.setItem('gecko_syncStatus',JSON.stringify('ok'))}catch(e){}
      _resetSyncCooldown();
      console.log('cloudPush: SUCCESS, gist:',result.id);
    }
    return result;
  }).catch(function(err){
    _handleSyncError(err, 'cloudPush');
  });
}

function cloudPull(){
  var config=ls('syncConfig',null);
  if(!config||!config.gistId){console.warn('cloudPull: no config/gistId');return Promise.resolve(null)}
  if(isSyncCooldown()) return Promise.resolve(null);
  var pat = getActivePAT();
  if(!pat){console.warn('cloudPull: no active PAT (locked workspace?)');return Promise.resolve(null)}
  console.log('cloudPull: fetching gist',config.gistId);
  return fetchWithTimeout('https://api.github.com/gists/'+config.gistId,{headers:{'Authorization':'token '+pat,'Accept':'application/vnd.github.v3+json'}},10000)
  .then(function(r){
    if(!r.ok){return r.text().then(function(t){throw new Error('HTTP '+r.status+': '+t)})}
    return r.json();
  }).then(function(result){
    var fileNames=Object.keys(result.files||{});
    console.log('cloudPull: gist files:',fileNames.join(', '));
    _resetSyncCooldown();
    if(result.files&&result.files['gecko_sync.json']){
      var parsed=JSON.parse(result.files['gecko_sync.json'].content);
      console.log('cloudPull: got sync data, keys:',Object.keys(parsed).length,'syncTime:',parsed._syncTime);
      return parsed;
    }
    console.warn('cloudPull: no gecko_sync.json found in gist, files:',fileNames);
    return null;
  }).catch(function(err){
    _handleSyncError(err, 'cloudPull');
    return null;
  });
}

function findExistingGist(pat){
  return fetchWithTimeout('https://api.github.com/gists?per_page=100',{headers:{'Authorization':'token '+pat,'Accept':'application/vnd.github.v3+json'}},15000)
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(gists){
    if(!Array.isArray(gists))return null;
    for(var i=0;i<gists.length;i++){
      if(gists[i].files&&gists[i].files['gecko_sync.json'])return gists[i].id;
    }
    return null;
  });
}

function scheduleSyncPush(){
  if(SYNC_DEBOUNCE)clearTimeout(SYNC_DEBOUNCE);
  function attemptPush(){
    if(isSyncCooldown()){
      // Push the change after the cooldown ends (+1s buffer)
      SYNC_DEBOUNCE = setTimeout(attemptPush, syncCooldownRemainingSec()*1000 + 1000);
      return;
    }
    cloudPush();
  }
  SYNC_DEBOUNCE = setTimeout(attemptPush, 3000);
}

function doFullSync(skipReload){
  var config=ls('syncConfig',null);
  if(!config)return Promise.resolve('not_configured');
  if(!getActivePAT()) return Promise.resolve('locked');
  if(!config.gistId)return cloudPush().then(function(){return 'pushed'});
  return cloudPull().then(function(remoteData){
    if(remoteData){
      var remoteTime=new Date(remoteData._syncTime||0).getTime();
      var localTime=new Date(ls('lastSyncTime','2000-01-01')).getTime();
      console.log('doFullSync: remote:',new Date(remoteTime).toISOString(),'local:',new Date(localTime).toISOString(),'remote newer:',remoteTime>localTime);
      if(remoteTime>localTime){
        applySyncData(remoteData);
        try{localStorage.setItem('gecko_lastSyncTime',JSON.stringify(new Date().toISOString()))}catch(e){}
        // Always push back after applying remote data
        return cloudPush().then(function(){
          if(!skipReload){
            sessionStorage.setItem('gecko_justSynced','1');
            window.location.reload();
            return 'reloading';
          }
          window.dispatchEvent(new CustomEvent('gecko-sync-update'));
          return 'merged';
        });
      }
    } else {
      console.log('doFullSync: no remote data, pushing local');
    }
    return cloudPush().then(function(){return 'ok'});
  }).catch(function(err){
    console.error('Full sync failed:',err);
    if(typeof showToast==='function')showToast('Sync failed: '+(err.message||err));
    return 'error';
  });
}

// ── Multi-User Collaboration ──
var COLLAB_POLL=null;
// 5 seconds — tightened from 15s for Heath + mum two-user setup. Math:
// 3 active devices × (3600/5) = 2,160 polls/hour. GitHub PAT cap is
// 5,000/hour, so we have ~50% headroom. iOS background-throttles polling
// when the app isn't foregrounded, so battery impact is minimal in practice.
var COLLAB_INTERVAL=5000;

function getDeviceName(){
  var id=ls('deviceId',null);
  if(!id){id='device_'+Math.random().toString(36).substr(2,6);lsSet('deviceId',id)}
  return id;
}

function getUserDisplayName(){
  return ls('activeProfile','User');
}

function logActivity(action,detail){
  var feed=ls('activityFeed',[]);
  feed.unshift({
    id:Date.now()+'_'+Math.random().toString(36).substr(2,4),
    user:getUserDisplayName(),
    device:getDeviceName(),
    action:action,
    detail:detail||'',
    time:new Date().toISOString()
  });
  // Keep last 50 entries
  if(feed.length>50)feed=feed.slice(0,50);
  lsSet('activityFeed',feed);
}

function updatePresence(){
  var presence=ls('userPresence',{});
  var key=getDeviceName();
  presence[key]={
    user:getUserDisplayName(),
    lastSeen:new Date().toISOString(),
    device:key
  };
  // Prune users not seen in 2 minutes
  var cutoff=Date.now()-120000;
  Object.keys(presence).forEach(function(k){
    if(new Date(presence[k].lastSeen).getTime()<cutoff)delete presence[k];
  });
  lsSet('userPresence',presence);
}

function getOnlineUsers(){
  var presence=ls('userPresence',{});
  var cutoff=Date.now()-120000;
  var users=[];
  Object.keys(presence).forEach(function(k){
    if(new Date(presence[k].lastSeen).getTime()>=cutoff){
      users.push(presence[k]);
    }
  });
  return users;
}

function startCollabPolling(){
  if(COLLAB_POLL)clearInterval(COLLAB_POLL);
  var config=ls('syncConfig',null);
  if(!config||!config.gistId)return;
  if(!getActivePAT()) return; // workspace is locked — wait for unlock
  updatePresence();
  COLLAB_POLL=setInterval(function(){
    updatePresence();
    cloudPull().then(function(remote){
      if(remote){
        var remoteTime=new Date(remote._syncTime||0).getTime();
        var localTime=new Date(ls('lastSyncTime','2000-01-01')).getTime();
        if(remoteTime>localTime){
          // Snapshot key sizes so we can tell what actually changed
          var beforeBatches=(ls('batchLogs',[])||[]).length;
          var beforeRecipes=(ls('userRecipes',[])||[]).length;
          applySyncData(remote);
          try{localStorage.setItem('gecko_lastSyncTime',JSON.stringify(new Date().toISOString()))}catch(e){}
          var afterBatches=(ls('batchLogs',[])||[]).length;
          var afterRecipes=(ls('userRecipes',[])||[]).length;
          var who='another device';
          try{
            var p=ls('userPresence',{});
            var myDev=ls('deviceId','');
            var others=Object.keys(p).filter(function(k){return k!==myDev});
            if(others.length>0 && p[others[0]] && p[others[0]].user) who=p[others[0]].user;
          }catch(e){}
          var changes=[];
          if(afterBatches>beforeBatches) changes.push('+'+(afterBatches-beforeBatches)+' batch'+(afterBatches-beforeBatches!==1?'es':''));
          if(afterRecipes>beforeRecipes) changes.push('+'+(afterRecipes-beforeRecipes)+' recipe'+(afterRecipes-beforeRecipes!==1?'s':''));
          if(changes.length>0 && typeof showToast==='function'){
            showToast(who+' synced '+changes.join(', '));
          }
          window.dispatchEvent(new CustomEvent('gecko-sync-update'));
        }
      }
      // Don't auto-push on every poll cycle. Pushes are scheduled by lsSet → scheduleSyncPush
      // when the user actually changes something. Burst-pushing every 15s is what was tripping
      // GitHub's secondary rate limit.
    }).catch(function(e){console.error('Collab poll error:',e)});
  },COLLAB_INTERVAL);
}

function stopCollabPolling(){
  if(COLLAB_POLL){clearInterval(COLLAB_POLL);COLLAB_POLL=null}
}

// ─────────────────────────────────────────────────────────────────────────────
// Shopify integration (Phase 1: read-only verification + product mapping)
// ─────────────────────────────────────────────────────────────────────────────
// HMAC-signed calls to the gecko-cloudflare Worker. The Worker proxies to
// Shopify's Admin API (CORS-blocked from browsers). Configure via
// Settings → Shopify Integration. The hmacKey here must match the Worker's
// HMAC_KEY secret exactly — symmetric, both sides know it.

function shopifyConfig(){return ls('shopifyConfig',null)}
// shopifyConfigured — true when worker URL + user + an HMAC key (plaintext OR
// encrypted) are present. The encrypted path requires the workspace to have
// been unlocked at least once this session.
function shopifyConfigured(){
  var c=shopifyConfig();
  if(!c||!c.workerUrl||!c.user) return false;
  if(c.hmacKey) return true;
  if(c.encryptedHmacKey && (typeof getActiveHmacKey === 'function') && getActiveHmacKey()) return true;
  return false;
}

function _shopifyHexToBytes(hex){
  var bytes=new Uint8Array(hex.length/2);
  for(var i=0;i<bytes.length;i++) bytes[i]=parseInt(hex.substr(i*2,2),16);
  return bytes;
}
function _shopifyBytesToHex(bytes){
  var hex='';for(var i=0;i<bytes.length;i++) hex+=bytes[i].toString(16).padStart(2,'0');return hex;
}
async function _shopifySign(user,ts,body,hmacKeyHex){
  var key=await crypto.subtle.importKey('raw',_shopifyHexToBytes(hmacKeyHex),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  var msg=new TextEncoder().encode(user+'.'+ts+'.'+(body||''));
  var sig=await crypto.subtle.sign('HMAC',key,msg);
  return _shopifyBytesToHex(new Uint8Array(sig));
}
async function shopifyFetch(path,options){
  var c=shopifyConfig();
  if(!c||!c.workerUrl||!c.user) throw new Error('Shopify not configured. Set up in Settings → Shopify.');
  options=options||{};
  // HMAC key — prefer in-memory unlocked copy (when locked), else plaintext.
  var hmac = (typeof getActiveHmacKey === 'function') ? getActiveHmacKey() : c.hmacKey;
  if(!hmac) throw new Error('Shopify HMAC key locked or missing. Unlock workspace in Settings.');
  var ts=Math.floor(Date.now()/1000);
  var body=options.body||'';
  var sig=await _shopifySign(c.user,ts,body,hmac);
  var base=c.workerUrl.replace(/\/$/,'');
  // 10s default; callers (e.g. photo upload) can override via options.timeoutMs.
  var timeoutMs = typeof options.timeoutMs === 'number' ? options.timeoutMs : 10000;
  var res=await fetchWithTimeout(base+path,{
    method:options.method||'GET',
    headers:Object.assign({
      'X-Gecko-User':c.user,
      'X-Gecko-Timestamp':String(ts),
      'X-Gecko-Signature':sig,
      'Content-Type':'application/json'
    },options.headers||{}),
    body:body||undefined
  },timeoutMs);
  var data=null;
  try{data=await res.json()}catch(e){}
  if(!res.ok) throw new Error((data&&data.detail)||('Shopify API error '+res.status));
  return data;
}

// Convenience wrappers for the endpoints we use across the UI.
function shopifyEnqueuePush(input){

}

// ── Web Push helpers ──
// VAPID public key (matches the worker's VAPID_PUBLIC_KEY env var). Public —
// not a secret. Used by pushManager.subscribe to ask the browser for an
// authenticated push subscription endpoint.
var VAPID_PUBLIC_KEY = 'BJq9on3_DkoVYIb8EQ204SCEhsBWl5rODGhlC6mqJ4nbkXGAanINwEUnA2jmTzp4KBvYuijo6eJV26e8_ZL1dsk';

function urlBase64ToUint8Array(b64){
  var pad = '='.repeat((4 - b64.length % 4) % 4);
  var base64 = (b64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  var raw = atob(base64);
  var out = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
function arrayBufferToBase64Url(buf){
  if(!buf) return null;
  var bytes = new Uint8Array(buf);
  var s = '';
  for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/=+$/g,'').replace(/\+/g,'-').replace(/\//g,'_');
}

function pushSupported(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && (typeof Notification === 'function');
}

async function pushSubscribe(){
  if(!pushSupported()) throw new Error('Push notifications not supported in this browser');
  if(!shopifyConfigured()) throw new Error('Set up Shopify in Settings first (Worker URL + key needed)');
  // Permission first — has to be triggered by user gesture
  var perm = Notification.permission;
  if(perm !== 'granted'){
    perm = await Notification.requestPermission();
    if(perm !== 'granted') throw new Error('Notification permission was denied');
  }
  // Register the service worker (relative to /app/)
  var reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  // Use existing subscription if there is one, otherwise create
  var sub = await reg.pushManager.getSubscription();
  if(!sub){
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
  }
  // Generate (or re-use) a stable random clientId for this device
  var clientId = ls('pushClientId', null);
  if(!clientId){
    clientId = (uid()+uid()).replace(/[^a-z0-9]/gi,'').slice(0,24);
    lsSet('pushClientId', clientId);
  }
  // Tell the SW the clientId so it can poll back on push events
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage({type:'set-client-id', clientId:clientId});
  } else {
    // Wait for the active worker, then postMessage
    if(reg.active) reg.active.postMessage({type:'set-client-id', clientId:clientId});
  }
  // Tell the worker about this subscription so it can address pushes here
  await shopifyFetch('/push/subscribe',{method:'POST',body:JSON.stringify({
    clientId: clientId,
    endpoint: sub.endpoint,
    keys: {
      p256dh: arrayBufferToBase64Url(sub.getKey('p256dh')),
      auth: arrayBufferToBase64Url(sub.getKey('auth'))
    },
    userAgent: navigator.userAgent.slice(0, 200)
  })});
  return {clientId:clientId, endpoint:sub.endpoint};
}

async function pushUnsubscribe(){
  var clientId = ls('pushClientId', null);
  // Tell the worker to forget us
  if(clientId && shopifyConfigured()){
    try{ await shopifyFetch('/push/unsubscribe',{method:'POST',body:JSON.stringify({clientId:clientId})}); }
    catch(e){ console.warn('worker unsubscribe failed', e); }
  }
  // Cancel the browser subscription
  if(pushSupported()){
    try{
      var reg = await navigator.serviceWorker.getRegistration();
      if(reg){
        var sub = await reg.pushManager.getSubscription();
        if(sub) await sub.unsubscribe();
        if(reg.active) reg.active.postMessage({type:'clear-client-id'});
      }
    } catch(e){ console.warn('browser unsubscribe failed', e); }
  }
  localStorage.removeItem('gecko_pushClientId');
}

  var clientId = ls('pushClientId', null);

  return await shopifyFetch('/push/test',{method:'POST',body:JSON.stringify({clientId:clientId})});

// Broadcast a push to every subscribed device. Used by the local-state
// triggers (manual-release-due, low-stock) since the worker can't see
// localStorage. Worker-side dedupes by dedupKey for 24h, so a noisy
// caller can't actually spam users — but we also gate locally so we
// don't even make the request more than once per day per trigger.
function pushBroadcast(payload){
  if(!shopifyConfigured()) return Promise.resolve({ok:false, skipped:'unconfigured'});
  return shopifyFetch('/push/broadcast',{method:'POST',body:JSON.stringify(payload)});
}

// Daily-once gate. Returns true when this trigger key hasn't fired
// yet today (local date). Stamps it once true so subsequent calls
// in the same day return false.
function shouldFireTriggerToday(triggerKey){
  var todayStr = new Date().toISOString().slice(0,10); // YYYY-MM-DD local-ish
  var seen = ls('pushTriggerSeen', {});
  if(seen[triggerKey] === todayStr) return false;
  seen[triggerKey] = todayStr;
  lsSet('pushTriggerSeen', seen);
  return true;
}

// Convert a scheduled batch into a real batch, prompting for the same
// scent/units/notes that logBatch asks for. Used by CalendarPage's
// Mark Complete button so a scheduled day rolling into a real batch
// captures the same metadata as a normally-logged one.
// Returns a Promise that resolves with the final batch (or null if the
// user cancelled).
function markScheduledComplete(scheduled){
  var recipe = getAllRecipes().find(function(r){return r.id===scheduled.recipeId});
  if(!recipe){
    showToast('Recipe not found — log it manually.');
    return Promise.resolve(null);
  }
  // Pre-fill from the scheduled row
  var batch = {
    id: uid(),
    batchNumber: genBatchNum(recipe.name),
    recipeId: recipe.id,
    recipeName: recipe.name,
    recipeVersion: recipe.version || 'V1.0',
    scent: scheduled.scent || '',
    batchSizeGrams: (scheduled.units || 0) * (scheduled.fillWeight || 50),
    unitsProduced: scheduled.units || 0,
    containerSize: scheduled.fillWeight || 50,
    date: today(),
    qcResults: [],
    notes: '',
    totalCost: 0,
    status: 'completed',
    author: ls('activeProfile','Heath'),
    expiryDate: ''
  };
  return dialogPrompt('Production notes (optional)', '', {
    multiline: true,
    placeholder: 'Anything different from the recipe? Issues? Adjustments?',
    body: 'Logging scheduled batch for ' + recipe.name + ' on ' + fmtDate(scheduled.date) + '.'
  }).then(function(notes){
    if(notes !== null && notes !== undefined) batch.notes = notes || '';
    return dialogPrompt('Units produced', String(scheduled.units || 10), {
      inputType: 'number',
      body: 'How many finished units came out of this batch?'
    });
  }).then(function(units){
    if(units === null) return null;
    batch.unitsProduced = parseInt(units, 10) || 0;
    if(recipe.scentProfiles && recipe.scentProfiles.length > 0){
      var defaultScent = batch.scent || recipe.scentProfiles[0].name;
      return dialogPrompt('Scent variant', defaultScent, {
        body: 'Which scent did you make?'
      });
    }
    return null;
  }).then(function(scent){
    if(scent === null && (!recipe.scentProfiles || recipe.scentProfiles.length === 0)){
      // Skipped because there are no scents — that's fine.
    } else if(scent === null){
      // User cancelled at the scent prompt
      return null;
    } else if(typeof scent === 'string'){
      batch.scent = scent || '';
    }
    batch.batchSizeGrams = batch.unitsProduced * (batch.containerSize || 50);
    batch.expiryDate = addMonths(today(), parseShelfMonths(recipe.shelfLife || '12 months'));
    batch.loggedAt = Date.now();

    var logs = ls('batchLogs',[]);
    logs.push(batch);
    lsSet('batchLogs', logs);
    showToast('Batch ' + batch.batchNumber + ' logged');
    logActivity('logged batch (from schedule)', '#' + batch.batchNumber + ' of ' + recipe.name);
    if(typeof enqueueBatchToShopify === 'function') enqueueBatchToShopify(batch, recipe);
    if(typeof publishBatchPublic === 'function') publishBatchPublic(batch, recipe);
    return batch;
  });
}

// Returns the list of batches whose recipe is mapped curingMode:'manual'
// AND whose release date has passed (loggedAt + curingDays). Excludes
// batches already released or marked failed/sold-out. Used by:
//   - The dashboard attention inbox
//   - The daily push trigger (manual-release-due)
function getManualReleaseDueBatches(){
  var batches = ls('batchLogs',[]);
  var mappings = ls('shopifyMappings',{});
  var now = Date.now();
  var out = [];
  for(var i = 0; i < batches.length; i++){
    var b = batches[i];
    if(!b || !b.recipeId) continue;
    if(b.shopifyReleased) continue;
    if(b.status && (b.status === 'failed' || b.status === 'sold_out')) continue;
    var m = mappings[b.recipeId];
    if(!m || m.curingMode !== 'manual') continue;
    var loggedAt = b.loggedAt || (b.date ? new Date(b.date).getTime() : null);
    if(!loggedAt) continue;
    var days = parseInt(m.curingDays, 10) || 14;
    var dueAt = loggedAt + days * 86400 * 1000;
    if(dueAt <= now){
      out.push({ batch: b, dueAt: dueAt, recipeName: b.recipeName || '' });
    }
  }
  return out;
}

// Fire the daily push triggers if their conditions are met. Cheap to
// call on every Dashboard mount — gated by shouldFireTriggerToday +
// the worker-side dedup so it'll never spam.
function maybeFireDailyPushTriggers(){
  // Need a push subscription on this device for any of this to be useful
  // — and shopifyConfigured for the broadcast endpoint.
  if(!shopifyConfigured()) return;
  if(!ls('pushClientId', null)) return;

  var todayStr = new Date().toISOString().slice(0,10);

  // Manual-release-due
  var due = getManualReleaseDueBatches();
  if(due.length > 0 && shouldFireTriggerToday('manual_release_due')){
    var first = due[0].batch.batchNumber || 'A batch';
    var title = due.length === 1
      ? 'Batch ready to release'
      : due.length + ' batches ready to release';
    var body = due.length === 1
      ? 'Batch ' + first + ' is past its curing window. Tap to release to Shopify.'
      : first + ' and ' + (due.length - 1) + ' other' + (due.length === 2 ? '' : 's') + ' are ready. Tap to review.';
    pushBroadcast({
      title: title,
      body: body,
      kind: 'manual_release_due',
      url: '/',
      dedupKey: 'manual_release_' + todayStr
    }).catch(function(e){ console.warn('manual_release_due push failed', e) });
  }

  // Low-stock
  var lowItems = (typeof getLowStockItems === 'function') ? getLowStockItems() : [];
  if(lowItems.length > 0 && shouldFireTriggerToday('low_stock')){
    var urgentCount = lowItems.filter(function(it){return it.urgent}).length;
    var lsTitle = urgentCount > 0
      ? urgentCount + ' ingredient' + (urgentCount===1?'':'s') + ' need reordering'
      : lowItems.length + ' ingredient' + (lowItems.length===1?'':'s') + ' running low';
    var lsBody = lowItems.slice(0,3).map(function(it){return it.name}).join(', ') +
      (lowItems.length > 3 ? ' and ' + (lowItems.length - 3) + ' more' : '') +
      '. Tap to check inventory.';
    pushBroadcast({
      title: lsTitle,
      body: lsBody,
      kind: 'low_stock',
      url: '/',
      dedupKey: 'low_stock_' + todayStr
    }).catch(function(e){ console.warn('low_stock push failed', e) });
  }
}

// Strip the data URL prefix and return just the base64 chunk.
function dataUrlToBase64(dataUrl){
  var i = dataUrl.indexOf(',');
  return i >= 0 ? dataUrl.substring(i+1) : dataUrl;
}
function dataUrlContentType(dataUrl){
  // "data:image/jpeg;base64,...." → "image/jpeg"
  var m = /^data:([^;,]+)/.exec(dataUrl||'');
  return m ? m[1] : 'image/jpeg';
}

/**
 * Enqueue inventory pushes for a finished batch. Called from logBatch.
 *
 * For each Shopify product the recipe maps to, pushes +unitsProduced to that
 * variant's inventory. Curing mode determines releaseAt:
 *   - immediate: now
 *   - auto:      now + curingDays * 86400 * 1000
 *   - manual:    skip (user clicks Release later in queue UI)
 *
 * Skips silently if Shopify isn't configured, no mapping exists, or units=0.
 * Errors are swallowed and toasted — never block the batch save.
 */
async function enqueueBatchToShopify(batch, recipe, opts){
  opts = opts || {};
  try{
    if(!shopifyConfigured()) return;
    if(!batch || !batch.id || !recipe) return;
    var units = parseInt(batch.unitsProduced,10);
    if(!units || units <= 0) return;
    var mappings = ls('shopifyMappings',{});
    var m = mappings[recipe.id];
    if(!m || !m.products || m.products.length === 0) return;
    var cfg = shopifyConfig();
    if(!cfg.locationId){
      showToast('Set primary Shopify location first (Test connection in Settings).');
      return;
    }
    // Manual curing waits for an explicit click on the batch row. Pass
    // {forceManual:true} from the manual-release UI to override.
    if(m.curingMode === 'manual' && !opts.forceManual) return;

    var releaseAt = Date.now();
    if(m.curingMode === 'auto' && !opts.forceManual){
      releaseAt = Date.now() + (parseInt(m.curingDays,10) || 14) * 86400 * 1000;
    }
    var enqueued = 0, failed = 0;
    for(var i=0;i<m.products.length;i++){
      var prod = m.products[i];
      if(!prod.productId || !prod.variantId || !prod.inventoryItemId){
        // Mapping was saved before we started capturing inventoryItemId.
        // Skip silently; the user can re-save the mapping to populate it.
        failed++;
        continue;
      }
      try{
        await shopifyEnqueuePush({
          batchId: batch.id,
          recipeId: recipe.id,
          productId: prod.productId,
          variantId: prod.variantId,
          inventoryItemId: prod.inventoryItemId,
          locationId: cfg.locationId,
          delta: units,
          reason: 'batch_finished',
          releaseAt: releaseAt
        });
        enqueued++;
      } catch(e){
        failed++;
        console.warn('enqueueBatchToShopify: failed for product '+prod.productId, e);
      }
    }
    if(enqueued > 0){
      var when = m.curingMode === 'immediate' ? 'now' : ('in '+(m.curingDays||14)+'d');
      showToast('Queued for Shopify ('+enqueued+' product'+(enqueued===1?'':'s')+', releases '+when+')');
    }
    if(failed > 0){
      console.warn('enqueueBatchToShopify: '+failed+' mapping(s) skipped — re-save the mapping to refresh');
    }
  } catch(e){
    // Never block the batch save on a Shopify hiccup.
    console.error('enqueueBatchToShopify failed', e);
  }
}

/**
 * Publish a batch to its public trust page at batch.geckocreationz.com/<code>
 * (or worker URL /b/<code> until DNS is wired). Pulls ingredient names out of
 * the recipe's phases. Status defaults to 'active' — failure flow updates
 * later by re-publishing with status:'failed'.
 *
 * Skips silently if worker isn't configured. Errors never block the save.
 */
async function publishBatchPublic(batch, recipe){
  try{
    if(!shopifyConfigured()) return;
    if(!batch || !batch.batchNumber) return;
    var ingredients = [];
    if(recipe && recipe.phases){
      recipe.phases.forEach(function(p){
        (p.ingredients||[]).forEach(function(ing){
          if(ing && ing.name && ing.name.trim()) ingredients.push(ing.name.trim());
        });
      });
    }
    var madeAt = Date.parse(batch.date) || Date.now();
    var expiryAt = batch.expiryDate ? Date.parse(batch.expiryDate) : null;
    // INCI from the recipe's INCI section, if present. Pull just the
    // matching scent variant block when the recipe has multiple. Strip
    // a leading "INGREDIENTS:" prefix some recipes include.
    var inci = (typeof _extractINCI === 'function' && recipe) ? _extractINCI(recipe, batch.scent) : '';
    if(inci) inci = inci.replace(/^INGREDIENTS:\s*/i,'').trim();
    var netWeight = (typeof batch.containerSize === 'number' && batch.containerSize > 0) ? batch.containerSize : null;
    // Translate the app's batch.status to the public-page taxonomy.
    // Anything that isn't explicitly failed or sold_out shows as 'active'
    // (this includes 'completed', undefined, 'pending', etc.)
    var publicStatus = (batch.status === 'failed') ? 'failed'
                      : (batch.status === 'sold_out') ? 'sold_out'
                      : 'active';
    await workerPublishBatch({
      batchCode: batch.batchNumber,
      recipeName: batch.recipeName || (recipe && recipe.name) || 'Batch',
      madeAt: madeAt,
      expiryAt: expiryAt || undefined,
      netWeightG: netWeight || undefined,
      ingredients: ingredients,
      inci: inci || undefined,
      status: publicStatus,
      failureReason: (publicStatus === 'failed' && batch.failureReason) ? batch.failureReason : undefined,
      productName: batch.scent ? ((batch.recipeName||recipe.name||'')+' — '+batch.scent) : undefined
    });
  } catch(e){
    console.warn('publishBatchPublic failed', e);
  }
}

function fmt(n){return typeof n==='number'?n.toFixed(2):n}

// Lossy but structured: turn the HTML strings stored in section.html back
// into Markdown so exports can be re-imported by the parser.
function htmlToMarkdown(html){
  if(!html) return '';
  var s = String(html);
  // Normalize CRLF
  s = s.replace(/\r\n/g,'\n');
  // Convert headings
  s = s.replace(/<h1[^>]*>([\s\S]*?)<\/h1>/gi,'\n# $1\n');
  s = s.replace(/<h2[^>]*>([\s\S]*?)<\/h2>/gi,'\n## $1\n');
  s = s.replace(/<h3[^>]*>([\s\S]*?)<\/h3>/gi,'\n### $1\n');
  s = s.replace(/<h4[^>]*>([\s\S]*?)<\/h4>/gi,'\n#### $1\n');
  // Bold / italic
  s = s.replace(/<(strong|b)[^>]*>([\s\S]*?)<\/\1>/gi,'**$2**');
  s = s.replace(/<(em|i)[^>]*>([\s\S]*?)<\/\1>/gi,'_$2_');
  // Code
  s = s.replace(/<code[^>]*>([\s\S]*?)<\/code>/gi,'`$1`');
  // Blockquote
  s = s.replace(/<blockquote[^>]*>([\s\S]*?)<\/blockquote>/gi, function(_,inner){
    return '\n> '+inner.replace(/<[^>]+>/g,'').trim().replace(/\n/g,'\n> ')+'\n';
  });
  // Tables: rough conversion
  s = s.replace(/<table[^>]*>([\s\S]*?)<\/table>/gi, function(_,tbl){
    var rows = [];
    tbl.replace(/<tr[^>]*>([\s\S]*?)<\/tr>/gi, function(__,row){
      var cells = [];
      row.replace(/<(?:th|td)[^>]*>([\s\S]*?)<\/(?:th|td)>/gi, function(___,cell){
        cells.push(cell.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').replace(/\|/g,'\\|').trim());
      });
      if(cells.length) rows.push(cells);
    });
    if(rows.length === 0) return '';
    var md = '\n| ' + rows[0].join(' | ') + ' |\n';
    md += '|' + rows[0].map(function(){return '---'}).join('|') + '|\n';
    for(var i=1;i<rows.length;i++) md += '| ' + rows[i].join(' | ') + ' |\n';
    return md+'\n';
  });
  // Lists
  s = s.replace(/<ul[^>]*>([\s\S]*?)<\/ul>/gi, function(_,inner){
    return '\n' + inner.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, function(__,li){
      return '- ' + li.replace(/<[^>]+>/g,'').trim() + '\n';
    });
  });
  s = s.replace(/<ol[^>]*>([\s\S]*?)<\/ol>/gi, function(_,inner){
    var n = 0;
    return '\n' + inner.replace(/<li[^>]*>([\s\S]*?)<\/li>/gi, function(__,li){
      n++;
      return n + '. ' + li.replace(/<[^>]+>/g,'').trim() + '\n';
    });
  });
  // Links
  s = s.replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi,'[$2]($1)');
  // Line breaks & paragraphs
  s = s.replace(/<br\s*\/?>/gi,'\n');
  s = s.replace(/<\/p>/gi,'\n\n');
  s = s.replace(/<p[^>]*>/gi,'');
  // Strip remaining tags
  s = s.replace(/<[^>]+>/g,'');
  // Decode common entities
  s = s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ');
  // Collapse excess blank lines
  s = s.replace(/\n{3,}/g,'\n\n').trim();
  return s;
}
function fmtDate(d){if(!d)return '';var dt=new Date(d);return dt.toLocaleDateString('en-NZ',{day:'numeric',month:'short',year:'numeric'})}
function today(){return new Date().toISOString().split('T')[0]}
