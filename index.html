// ── Sync queue status panel ──
// Shows pending / in-flight / failed Shopify pushes from the batch flow.
// Auto-refreshes every 15 seconds while visible.
function QueueStatusPanel(){
  var qs = useState({state:'idle', items:[]});
  var status = qs[0], setStatus = qs[1];

  function refresh(){
    if(!shopifyConfigured()){
      setStatus({state:'unconfigured', items:[]});
      return;
    }
    setStatus(function(prev){return {state:'loading', items: prev.items}});
    shopifyListQueue({limit:50}).then(function(data){
      setStatus({state:'loaded', items: data.items || []});
    }).catch(function(err){
      setStatus({state:'error', message: err.message, items:[]});
    });
  }

  useEffect(function(){
    refresh();
    var iv = setInterval(refresh, 15000);
    return function(){ clearInterval(iv) };
  },[]);

  function processNow(){
    showToast('Processing due items…');
    shopifyProcessDue().then(function(data){
      showToast('Processed '+data.examined+' (✓ '+data.succeeded+' · ✗ '+data.failed+')');
      refresh();
    }).catch(function(err){
      showToast('Process failed: '+err.message);
    });
  }
  function cancelItem(id){
    shopifyCancelQueueItem(id).then(function(){ showToast('Cancelled'); refresh(); })
      .catch(function(err){ showToast('Cancel failed: '+err.message) });
  }

  var items = status.items || [];
  var counts = items.reduce(function(acc,it){
    acc[it.status] = (acc[it.status]||0)+1; return acc;
  },{});
  var pendingCount = (counts.pending||0) + (counts.in_flight||0);
  var failedCount = counts.failed || 0;
  var doneCount = counts.done || 0;
  var cancelledCount = counts.cancelled || 0;

  var statusColor = function(s){
    return s==='done' ? 'var(--green)' :
           s==='failed' ? 'var(--red)' :
           s==='in_flight' ? 'var(--gold)' :
           s==='cancelled' ? 'var(--text-muted)' :
           'var(--text-light)';
  };

  return e('div',{className:'card'},
    e('div',{className:'card-body',style:{padding:'16px'}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},
        e('div',{style:{fontSize:'14px',fontWeight:600}},'Sync Queue'),
        e('div',{style:{display:'flex',gap:'8px'}},
          e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:refresh}, e('span',{style:{display:'inline-flex',alignItems:'center',gap:'5px'}}, Icon('refresh',12), 'Refresh')),
          e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:processNow,
            disabled: pendingCount===0},'Process due')
        )
      ),
      e('div',{style:{display:'flex',gap:'12px',fontSize:'12px',color:'var(--text-muted)',marginBottom:'10px'}},
        e('span',null, pendingCount + ' pending'),
        failedCount > 0 ? e('span',{style:{color:'var(--red)',fontWeight:600}}, failedCount + ' failed') : null,
        e('span',null, doneCount + ' done'),
        cancelledCount > 0 ? e('span',null, cancelledCount + ' cancelled') : null
      ),

      status.state==='loading' && items.length===0 ? e('div',null,
        [0,1,2].map(function(i){
          return e(Skel,{key:i,style:{height:'14px',width:(80-i*12)+'%',marginBottom:'var(--space-1)'}});
        })
      ) : null,
      status.state==='error' ? e(ErrorCard,{title:'Queue load failed',message:status.message,onRetry:refresh}) : null,
      status.state==='unconfigured' ? e('div',{style:{fontSize:'12px',color:'var(--text-muted)'}},'Configure Shopify first.') : null,
      items.length === 0 && status.state==='loaded' ? EmptyState({iconName:'package', title:'Queue is empty', message:'Finish a batch with a mapped recipe to trigger your first push.'}) : null,

      items.length > 0 ? e('div',{style:{maxHeight:'300px',overflow:'auto',border:'1px solid var(--border-light)',borderRadius:'6px'}},
        items.map(function(it){
          var when = new Date(it.release_at).toLocaleString('en-NZ',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
          return e('div',{key:it.id,style:{
            padding:'8px 10px',borderBottom:'1px solid var(--border-light)',
            display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px',fontSize:'11px'
          }},
            e('div',{style:{flex:1,minWidth:0}},
              e('div',{style:{display:'flex',gap:'6px',alignItems:'center'}},
                e('span',{style:{
                  fontSize:'10px',padding:'1px 6px',borderRadius:'10px',fontWeight:600,
                  background:'var(--bg-elevated)',color:statusColor(it.status)
                }}, it.status.toUpperCase()),
                e('span',{style:{fontFamily:'monospace'}}, (it.delta>=0?'+':'') + it.delta + ' units'),
                e('span',{style:{color:'var(--text-muted)'}}, '· ' + it.reason)
              ),
              e('div',{style:{color:'var(--text-muted)',marginTop:'2px'}},
                'Batch ' + it.batch_id.slice(0,12) + ' · variant ' + it.variant_id + ' · release ' + when +
                (it.attempts > 0 ? ' · '+it.attempts+' attempt'+(it.attempts===1?'':'s') : '')
              ),
              it.last_error ? e('div',{style:{color:'var(--red)',marginTop:'2px'}}, 'Error: ' + it.last_error) : null
            ),
            it.status === 'pending' || it.status === 'failed'
              ? e('button',{className:'tool-btn',style:{fontSize:'10px',padding:'2px 8px',color:'var(--red)'},
                  onClick:function(){cancelItem(it.id)}}, 'Cancel')
              : null
          );
        })
      ) : null
    )
  );
}

// ── Bundle configuration ──
// A "bundle" is a Shopify product that, when sold, decrements stock from other
// products (its components). E.g. a Gift Set that contains a Tallow Stick + Lip
// Balm. When the bundle SKU is purchased we deduct one stick and one balm.
//
// Shopify's various bundle plugins use different metafield conventions, so for
// Phase 1 we configure bundles manually here. Auto-import from a specific
// plugin can come later if Heath tells us which one his store uses.
function BundleConfigSection(props){
  var bs = useState(ls('bundleConfigs',{}));
  var bundles = bs[0], setBundles = bs[1];
  var es = useState(null);
  var editingBundleId = es[0], setEditingBundleId = es[1];
  var as = useState('');
  var addProductId = as[0], setAddProductId = as[1];

  function persist(next){
    setBundles(next);
    lsSet('bundleConfigs', next);
    // Also push to Worker KV so the orders-paid webhook (server-to-server)
    // can read the bundle map when an order arrives. Best-effort — the local
    // copy is the source of truth; KV is a cache for the webhook handler.
    if(shopifyConfigured()){
      var cfg = shopifyConfig();
      shopifyFetch('/sync/bundle-configs',{
        method:'POST',
        body: JSON.stringify({bundles: next, locationId: cfg.locationId || null})
      }).catch(function(err){
        console.warn('bundle config sync to KV failed', err);
      });
    }
  }
  function addBundle(){
    var pid = parseInt(addProductId,10);
    if(!pid){ showToast('Pick a product first'); return }
    if(bundles[pid]){ showToast('Already a bundle'); return }
    var next = Object.assign({}, bundles);
    next[pid] = {components:[]};
    persist(next);
    setAddProductId('');
    setEditingBundleId(pid);
    showToast('Bundle added — pick its components');
  }
  function removeBundle(productId){
    dialogConfirm('Remove bundle?','This product will no longer deduct from component stock when sold.',{confirmLabel:'Remove',danger:true}).then(function(ok){
      if(!ok) return;
      var next = Object.assign({}, bundles);
      delete next[productId];
      persist(next);
      setEditingBundleId(null);
    });
  }
  function saveComponents(productId, components){
    var next = Object.assign({}, bundles);
    next[productId] = {components: components};
    persist(next);
    setEditingBundleId(null);
    showToast('Bundle saved');
  }

  var productsById = {};
  props.products.forEach(function(p){ productsById[p.id] = p; });

  var bundleIds = Object.keys(bundles).map(function(s){return parseInt(s,10)});
  var nonBundleProducts = props.products.filter(function(p){return bundleIds.indexOf(p.id) === -1});

  return e('div',{className:'card'},
    e('div',{className:'card-body',style:{padding:'16px'}},
      e('div',{style:{fontSize:'14px',fontWeight:600,marginBottom:'10px'}},'Bundles → Component Products'),
      e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginBottom:'12px'}},
        'When a bundle SKU sells on Shopify, deduct stock from its components instead of the bundle itself. Configure existing Shopify bundles here.'),

      // Add bundle dropdown
      e('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'12px'}},
        e('select',{className:'form-select',value:addProductId,
          onChange:function(ev){setAddProductId(ev.target.value)},style:{flex:1,maxWidth:'420px'}},
          e('option',{value:''},'— pick a product to mark as a bundle —'),
          nonBundleProducts.map(function(p){
            return e('option',{key:p.id,value:p.id}, p.title);
          })
        ),
        e('button',{className:'tool-btn primary',onClick:addBundle},'+ Add bundle')
      ),

      bundleIds.length === 0 ? e('div',{style:{fontSize:'12px',color:'var(--text-muted)',fontStyle:'italic'}},
        'No bundles configured yet.') : null,

      bundleIds.map(function(bid){
        var product = productsById[bid];
        var cfg = bundles[bid];
        var isEditing = editingBundleId === bid;
        var componentLabels = (cfg.components||[]).map(function(c){
          var p = productsById[c.productId];
          return (p ? p.title : '(missing)') + (c.qty>1 ? ' ×'+c.qty : '');
        });
        return e('div',{key:bid,style:{
          border:'1px solid var(--border)',borderRadius:'8px',padding:'12px',marginBottom:'8px',
          background:'var(--bg-elevated)'
        }},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px'}},
            e('div',{style:{flex:1,minWidth:0}},
              e('div',{style:{fontSize:'13px',fontWeight:600,marginBottom:'4px'}},
                product ? product.title : '(product missing — id '+bid+')'),
              componentLabels.length === 0
                ? e('div',{style:{fontSize:'11px',color:'var(--red)',fontStyle:'italic'}},'No components — add some or remove this bundle')
                : e('div',{style:{fontSize:'11px',color:'var(--text-muted)'}}, 'Components: ' + componentLabels.join(', '))
            ),
            e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},
              onClick:function(){setEditingBundleId(isEditing?null:bid)}},
              isEditing ? 'Close' : 'Edit')
          ),
          isEditing ? e(BundleEditor,{
            bundleProduct: product,
            allProducts: props.products,
            initial: cfg.components || [],
            onSave: function(components){ saveComponents(bid, components); },
            onRemove: function(){ removeBundle(bid); }
          }) : null
        );
      })
    )
  );
}

function BundleEditor(props){
  var cs = useState(props.initial.slice());
  var components = cs[0], setComponents = cs[1];

  function addComponent(){
    setComponents(components.concat([{productId:'', variantId:null, qty:1}]));
  }
  function setComponent(idx, patch){
    setComponents(components.map(function(c,i){
      return i === idx ? Object.assign({}, c, patch) : c;
    }));
  }
  function removeComponent(idx){
    setComponents(components.filter(function(_,i){return i !== idx}));
  }
  function save(){
    var clean = components
      .filter(function(c){return c.productId})
      .map(function(c){
        var pid = parseInt(c.productId,10);
        var p = props.allProducts.find(function(x){return x.id === pid});
        var vid = c.variantId ? parseInt(c.variantId,10) :
                  (p && p.variants && p.variants[0] ? p.variants[0].id : null);
        var variant = p && p.variants ? p.variants.find(function(v){return v.id === vid}) : null;
        return {
          productId: pid,
          variantId: vid,
          inventoryItemId: variant ? variant.inventory_item_id : null,
          qty: parseInt(c.qty,10) || 1
        };
      });
    if(clean.length === 0){ showToast('Add at least one component'); return }
    props.onSave(clean);
  }

  // Don't allow adding the bundle product as its own component
  var availableProducts = props.allProducts.filter(function(p){
    return !props.bundleProduct || p.id !== props.bundleProduct.id;
  });

  return e('div',{style:{
    marginTop:'12px',paddingTop:'12px',borderTop:'1px solid var(--border-light)'
  }},
    e('div',{style:{fontSize:'12px',fontWeight:600,marginBottom:'8px'}},'Components'),
    e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginBottom:'8px'}},
      'Each row deducts that quantity from the chosen product when one bundle sells.'),

    components.length === 0 ? e('div',{style:{fontSize:'12px',color:'var(--text-muted)',fontStyle:'italic',marginBottom:'8px'}},
      'No components yet — click + Add component below.') : null,

    components.map(function(c,idx){
      var pid = c.productId ? parseInt(c.productId,10) : null;
      var picked = pid ? availableProducts.find(function(p){return p.id === pid}) : null;
      var hasMultiVariant = picked && (picked.variants||[]).length > 1;
      return e('div',{key:idx,style:{
        display:'flex',gap:'6px',alignItems:'center',marginBottom:'6px',flexWrap:'wrap'
      }},
        e('select',{className:'form-select',value:c.productId||'',
          onChange:function(ev){setComponent(idx, {productId: ev.target.value, variantId:null})},
          style:{flex:1,minWidth:'200px'}},
          e('option',{value:''},'— pick component product —'),
          availableProducts.map(function(p){
            return e('option',{key:p.id,value:p.id}, p.title);
          })
        ),
        hasMultiVariant ? e('select',{className:'form-select',value:c.variantId||'',
          onChange:function(ev){setComponent(idx, {variantId: ev.target.value})},
          style:{width:'160px'}},
          picked.variants.map(function(v){
            return e('option',{key:v.id,value:v.id}, (v.sku ? v.sku+' · ' : '') + (v.title||'Default'));
          })
        ) : null,
        e('span',{style:{fontSize:'11px',color:'var(--text-muted)'}},'×'),
        e('input',{className:'form-input',type:'number',min:1,max:50,value:c.qty,
          onChange:function(ev){setComponent(idx, {qty: ev.target.value})},
          style:{width:'70px'}}),
        e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 8px',color:'var(--red)'},
          onClick:function(){removeComponent(idx)}},'Remove')
      );
    }),

    e('div',{style:{display:'flex',gap:'8px',marginTop:'8px',flexWrap:'wrap'}},
      e('button',{className:'tool-btn',onClick:addComponent},'+ Add component'),
      e('button',{className:'tool-btn primary',onClick:save},'Save'),
      e('button',{className:'tool-btn',style:{color:'var(--red)'},onClick:function(){props.onRemove()}},'Remove bundle')
    )
  );
}

function MappingEditor(props){
  var ps = useState(props.initial.prefix);
  var prefix = ps[0], setPrefix = ps[1];
  var cs = useState(props.initial.curingMode);
  var curingMode = cs[0], setCuringMode = cs[1];
  var cds = useState(props.initial.curingDays || 14);
  var curingDays = cds[0], setCuringDays = cds[1];
  var picks = useState(props.initial.products.slice());
  var picked = picks[0], setPicked = picks[1];

  function togglePick(productId){
    var existing = picked.find(function(p){return p.productId === productId});
    if(existing){
      setPicked(picked.filter(function(p){return p.productId !== productId}));
    } else {
      var p = props.products.find(function(x){return x.id === productId});
      var firstVariant = (p && p.variants && p.variants[0]) || null;
      setPicked(picked.concat([{productId:productId, variantId: firstVariant ? firstVariant.id : null}]));
    }
  }
  function setVariant(productId, variantId){
    setPicked(picked.map(function(p){
      return p.productId === productId ? {productId:productId, variantId:variantId} : p;
    }));
  }
  function save(){
    if(!/^[A-Z0-9]{1,8}$/i.test(prefix)){
      showToast('Prefix: 1–8 letters/numbers');
      return;
    }
    // Capture inventory_item_id alongside variant id — Phase 2 batch enqueue
    // needs it and resolving here once is cheaper than re-fetching products.
    var clean = picked.map(function(p){
      var prod = props.products.find(function(x){return x.id === p.productId});
      var variant = prod && prod.variants ? prod.variants.find(function(v){return v.id === p.variantId}) : null;
      return {
        productId: p.productId,
        variantId: p.variantId,
        inventoryItemId: variant ? variant.inventory_item_id : null
      };
    });
    props.onSave({
      prefix: prefix.toUpperCase(),
      curingMode: curingMode,
      curingDays: parseInt(curingDays,10) || 14,
      products: clean
    });
  }

  return e('div',{style:{
    marginTop:'12px',paddingTop:'12px',borderTop:'1px solid var(--border-light)'
  }},
    e('div',{className:'form-group'},
      e('label',{className:'form-label'},'Batch code prefix'),
      e('input',{className:'form-input',type:'text',value:prefix,
        onChange:function(ev){setPrefix(ev.target.value)},
        style:{width:'120px',textTransform:'uppercase'}}),
      e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginTop:'4px'}},
        'Used in batch codes like '+(prefix||'').toUpperCase()+'-2026-001. Letters/numbers, max 8.')
    ),

    e('div',{className:'form-group'},
      e('label',{className:'form-label'},'Stock release'),
      e('select',{className:'form-select',value:curingMode,
        onChange:function(ev){setCuringMode(ev.target.value)},style:{width:'220px'}},
        e('option',{value:'auto'},'Auto-release after N days'),
        e('option',{value:'manual'},'Manual release button'),
        e('option',{value:'immediate'},'Push to Shopify immediately')
      ),
      curingMode==='auto' ? e('div',{style:{marginTop:'6px',display:'flex',alignItems:'center',gap:'8px'}},
        e('span',{style:{fontSize:'12px',color:'var(--text-muted)'}},'Wait'),
        e('input',{className:'form-input',type:'number',min:0,max:120,value:curingDays,
          onChange:function(ev){setCuringDays(ev.target.value)},
          style:{width:'80px'}}),
        e('span',{style:{fontSize:'12px',color:'var(--text-muted)'}},'days before pushing to Shopify')
      ) : null
    ),

    e('div',{className:'form-group'},
      e('label',{className:'form-label'},'Linked Shopify products'),
      e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginBottom:'6px'}},
        picked.length === 0 ? 'None linked yet — pick at least one to enable sync for this recipe.' :
        'Linked: ' + picked.length + ' product' + (picked.length===1?'':'s')),
      e('div',{style:{maxHeight:'240px',overflow:'auto',border:'1px solid var(--border)',borderRadius:'6px'}},
        props.products.map(function(p){
          var pickEntry = picked.find(function(x){return x.productId === p.id});
          var isPicked = !!pickEntry;
          var hasMultiVariant = (p.variants||[]).length > 1;
          return e('div',{key:p.id,style:{
            padding:'8px 10px',borderBottom:'1px solid var(--border-light)',
            background: isPicked ? 'var(--gold-dim)' : 'transparent'
          }},
            e('label',{style:{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer'}},
              e('input',{type:'checkbox',checked:isPicked,
                onChange:function(){togglePick(p.id)}}),
              e('span',{style:{flex:1,fontSize:'12px'}},p.title),
              e('span',{style:{fontSize:'10px',color:'var(--text-muted)'}}, p.status)
            ),
            isPicked && hasMultiVariant ? e('div',{style:{marginTop:'4px',marginLeft:'24px'}},
              e('select',{className:'form-select',value:pickEntry.variantId||'',
                onChange:function(ev){setVariant(p.id, parseInt(ev.target.value,10))},
                style:{width:'100%',fontSize:'11px'}},
                p.variants.map(function(v){
                  return e('option',{key:v.id,value:v.id}, (v.sku ? v.sku+' · ' : '') + (v.title||'Default') + ' · $'+v.price);
                })
              )
            ) : null
          );
        })
      )
    ),

    e('div',{style:{display:'flex',gap:'8px',marginTop:'8px'}},
      e('button',{className:'tool-btn primary',onClick:save},'Save'),
      e('button',{className:'tool-btn',onClick:function(){props.onClear && props.onClear()}},'Clear mapping')
    )
  );
}

// ── Activity Feed Page ──
// Full-page view of every recorded user action (`logActivity`) with
// filters for user, action, and a freetext search over the detail
// field. Cloud Sync card on Settings shows the last 8 — this is the
// "see everything" companion. Capped at 50 server-side per the

function ActivityFeedPage(props){
  useSyncTick();
  var fs = useState('');
  var search = fs[0], setSearch = fs[1];
  var fu = useState('all');
  var filterUser = fu[0], setFilterUser = fu[1];
  var fa = useState('all');
  var filterAction = fa[0], setFilterAction = fa[1];

  var feed = ls('activityFeed', []);
  // Build distinct user + action lists for the filter dropdowns
  var users = ['all'].concat(Array.from(new Set(feed.map(function(a){return a.user||'unknown'}))));
  var actions = ['all'].concat(Array.from(new Set(feed.map(function(a){return a.action||''}))).filter(Boolean));

  var lcSearch = search.trim().toLowerCase();
  var rows = feed.filter(function(a){

    var blob = ((a.action||'') + ' ' + (a.detail||'') + ' ' + (a.user||'')).toLowerCase();

  });

    if(diff < 3600000) return Math.floor(diff/60000) + 'm ago';

        e('div',{style:{flex:'1 1 220px',minWidth:'180px'}},
          e('label',{className:'form-label'},'Search'),
          e('input',{className:'form-input',value:search,onChange:function(ev){setSearch(ev.target.value)},placeholder:'recipe name, batch number, anything…'})
        ),
        e('div',{style:{flex:'1 1 140px',minWidth:'120px'}},
          e('label',{className:'form-label'},'User'),
          e('select',{className:'form-select',value:filterUser,onChange:function(ev){setFilterUser(ev.target.value)},style:{width:'100%'}},
            users.map(function(u){return e('option',{key:u,value:u}, u==='all' ? 'All users' : u)})
          )
        ),
        e('div',{style:{flex:'1 1 160px',minWidth:'140px'}},
          e('label',{className:'form-label'},'Action'),
          e('select',{className:'form-select',value:filterAction,onChange:function(ev){setFilterAction(ev.target.value)},style:{width:'100%'}},
            actions.map(function(a){return e('option',{key:a,value:a}, a==='all' ? 'All actions' : a)})

    feed.length === 0 ? EmptyState({iconName:'clipboard', title:'No activity yet', message:'As batches log, recipes save, and statuses change, you\'ll see them here.'}) :
    rows.length === 0 ? EmptyState({iconName:'search', title:'Nothing matches', message:'Try widening the user or action filter, or clearing the search.'}) :
    e('div',null,
      e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginBottom:'6px'}}, rows.length + ' of ' + feed.length + ' entries'),
      rows.map(function(a){
        return e('div',{key:a.id, className:'batch-card', style:{padding:'12px 14px'}},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:'8px'}},
            e('div',{style:{flex:1,minWidth:0}},
              e('div',{style:{fontSize:'13px'}},
                e('span',{style:{fontWeight:600}}, a.user || 'unknown'),

// ── Worker Calls (audit log) ──
// Read-only paginated table of every signed worker call. Lives behind
// Settings → Data → Worker Calls. Pulls from the worker's GET
// /admin/audit-log endpoint, HMAC-signed like everything else. Filters
// for user + path prefix + date range help when investigating "wait,
// who did that?" moments.
function WorkerCallsPage(props){
  var rs = useState([]);
  var rows = rs[0], setRows = rs[1];
  var lds = useState({state:'idle'});
  var loadState = lds[0], setLoadState = lds[1];
  var fu = useState('');
  var filterUser = fu[0], setFilterUser = fu[1];
  var fp = useState('');
  var filterPath = fp[0], setFilterPath = fp[1];
  var ff = useState('');
  var filterFrom = ff[0], setFilterFrom = ff[1];
  var ft = useState('');
  var filterTo = ft[0], setFilterTo = ft[1];
  var nc = useState(null);
  var nextCursor = nc[0], setNextCursor = nc[1];

  function buildQuery(cursor){
    var p = ['limit=50'];
    if(filterUser) p.push('user='+encodeURIComponent(filterUser));
    if(filterPath) p.push('path='+encodeURIComponent(filterPath));
    if(filterFrom) p.push('from='+new Date(filterFrom).getTime());
    if(filterTo) p.push('to='+new Date(filterTo + 'T23:59:59').getTime());
    if(cursor) p.push('before_id='+cursor);
    return '/admin/audit-log?'+p.join('&');
  }

  function load(reset){
    if(!shopifyConfigured()){
      setLoadState({state:'unconfigured'});
      return;
    }
    setLoadState({state:'loading'});
    shopifyFetch(buildQuery(reset ? null : nextCursor)).then(function(res){
      var newRows = (res && res.rows) || [];
      setRows(reset ? newRows : rows.concat(newRows));
      setNextCursor(res && res.nextCursor ? res.nextCursor : null);
      setLoadState({state:'loaded'});
    }).catch(function(err){
      setLoadState({state:'error', message:err.message || String(err)});
    });
  }

  useEffect(function(){ load(true); },[]);

  function applyFilters(){
    setNextCursor(null);
    load(true);
  }
  function clearFilters(){
    setFilterUser('');
    setFilterPath('');
    setFilterFrom('');
    setFilterTo('');
    setNextCursor(null);
    setTimeout(function(){ load(true) }, 0);
  }

  function statusColor(code){
    if(code >= 500) return 'var(--red)';
    if(code >= 400) return 'var(--gold)';
    return 'var(--green)';
  }
  function fmtTs(ms){
    var d = new Date(ms);
    return d.toLocaleString('en-NZ',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }

  return e('div',{className:'container'},
    e('button',{className:'back-btn',onClick:props.onBack},'← Back'),
    e('div',{style:{fontSize:'16px',fontWeight:600,marginBottom:'4px'}},'Worker calls'),
    e('div',{style:{fontSize:'12px',color:'var(--text-muted)',marginBottom:'12px'}},'Every signed call to the gecko-cloudflare worker. Best-effort logging, ~last 90 days.'),

    // Filters
    e('div',{className:'card',style:{marginBottom:'12px'}},
      e('div',{className:'card-body',style:{padding:'14px',display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'flex-end'}},
        e('div',{style:{flex:'1 1 160px',minWidth:'140px'}},
          e('label',{className:'form-label'},'User'),
          e('input',{className:'form-input',value:filterUser,onChange:function(ev){setFilterUser(ev.target.value)},placeholder:'e.g. heath'})
        ),
        e('div',{style:{flex:'1 1 160px',minWidth:'140px'}},
          e('label',{className:'form-label'},'Path starts with'),
          e('input',{className:'form-input',value:filterPath,onChange:function(ev){setFilterPath(ev.target.value)},placeholder:'/shopify'})
        ),
        e('div',{style:{flex:'1 1 140px',minWidth:'120px'}},
          e('label',{className:'form-label'},'From'),
          e('input',{type:'date',className:'form-input',value:filterFrom,onChange:function(ev){setFilterFrom(ev.target.value)}})
        ),
        e('div',{style:{flex:'1 1 140px',minWidth:'120px'}},
          e('label',{className:'form-label'},'To'),
          e('input',{type:'date',className:'form-input',value:filterTo,onChange:function(ev){setFilterTo(ev.target.value)}})
        ),
        e('div',{style:{display:'flex',gap:'8px',flex:'0 0 auto'}},
          e('button',{className:'tool-btn primary',onClick:applyFilters},'Apply'),
          e('button',{className:'tool-btn',onClick:clearFilters},'Clear')
        )
      )
    ),

    loadState.state==='unconfigured' ? e(ErrorCard,{title:'Worker not connected',message:'Configure Shopify Integration in Settings before opening Worker Calls.'}) : null,
    loadState.state==='loading' && rows.length===0 ? e('div',{style:{padding:'12px'}},
      [0,1,2,3,4,5].map(function(i){return e(Skel,{key:i,style:{height:'18px',marginBottom:'8px',width:(95-i*5)+'%'}})})
    ) : null,
    loadState.state==='error' ? e(ErrorCard,{title:'Couldn\'t load audit log',message:loadState.message,onRetry:function(){load(true)}}) : null,
    loadState.state==='loaded' && rows.length===0 ? EmptyState({iconName:'file', title:'No matching calls', message:'Try a wider date range, or clear the user and path filters.'}) : null,

    rows.length > 0 ? e('div',{className:'card'},
      e('div',{className:'card-body',style:{padding:0,overflowX:'auto'}},
        e('table',{className:'ing-table',style:{margin:0}},
          e('thead',null,
            e('tr',null,
              e('th',null,'When'),
              e('th',null,'User'),
              e('th',null,'Method'),
              e('th',null,'Path'),
              e('th',{className:'num'},'Status'),
              e('th',{className:'num'},'ms')
            )
          ),
          e('tbody',null,

              return e('tr',{key:r.id,title:r.reason||''},

// ── Trash Page ──
function TrashPage(props){
  useSyncTick();
  var ts = useState(0);
  var setTick = ts[1];
  function refresh(){setTick(function(t){return t+1})}
  // Purge expired on mount
  useEffect(function(){trashPurgeExpired()},[]);
  var items = trashList();

  function restoreItem(it){
    var label = _trashLabel(it.type, it.payload);
    var ok = trashRestore(it.id);
    if(ok){
      showToast('Restored "'+label+'"');
      refresh();
    } else {
      dialogAlert('Could not restore','Something went wrong restoring "'+label+'". The original location may no longer exist.');
    }
  }

  function deleteItem(it){
    var label = _trashLabel(it.type, it.payload);
    dialogConfirm('Permanently delete?','"'+label+'" will be gone for good. This cannot be undone.',{confirmLabel:'Delete forever',danger:true}).then(function(ok){
      if(!ok) return;
      trashRemove(it.id);
      refresh();
      showToast('Deleted permanently');
    });
  }

  function emptyAll(){
    if(items.length===0) return;
    dialogConfirm('Empty the trash?','All '+items.length+' item'+(items.length!==1?'s':'')+' will be permanently deleted. This cannot be undone.',{confirmLabel:'Empty Trash',danger:true}).then(function(ok){
      if(!ok) return;
      trashEmpty();
      refresh();
      showToast('Trash emptied');
    });
  }

  function daysLeft(deletedAt){
    var diff = TRASH_TTL_DAYS - Math.floor((Date.now() - new Date(deletedAt).getTime())/86400000);
    return Math.max(0, diff);
  }

  return e('div',{className:'container'},
    e('button',{className:'back-btn',onClick:props.onBack},'← Back'),
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}},

    e('div',{style:{fontSize:'12px',color:'var(--text-muted)',marginBottom:'12px'}},
      'Items in trash for over '+TRASH_TTL_DAYS+' days are permanently deleted.'
    ),
    items.length===0 ? EmptyState({illustration:'trash', title:'Trash is empty', message:'Deleted items show up here for '+TRASH_TTL_DAYS+' days before they\'re gone for good.'}) : items.map(function(it){
      var iconName = it.type==='recipe'?'clipboard':it.type==='section'?'file':it.type==='ingredient'?'flask':it.type==='batch'?'package':null;
      return e('div',{key:it.id,className:'batch-card'},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'8px'}},
          e('div',{style:{flex:1,minWidth:0}},
            e('div',{style:{fontSize:'13px',fontWeight:600,display:'flex',alignItems:'center',gap:'6px'}},
              iconName ? Icon(iconName,16) : null,
              _trashLabel(it.type,it.payload)
            ),
            e('div',{className:'batch-meta'},
              it.type+' • deleted '+fmtDate(it.deletedAt)+' by '+(it.deletedBy||'unknown')+
              ' • '+daysLeft(it.deletedAt)+' day'+(daysLeft(it.deletedAt)!==1?'s':'')+' left'
            )
          ),
          e('div',{style:{display:'flex',gap:'4px',flexShrink:0}},
            e('button',{className:'tool-btn primary',style:{fontSize:'11px',padding:'4px 10px'},onClick:function(){restoreItem(it)}},'Restore'),
            e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px',color:'var(--red)'},onClick:function(){deleteItem(it)},title:'Delete forever',['aria-label']:'Delete forever'},'×')
          )
        )
      );
    })
  );
}

// ── Stocktake CSV ──
function _csvEscape(v){
  v = (v==null) ? '' : String(v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function _csvParseLine(line){
  // Handles quoted fields with embedded commas + escaped quotes (RFC 4180-ish)
  var out = [], cur = '', inQ = false, i;
  for(i=0;i<line.length;i++){
    var c = line.charAt(i);
    if(inQ){
      if(c === '"' && line.charAt(i+1) === '"'){ cur += '"'; i++; }
      else if(c === '"'){ inQ = false; }
      else cur += c;
    } else {
      if(c === ','){ out.push(cur); cur = ''; }
      else if(c === '"' && cur === ''){ inQ = true; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function exportStocktakeCSV(){
  var data = ls('ingredientData', {});
  var rows = [['name','stock_grams','price_per_gram','supplier','lead_days']];
  // List every known ingredient (DB + anything in stockData), de-duplicated case-insensitively
  var seen = {};
  INGREDIENTS_DB.forEach(function(ing){
    var key = ing.name.toLowerCase();
    if(seen[key]) return;
    seen[key] = true;
    var d = data[key] || {};
    rows.push([ing.name, d.stock||'', d.pricePerGram||'', d.supplier||'', d.leadDays||'']);
  });
  // Add user-added ingredients that aren't in INGREDIENTS_DB
  Object.keys(data).forEach(function(key){
    if(seen[key]) return;
    seen[key] = true;
    var d = data[key];
    rows.push([key, d.stock||'', d.pricePerGram||'', d.supplier||'', d.leadDays||'']);
  });
  var csv = rows.map(function(r){return r.map(_csvEscape).join(',')}).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'gecko_stocktake_'+today()+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Stocktake exported — fill it in then re-import');
}

function importStocktakeCSV(text){
  if(!text){ dialogAlert('Empty file', 'Nothing to import.'); return; }
  var lines = text.replace(/\r\n/g,'\n').split('\n').filter(function(l){return l.trim() !== ''});
  if(lines.length < 2){ dialogAlert('Bad CSV', 'Need at least a header row and one data row.'); return; }
  var header = _csvParseLine(lines[0]).map(function(h){return h.trim().toLowerCase()});
  var nameIdx = header.indexOf('name');
  var stockIdx = header.indexOf('stock_grams');
  if(nameIdx === -1 || stockIdx === -1){
    dialogAlert('Bad CSV header', 'CSV must have at least "name" and "stock_grams" columns. Got: '+header.join(', '));
    return;
  }
  var priceIdx = header.indexOf('price_per_gram');
  var supplierIdx = header.indexOf('supplier');
  var leadIdx = header.indexOf('lead_days');

  var data = ls('ingredientData', {});
  var updated = 0, skipped = 0;
  for(var i=1;i<lines.length;i++){
    var cells = _csvParseLine(lines[i]);
    var name = (cells[nameIdx]||'').trim();
    if(!name){ skipped++; continue; }
    var key = name.toLowerCase();
    if(!data[key]) data[key] = {};
    var stock = parseFloat(cells[stockIdx]);
    if(!isNaN(stock)) data[key].stock = stock;
    if(priceIdx !== -1){
      var p = parseFloat(cells[priceIdx]);
      if(!isNaN(p) && p > 0) data[key].pricePerGram = p;
    }
    if(supplierIdx !== -1){
      var sup = (cells[supplierIdx]||'').trim();
      if(sup) data[key].supplier = sup;
    }
    if(leadIdx !== -1){
      var ld = parseInt(cells[leadIdx]);
      if(!isNaN(ld) && ld > 0) data[key].leadDays = ld;
    }
    updated++;
  }
  lsSet('ingredientData', data);
  if(typeof logActivity==='function') logActivity('imported stocktake', updated+' ingredients updated');
  dialogAlert('Stocktake imported', updated+' ingredient'+(updated!==1?'s':'')+' updated'+(skipped>0?' ('+skipped+' rows skipped — missing name)':''));
  window.dispatchEvent(new CustomEvent('gecko-sync-update'));
}

// ── Backup/Export ──
// Snapshots EVERY gecko_*-prefixed key in localStorage. Earlier
// versions hand-listed ~10 keys and silently dropped trash, stock
// movements, recipe versions, mappings, etc. on restore. Now uses
// the same enumeration as cloud sync's getSyncableData so a backup
// is genuinely a full mirror.
var BACKUP_BLOCKED_KEYS = ['deviceId','syncConfig','syncStatus','lastSyncTime','pushClientId','pushVapidPublicKey','pushTriggerSeen'];
function exportBackup(){
  var data = { version:'2.0', exportDate:new Date().toISOString(), keys:{} };
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(!k || k.indexOf('gecko_') !== 0) continue;
    var sk = k.substring(6);
    if(BACKUP_BLOCKED_KEYS.indexOf(sk) >= 0) continue; // never export per-device or secret data
    try { data.keys[sk] = JSON.parse(localStorage.getItem(k)); }
    catch(_) { data.keys[sk] = localStorage.getItem(k); }
  }
  var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var d = new Date();
  a.download = 'gecko_backup_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  a.click();
  URL.revokeObjectURL(url);
  lsSet('lastBackupDate',new Date().toISOString());
  var keyCount = Object.keys(data.keys).length;
  showToast('Backup exported (' + keyCount + ' keys)');
}

// Restore everything from a backup file. Handles both legacy v1.0
// shape (flat top-level keys) and v2.0 shape ({keys:{...}}).
function importBackupData(data){
  if(!data || typeof data !== 'object') throw new Error('Invalid backup file (not an object)');
  var restored = 0;
  function writeKey(sk, value){
    if(BACKUP_BLOCKED_KEYS.indexOf(sk) >= 0) return; // never overwrite per-device data
    if(sk.charAt(0) === '_') return;                  // skip metadata
    if(sk === 'version' || sk === 'exportDate' || sk === 'keys') return; // legacy/v2 envelope
    lsSet(sk, value);
    restored++;
  }
  if(data.keys && typeof data.keys === 'object'){
    // v2.0
    Object.keys(data.keys).forEach(function(sk){ writeKey(sk, data.keys[sk]) });
  } else {
    // v1.0 — flat top-level. Includes some entries with the gecko_
    // prefix already (e.g. gecko_notes_<id>); strip it.
    Object.keys(data).forEach(function(k){
      var sk = k.indexOf('gecko_') === 0 ? k.substring(6) : k;
      writeKey(sk, data[k]);
    });
  }
  return restored;
}


// ── Batch Sheet (print-only, one-page production worksheet) ──
// Open a brand-aligned per-batch certificate in a new window and trigger
// the browser's Save-as-PDF / Print dialog. No PDF library — Chrome's
// print pipeline is good enough and we already do this for labels.
//
// Cert content: brand header, batch number + recipe + scent, made/expiry
// dates, producer, ingredients (friendly + INCI), QR code linking to
// the public batch page. One A4 page per batch, ready to ship with
// products for compliance.
function printBatchCertificate(batch, recipe){
  if(!batch){ showToast('No batch'); return; }
  if(!recipe) recipe = getAllRecipes().find(function(r){return r.id===batch.recipeId});
  var brand = (ls('businessInfo',{}).brand) || 'BatchFlow';
  var address = (ls('businessInfo',{}).address) || 'Marlborough, New Zealand';
  // Friendly ingredient list (recipe phases with grams) + INCI per scent
  var friendly = '';
  if(recipe && recipe.phases){
    var rows = [];
    recipe.phases.forEach(function(p){
      (p.ingredients||[]).forEach(function(ing){
        if(ing.name && ing.percent > 0) rows.push(ing.name + ' ' + ing.percent + '%');
      });
    });
    friendly = rows.join(', ');
  }
  var inci = (typeof _extractINCI === 'function' && recipe) ? _extractINCI(recipe, batch.scent) : '';
  if(inci) inci = inci.replace(/^INGREDIENTS:\s*/i,'').trim();
  var allergens = (typeof _extractAllergens === 'function' && recipe) ? _extractAllergens(recipe, batch.scent) : '';
  var publicUrl = 'https://gecko-api.ecoshine.workers.dev/b/' + encodeURIComponent(batch.batchNumber||'');
  var qrPng = (typeof geckoQrPngDataUrl === 'function') ? geckoQrPngDataUrl(publicUrl, 6) : '';
  var madeDate = batch.date ? fmtDate(batch.date) : '—';
  var expiryDate = batch.expiryDate ? fmtDate(batch.expiryDate) : '—';
  var unitSize = batch.containerSize ? batch.containerSize + 'g' : '—';
  var lotSize = batch.unitsProduced ? (batch.unitsProduced + ' unit' + (batch.unitsProduced===1?'':'s')) : '—';
  var statusLabel = batch.status === 'failed' ? 'Recalled' : batch.status === 'sold_out' ? 'Sold out' : 'Active';

      '.cert-grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 22px; padding: 12px 14px; background: #FAF7F2; border-radius: 8px; }' +

      '.cert-section { margin-bottom: 18px; page-break-inside: avoid; }' +
      '.cert-section h3 { font-size: 11px; font-weight: 700; color: #6B5744; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 6px; }' +
      '.cert-section p { font-size: 12px; margin: 0 0 6px; }' +
      '.cert-allerg { background: #FAF1DD; border-left: 3px solid #C8912E; padding: 8px 12px; font-size: 12px; }' +
      '.cert-footer { margin-top: 28px; padding-top: 12px; border-top: 1px solid #D4C7B5; display: flex; justify-content: space-between; align-items: flex-end; font-size: 10px; color: #6B5744; }' +
      '.cert-qr { display: flex; flex-direction: column; align-items: center; gap: 4px; }' +
      '.cert-qr img { width: 80px; height: 80px; }' +
      '.cert-qr .lbl { font-size: 9px; color: #6B5744; }' +
      '@media screen { body { max-width: 800px; margin: 24px auto; padding: 24px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08); } }' +
    '</style></head><body>' +
    '<div class="cert-header">' +
      '<div>' +
        '<div class="cert-brand">' + esc(brand) + '</div>' +
        '<div class="cert-tag">Batch certificate · ' + esc(address) + '</div>' +
      '</div>' +
      '<div style="text-align:right">' +
        '<div class="cert-batchno">' + esc(batch.batchNumber) + '</div>' +
        '<div class="cert-status ' + (statusLabel.toLowerCase().replace(/\s+/g,'')) + '">' + esc(statusLabel) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="cert-product">' + esc(recipe ? recipe.name : (batch.recipeName||'')) + '</div>' +
    (batch.scent ? '<div class="cert-scent">Scent variant: ' + esc(batch.scent) + '</div>' : '') +
    '<div class="cert-grid">' +
      '<div><div class="lbl">Made</div><div class="val">' + esc(madeDate) + '</div></div>' +
      '<div><div class="lbl">Best before</div><div class="val">' + esc(expiryDate) + '</div></div>' +

      '<div><div class="lbl">Producer</div><div class="val">' + esc(batch.author||'—') + '</div></div>' +
      '<div><div class="lbl">Recipe version</div><div class="val">' + esc(batch.recipeVersion||'—') + '</div></div>' +
    '</div>' +
    (friendly ? '<div class="cert-section"><h3>Ingredients (formulation)</h3><p>' + esc(friendly) + '</p></div>' : '') +
    (inci ? '<div class="cert-section"><h3>INCI</h3><p>' + esc(inci) + '</p></div>' : '') +
    (allergens ? '<div class="cert-section"><h3>Contains</h3><div class="cert-allerg">' + esc(allergens) + '</div></div>' : '') +
    (batch.notes ? '<div class="cert-section"><h3>Production notes</h3><p>' + esc(batch.notes) + '</p></div>' : '') +
    '<div class="cert-footer">' +
      '<div>' +
        '<div>This certificate accompanies a single production lot.</div>' +
        '<div>Customers can verify it at <strong>' + esc(publicUrl.replace(/^https?:\/\//,'')) + '</strong></div>' +
      '</div>' +
      (qrPng ? '<div class="cert-qr"><img src="' + qrPng + '" alt="QR code"/><div class="lbl">Scan to verify</div></div>' : '') +
    '</div>' +
    '<script>setTimeout(function(){window.print();},250)<\/script>' +
    '</body></html>';

  var w = window.open('', '_blank');
  if(!w){ showToast('Pop-up blocked — allow pop-ups to print certificates'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

function BatchSheet(props){
  var recipe = props.recipe;
  var sf = props.scaleFactor || 1;
  var batchNum = genBatchNum(recipe.name);
  var batchGrams = fmt((recipe.batchSize||100)*sf);

  // Get condensed production method
  var prodSections = recipe.sections.filter(function(s){return s.category==='production'});
  var methodText = prodSections.map(function(s){
    return (s.html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
  }).join(' ');
  // Truncate to ~500 chars
  if(methodText.length > 600) methodText = methodText.substring(0,597)+'...';

  return e('div',{className:'batch-sheet-only batch-sheet'},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',borderBottom:'2px solid #C8912E',paddingBottom:'6px',marginBottom:'8px'}},
      e('div',null,
        e('h1',null,recipe.name),
        e('div',{style:{fontSize:'12px',color:'#666'}},[recipe.category,recipe.format,recipe.shelfLife].filter(Boolean).join(' \u2022 '))
      ),
      e('div',{style:{textAlign:'right',fontSize:'12px'}},
        e('div',null,e('strong',null,'Batch: '),batchNum),
        e('div',null,e('strong',null,'Date: '),today()),
        e('div',null,e('strong',null,'Size: '),batchGrams+'g'),
        e('div',null,e('strong',null,'Operator: '),'___________')
      )
    ),

    // Scaled ingredient tables per phase
    recipe.phases.map(function(phase,pi){
      return e('div',{key:pi},
        e('h2',null,(phase.letter?'Phase '+phase.letter:'Phase '+(pi+1))+(phase.name?' \u2014 '+phase.name:'')+(phase.temperature?' ('+phase.temperature+')':'')),
        e('table',null,
          e('thead',null,e('tr',null,
            e('th',null,'#'),e('th',null,'Ingredient'),e('th',{style:{textAlign:'right'}},'Grams'),e('th',{style:{textAlign:'right'}},'%')
          )),
          e('tbody',null,
            phase.ingredients.map(function(ing,ii){
              return e('tr',{key:ii},
                e('td',null,ii+1),
                e('td',null,ing.name),
                e('td',{className:'num'},fmt(ing.grams*sf)),
                e('td',{className:'num'},fmt(ing.percent))
              );
            }),
            e('tr',{style:{fontWeight:600,background:'#f9f6f0'}},
              e('td',null,''),e('td',null,'Phase Total'),
              e('td',{className:'num'},fmt(phase.ingredients.reduce(function(s,i){return s+i.grams*sf},0))),
              e('td',{className:'num'},fmt(phase.ingredients.reduce(function(s,i){return s+i.percent},0))),
              e('td',null,'')
            )
          )
        )
      );
    }),

    // Condensed production method
    methodText ? e('div',null,
      e('h2',null,'Production Method'),
      e('div',{style:{fontSize:'11px',lineHeight:'1.5'}},methodText)
    ) : null,

    // QC checklist (blank boxes for ticking)
    recipe.qcItems && recipe.qcItems.length > 0 ? e('div',null,
      e('h2',null,'QC Checklist'),
      recipe.qcItems.map(function(item,i){
        return e('div',{key:i,className:'qc-row'},
          e('span',{className:'qc-box'}),item
        );
      })
    ) : null,

    // Notes space
    e('div',null,
      e('h2',null,'Production Notes'),
      e('div',{className:'notes-box'},'')
    ),

    // Footer
    e('div',{className:'footer'},
      'BatchFlow \u2022 Marlborough, NZ \u2022 Batch Sheet \u2022 '+recipe.name+' \u2022 '+today()
    )
  );
}

function printBatchSheet(){
  // Add class to body to trigger batch-sheet print mode
  document.body.classList.add('printing-batch-sheet');
  // Add temporary CSS
  var style = document.createElement('style');
  style.id = 'batch-sheet-print-css';
  style.textContent = '.printing-batch-sheet > div > *:not(.batch-sheet-only) { display:none !important; } .printing-batch-sheet .batch-sheet-only { display:block !important; }';
  document.head.appendChild(style);
  setTimeout(function(){
    window.print();
    document.body.classList.remove('printing-batch-sheet');
    var el = document.getElementById('batch-sheet-print-css');
    if(el) el.remove();
  },100);
}

// ── Production Walkthrough ──
function ProductionWalkthrough(props){
  var recipe = props.recipe;
  var ss = useState(0);
  var step = ss[0], setStep = ss[1];
  var ov = useState(ls('defaultOverage',5));
  var overage = ov[0], setOverage = ov[1];
  var started = useState(false);
  var isStarted = started[0], setStarted = started[1];
  var aas = useState(ls('autoAdvanceTimer', false));
  var autoAdvance = aas[0], setAutoAdvanceRaw = aas[1];
  function setAutoAdvance(v){setAutoAdvanceRaw(v);lsSet('autoAdvanceTimer', v)}

  // Batch notes state — persistent across steps
  var bn = useState('');
  var batchNotes = bn[0], setBatchNotes = bn[1];

  // Stable batch id for the in-progress walkthrough. Photos captured during
  // the walkthrough are uploaded against this id; when the batch is finally
  // logged we reuse the same id so they're already attached. useRef keeps
  // it stable across re-renders.
  var prodBatchIdRef = useRef(null);
  if(!prodBatchIdRef.current) prodBatchIdRef.current = uid();
  var prodBatchId = prodBatchIdRef.current;

  // Multi-batch mode — produce N copies of this recipe in one walkthrough.
  // Default 1. When N>1 the weigh step displays scaled grams (recipe ×N
  // ×(1+overage)) and onLogBatch splits into N rows with auto-incrementing
  // batch numbers.
  var bc = useState(1);
  var batchCount = bc[0], setBatchCount = bc[1];

  // Build steps in the correct order:
  // 1. INGREDIENTS — weigh each phase
  // 2. PRODUCTION METHOD — instruction steps with timers
  // 1. INGREDIENTS — weigh each phase
  // 2. SCENT PROFILE — select scent variant (if any)
  // 3. PRODUCTION METHOD — instruction steps with timers
  // 4. BATCH NOTES — write notes for this batch (recorded in log)
  // 5. FINISH — log the batch

  var steps = [];

  // 1. Ingredients: one step per phase
  recipe.phases.forEach(function(phase, pi){
    steps.push({
      type:'weigh',
      label:'INGREDIENTS',
      title:'Weigh '+(phase.name || ('Phase '+(phase.letter||pi+1))),
      phase:phase,
      temperature:phase.temperature
    });
  });

  // 2. Scent profile selection (if recipe has scent profiles)
  if(recipe.scentProfiles && recipe.scentProfiles.length > 0){
    steps.push({type:'scent',label:'SCENT PROFILE',title:'Select Scent Profile',profiles:recipe.scentProfiles});
  }

  // 3. Production method steps (with timer on each)
  recipe.sections.forEach(function(sec){
    if(sec.category === 'production'){
      steps.push({type:'instruction',label:'PRODUCTION METHOD',title:sec.title,content:sec.html,isHtml:true});
    }
  });

  // 4. Batch Notes
  steps.push({type:'notes',label:'BATCH NOTES',title:'Production Notes'});

  // 5. Finish
  steps.push({type:'complete',label:'FINISH',title:'Batch Complete'});

  var totalSteps = steps.length;
  var currentStep = steps[step] || steps[0];
  var progress = totalSteps > 1 ? (step / (totalSteps-1) * 100) : 0;
  // Scale factor includes both overage and the multi-batch count.
  // sf=1 means a single master-batch; sf=2 means weigh enough for two.
  var sf = (1 + overage/100) * Math.max(1, batchCount);

  // Pre-start screen
  if(!isStarted){
    return e('div',{className:'container'},
      e('button',{className:'back-btn no-print',onClick:props.onBack},'\u2190 Back to Recipe'),
      e('div',{style:{textAlign:'center',padding:'24px 16px'}},
        e('div',{style:{fontSize:'18px',fontWeight:700,marginBottom:'4px'}},'Production Mode'),
        e('div',{style:{fontSize:'14px',color:'var(--text-muted)',marginBottom:'20px'}},recipe.name),
        e('div',{className:'calc-panel',style:{textAlign:'left'}},
          e('div',{className:'calc-row'},
            e('span',{className:'calc-label'},'Overage %'),
            e('input',{type:'number',className:'calc-input',value:overage,onChange:function(ev){setOverage(parseFloat(ev.target.value)||0)}})
          ),
          e('div',{className:'calc-row'},
            e('span',{className:'calc-label'},'Batches'),
            e('input',{type:'number',min:1,max:20,className:'calc-input',value:batchCount,onChange:function(ev){setBatchCount(Math.max(1, Math.min(20, parseInt(ev.target.value,10)||1)))}}),
            e('span',{style:{fontSize:'12px',color:'var(--text-muted)',marginLeft:'8px'}}, batchCount > 1 ? 'Walkthrough scales × '+batchCount+', then logs '+batchCount+' separate batches.' : '1 batch — bump for multi-batch days.')
          ),
          e('div',{style:{fontSize:'14px',marginTop:'8px'}},
            e('strong',null,'Total batch: '),fmt((recipe.batchSize||100)*sf)+'g',
            e('span',{style:{color:'var(--text-muted)',marginLeft:'8px'}},'('+(recipe.batchSize||100)+'g × '+batchCount+(batchCount===1?'':' batches')+' + '+overage+'% overage)')
          ),
          e('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginTop:'12px',paddingTop:'10px',borderTop:'1px solid var(--border-light)'}},
            e('input',{type:'checkbox',id:'auto-advance-cb',checked:autoAdvance,onChange:function(ev){setAutoAdvance(ev.target.checked)},style:{width:'18px',height:'18px'}}),
            e('label',{htmlFor:'auto-advance-cb',style:{fontSize:'13px',cursor:'pointer'}},'Auto-advance to next step when timer hits 0')
          )
        ),
        e('div',{style:{marginTop:'20px'}},
          e('button',{className:'tool-btn primary',style:{padding:'14px 32px',fontSize:'15px'},onClick:function(){setStarted(true)}},'\u25B6 Start Production'),
          e('button',{className:'tool-btn',style:{padding:'14px 24px',fontSize:'14px',marginLeft:'8px'},onClick:printBatchSheet},'\uD83D\uDDA8 Print Batch Sheet')
        ),
        e('div',{style:{fontSize:'13px',color:'var(--text-muted)',marginTop:'16px',lineHeight:'1.6'}},
          e('strong',null,totalSteps+' steps:'),' Ingredients \u2192 Scent \u2192 Method \u2192 Notes \u2192 Finish'
        )
      ),
      // Hidden batch sheet for print
      e(BatchSheet,{recipe:recipe,scaleFactor:sf})
    );
  }

  return e('div',{className:'container'},
    e('button',{className:'back-btn no-print',onClick:function(){dialogConfirm('Exit production?','Your in-progress steps and any notes typed but not logged will be lost.',{confirmLabel:'Exit',danger:true}).then(function(ok){if(ok)props.onBack()})}},'\u2190 Exit Production'),
    e('div',{style:{fontSize:'12px',color:'var(--text-muted)',textAlign:'center',padding:'4px 0'}},
      'Step '+(step+1)+' of '+totalSteps+' \u2022 '+recipe.name
    ),
    // Progress bar
    e('div',{style:{height:'4px',background:'var(--border-light)',borderRadius:'2px',margin:'6px 0 16px',overflow:'hidden'}},
      e('div',{style:{height:'100%',width:progress+'%',background:'var(--green)',borderRadius:'2px',transition:'width 0.3s'}})
    ),

    // --- 1. WEIGH INGREDIENTS ---
    currentStep.type === 'weigh' ? e('div',{'data-tut':'weigh-step',className:'card'},
      e('div',{className:'card-body',style:{padding:'16px'}},
        e('div',{style:{fontSize:'11px',fontWeight:600,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'}},currentStep.label+' \u2022 STEP '+(step+1)),
        e('div',{style:{fontSize:'16px',fontWeight:600,marginBottom:'8px'}},currentStep.title),
        currentStep.temperature ? e('div',{style:{fontSize:'13px',color:'var(--text-muted)',marginBottom:'10px'}},'\uD83C\uDF21 '+currentStep.temperature) : null,
        e(IngTable,{ingredients:currentStep.phase.ingredients,sf:sf,showTotal:true})
      )
    ) : null,

    // --- 2. SCENT PROFILE ---
    currentStep.type === 'scent' ? e('div',{className:'card'},
      e('div',{className:'card-body',style:{padding:'16px'}},
        e('div',{style:{fontSize:'11px',fontWeight:600,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'}},currentStep.label+' \u2022 STEP '+(step+1)),
        e('div',{style:{fontSize:'16px',fontWeight:600,marginBottom:'4px'}},currentStep.title),
        e('div',{style:{fontSize:'13px',color:'var(--text-muted)',marginBottom:'12px'}},'Choose the scent variant for this batch. Oil amounts are scaled to your batch size.'),
        e(ScentSelector,{profiles:currentStep.profiles,sf:sf})
      )
    ) : null,

    // --- 3. PRODUCTION METHOD ---
    currentStep.type === 'instruction' ? (function(){
      // Try to extract a timer duration from the step content + title
      var hint = extractTimerSeconds((currentStep.title||'')+' '+(currentStep.content||''));
      var initialSecs = hint || 60;
      var timerLabel = hint ? ('Suggested: '+(hint>=60?Math.round(hint/60)+' min':hint+' sec')) : 'Step Timer';
      return e('div',{className:'card'},
        e('div',{className:'card-body',style:{padding:'16px'}},
          e('div',{style:{fontSize:'11px',fontWeight:600,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'}},currentStep.label+' \u2022 STEP '+(step+1)),
          e('div',{style:{fontSize:'16px',fontWeight:600,marginBottom:'8px'}},currentStep.title),
          currentStep.isHtml ?
            e('div',{className:'section-body',style:{padding:0},dangerouslySetInnerHTML:{__html:currentStep.content}}) :
            e('div',{style:{fontSize:'14px',lineHeight:'1.7'}},currentStep.content),
          e('div',{style:{marginTop:'16px',padding:'12px',background:'var(--bg-card)',borderRadius:'var(--radius)',border:'1px solid var(--border-light)'}},
            e(TimerWidget,{key:'timer-'+step,initialSeconds:initialSecs,label:timerLabel,onComplete:autoAdvance ? function(){
              // Wait for the beep + visual flash to register, then advance
              setTimeout(function(){
                if(step < totalSteps - 1) setStep(step + 1);
              }, 1500);
            } : null})
          )
        )
      );
    })() : null,

    // --- 4. BATCH NOTES ---
    currentStep.type === 'notes' ? e('div',{className:'card'},
      e('div',{className:'card-body',style:{padding:'16px'}},
        e('div',{style:{fontSize:'11px',fontWeight:600,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'}},currentStep.label+' \u2022 STEP '+(step+1)),
        e('div',{style:{fontSize:'16px',fontWeight:600,marginBottom:'4px'}},'Batch Notes'),
        e('div',{style:{fontSize:'13px',color:'var(--text-muted)',marginBottom:'12px'}},'Record anything notable about this batch \u2014 observations, issues, variations, or tips for next time. These notes get saved with the batch log.'),
        e('textarea',{
          value:batchNotes,
          onChange:function(ev){setBatchNotes(ev.target.value)},
          placeholder:'e.g. Used slightly more beeswax due to summer temps. Fragrance blend sat for 10 mins before adding. Texture came out smooth...',
          style:{width:'100%',minHeight:'140px',padding:'12px',fontSize:'14px',lineHeight:'1.6',border:'2px solid var(--border-light)',borderRadius:'var(--radius)',fontFamily:'inherit',resize:'vertical',background:'var(--bg-main)',color:'var(--text-primary)',boxSizing:'border-box'}
        }),
        e('div',{style:{fontSize:'12px',color:'var(--text-muted)',marginTop:'8px'}},'These notes will be attached to this batch log and saved for future reference. Tip: type @ followed by a recipe name to link to it.')
      )
    ) : null,

    // --- 5. FINISH ---
    currentStep.type === 'complete' ? e('div',{style:{textAlign:'center',padding:'40px 16px'}},
      e('div',{style:{fontSize:'48px',marginBottom:'12px'}},'\u2705'),
      e('div',{style:{fontSize:'20px',fontWeight:700,marginBottom:'8px'}},'Batch Complete!'),
      e('div',{style:{fontSize:'14px',color:'var(--text-muted)',marginBottom:'8px'}},'All production steps finished.'),
      batchNotes.trim() ? e('div',{style:{background:'var(--bg-card)',border:'1px solid var(--border-light)',borderRadius:'var(--radius)',padding:'12px',margin:'12px auto',maxWidth:'400px',textAlign:'left',fontSize:'13px'}},
        e('div',{style:{fontWeight:600,marginBottom:'4px',fontSize:'11px',color:'var(--gold)',textTransform:'uppercase',letterSpacing:'1px'}},'YOUR NOTES'),
        e('div',{style:{color:'var(--text-primary)',lineHeight:'1.5'}},batchNotes)
      ) : null,
      e('button',{className:'tool-btn primary',style:{padding:'12px 24px',fontSize:'14px'},onClick:function(){props.onLogBatch(recipe,batchNotes,prodBatchId,batchCount)}}, batchCount > 1 ? '\uD83D\uDCDD Log ' + batchCount + ' batches' : '\uD83D\uDCDD Log This Batch')
    ) : null,

    // Navigation
    currentStep.type !== 'complete' ? e('div',{style:{display:'flex',gap:'8px',justifyContent:'space-between',marginTop:'16px'}},
      e('button',{className:'tool-btn',onClick:function(){if(step>0)setStep(step-1)},disabled:step===0,style:{opacity:step===0?0.4:1}},'\u2190 Previous'),
      e('button',{className:'tool-btn primary',onClick:function(){if(step<totalSteps-1)setStep(step+1)}},'Next \u2192')
    ) : null,

    // Photo capture during the walkthrough \u2014 pinned at the bottom and
    // visible on every step except the finish screen. Photos upload to
    // R2 (when configured) against prodBatchId, so when the batch is
    // logged with the same id the photos are already attached and show
    // up on the public batch page.
    currentStep.type !== 'complete' ? e('div',{className:'card no-print',style:{marginTop:'16px',marginBottom:'16px'}},
      e('div',{className:'card-body',style:{padding:'12px 14px'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'6px'}},
          e('span',{style:{color:'var(--text-muted)',display:'flex'}},Icon('mail',14)),
          e('span',{style:{fontSize:'12px',fontWeight:600,color:'var(--text)'}},'Photos for this batch'),

function TutorialOverlay(props){
  var steps = props.mode === 'quick' ? QUICK_TOUR_STEPS
    : props.mode === 'pro' ? PRO_TUTORIAL_STEPS
    : TUTORIAL_STEPS;
  var st = useState(function(){
    var saved = ls('tutorialProgress_'+(props.mode||'full'),0);
    return saved < steps.length ? saved : 0;
  });
  var step = st[0], setStep = st[1];
  var total = steps.length;
  var current = steps[step];
  var progress = ((step + 1) / total * 100).toFixed(0);
  var lastNavRef = useRef('');
  var spotlightRect = useState(null);
  var rect = spotlightRect[0], setRect = spotlightRect[1];
  var sectionTransition = useState(null);
  var showSection = sectionTransition[0], setShowSection = sectionTransition[1];
  var prevSection = useRef('');

  // Save progress
  useEffect(function(){
    lsSet('tutorialProgress_'+(props.mode||'full'), step);
  },[step]);

  // Navigate + spotlight
  useEffect(function(){
    if(!current) return;
    var action = current.nav;
    var cleanups = [];

    // Section transition card (non-blocking — still navigates below)
    if(current.section && current.section !== prevSection.current){
      prevSection.current = current.section;
      setShowSection(current.section);
      var t = setTimeout(function(){setShowSection(null)},1200);
      cleanups.push(function(){clearTimeout(t)});
    }

    if(action === 'stay'){
      // Just update spotlight
    } else if(action === 'selectRecipe'){
      var allR = getAllRecipes();
      var r = allR[0] || RECIPES[0];
      if(props.onSelectRecipe) props.onSelectRecipe(r);
      lastNavRef.current = 'detail';
    } else if(action === 'startProduction'){
      var allR2 = getAllRecipes();
      var r2 = allR2[0] || RECIPES[0];
      if(props.onStartProduction) props.onStartProduction(r2);
      lastNavRef.current = 'production';
    } else if(action !== lastNavRef.current){
      if(props.onNav) props.onNav(action);
      lastNavRef.current = action;
    }

    // Find and spotlight target after a short delay (let page render)
    var timer = setTimeout(function(){
      if(current.target){
        var el = document.querySelector(current.target);
        if(el){
          el.scrollIntoView({behavior:'smooth',block:'center'});
          setTimeout(function(){
            var r = el.getBoundingClientRect();
            setRect({top:r.top-6,left:r.left-6,width:r.width+12,height:r.height+12});
          },350);
        } else {
          setRect(null);
        }
      } else {
        setRect(null);
        window.scrollTo({top:0,behavior:'smooth'});
      }
    },150);
    cleanups.push(function(){clearTimeout(timer)});
    return function(){cleanups.forEach(function(fn){fn()})};
  },[step]);

  // Update spotlight on scroll/resize
  useEffect(function(){
    if(!current || !current.target) return;
    function update(){
      var el = document.querySelector(current.target);
      if(el){
        var r = el.getBoundingClientRect();
        setRect({top:r.top-6,left:r.left-6,width:r.width+12,height:r.height+12});
      }
    }
    window.addEventListener('scroll',update,true);
    window.addEventListener('resize',update);
    return function(){
      window.removeEventListener('scroll',update,true);
      window.removeEventListener('resize',update);
    };
  },[step]);

  function goNext(){if(step<total-1)setStep(step+1)}
  function goBack(){if(step>0)setStep(step-1)}
  function exit(){
    lsSet('tutorialProgress_'+(props.mode||'full'),0);
    props.onExit();
  }

  // Section transition overlay
  if(showSection){
    return e('div',{style:{
      position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:10000,
      background:'rgba(10,10,10,0.88)',display:'flex',alignItems:'center',justifyContent:'center',
      animation:'fadeIn 0.3s ease'
    }},
      e('div',{style:{textAlign:'center'}},
        e('div',{style:{fontSize:'12px',fontWeight:600,color:'var(--gold)',textTransform:'uppercase',letterSpacing:'2px',marginBottom:'8px'}},'Up Next'),
        e('div',{style:{fontSize:'22px',fontWeight:700,color:'var(--text)'}},showSection)
      )
    );
  }

  return e('div',{className:'tutorial-active'},
    // Spotlight overlay — darkens everything except the target
    rect ? e('div',{style:{
      position:'fixed',top:0,left:0,right:0,bottom:0,zIndex:9998,
      pointerEvents:'none'
    }},
      // Dark overlay with cutout using box-shadow trick
      e('div',{style:{
        position:'fixed',
        top:rect.top+'px',left:rect.left+'px',
        width:rect.width+'px',height:rect.height+'px',
        borderRadius:'10px',
        boxShadow:'0 0 0 9999px rgba(10,10,10,0.65)',
        transition:'all 0.35s ease',
        pointerEvents:'none',zIndex:9998
      }}),
      // Gold ring around target
      e('div',{style:{
        position:'fixed',
        top:rect.top+'px',left:rect.left+'px',
        width:rect.width+'px',height:rect.height+'px',
        borderRadius:'10px',
        border:'2px solid var(--gold)',
        boxShadow:'0 0 12px rgba(198,165,110,0.4)',
        animation:'tutPulse 2s infinite',
        transition:'all 0.35s ease',
        pointerEvents:'none',zIndex:9999
      }}),
      // Arrow pointing down at target
      e('div',{style:{
        position:'fixed',
        top:(rect.top - 28)+'px',
        left:(rect.left + rect.width/2 - 10)+'px',
        width:0,height:0,
        borderLeft:'10px solid transparent',
        borderRight:'10px solid transparent',
        borderTop:'12px solid var(--gold)',
        animation:'tutBounce 1.5s infinite',
        filter:'drop-shadow(0 2px 4px rgba(198,165,110,0.5))',

      background:'rgba(28,28,30,0.92)',
      WebkitBackdropFilter:'blur(20px)',backdropFilter:'blur(20px)',
      border:'1px solid rgba(198,165,110,0.3)',

      boxShadow:'0 -8px 40px rgba(0,0,0,0.5)',

    }},
      // Top row: section + step counter + exit
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},
