function BatchCalc(props){
  var recipe = props.recipe;
  var ms = useState('unit');
  var mode = ms[0], setMode = ms[1];
  var fw = useState(50);
  var fillWeight = fw[0], setFillWeight = fw[1];
  var uc = useState(10);
  var unitCount = uc[0], setUnitCount = uc[1];
  var mult = useState(10);
  var multiplier = mult[0], setMultiplier = mult[1];
  var ov = useState(ls('defaultOverage',5));
  var overage = ov[0], setOverage = ov[1];

  var batchSize = recipe.batchSize || 100;
  var sf;
  if(mode === 'unit'){
    sf = (fillWeight * unitCount) / batchSize;
  } else {
    sf = multiplier;
  }
  var totalBatch = batchSize * sf;
  var totalWithOverage = totalBatch * (1 + overage/100);
  var estUnits = fillWeight > 0 ? Math.floor(totalBatch / fillWeight) : 0;

  return e('div',{className:'calc-panel'},
    e('div',{className:'calc-mode-toggle'},
      e('button',{className:'calc-mode-btn'+(mode==='unit'?' active':''),onClick:function(){setMode('unit')}},'Unit-based'),
      e('button',{className:'calc-mode-btn'+(mode==='mult'?' active':''),onClick:function(){setMode('mult')}},'Multiplier')
    ),
    mode === 'unit' ? e('div',null,
      e('div',{className:'calc-row'},
        e('span',{className:'calc-label'},'Fill weight (g)'),
        e('input',{type:'number',className:'calc-input',value:fillWeight,onChange:function(ev){setFillWeight(parseFloat(ev.target.value)||0)}})
      ),
      e('div',{className:'calc-row'},
        e('span',{className:'calc-label'},'Units'),
        e('input',{type:'number',className:'calc-input',value:unitCount,onChange:function(ev){setUnitCount(parseInt(ev.target.value)||0)}})
      )
    ) : e('div',null,
      e('div',{className:'calc-row'},
        e('span',{className:'calc-label'},'Multiplier'),
        e('input',{type:'number',className:'calc-input',value:multiplier,onChange:function(ev){setMultiplier(parseFloat(ev.target.value)||1)}})
      )
    ),
    e('div',{className:'calc-row'},
      e('span',{className:'calc-label'},'Overage %'),
      e('input',{type:'number',className:'calc-input',value:overage,onChange:function(ev){setOverage(parseFloat(ev.target.value)||0)},style:{width:'70px'}})
    ),
    e('div',{className:'calc-result'},
      e('div',null,e('strong',null,'Total batch: '),fmt(totalBatch)+'g',overage>0?' (+'+overage+'% = '+fmt(totalWithOverage)+'g)':''),
      e('div',null,e('strong',null,'Scale factor: '),'\u00D7'+fmt(sf)),
      mode==='unit'?null:e('div',null,e('strong',null,'Est. units: '),estUnits+' @ '+fillWeight+'g each'),
      (function(){
        var unitsForCost = mode==='unit' ? unitCount : estUnits;
        var cost = computeRecipeCost(recipe, sf * (1+overage/100), unitsForCost);
        var totalIngs = recipe.phases.reduce(function(s,p){return s+p.ingredients.length},0);
        if(cost.totalCost === 0 && cost.missing.length === totalIngs){
          return e('div',{style:{marginTop:'4px',fontSize:'11px',color:'var(--text-muted)'}},'Set ingredient prices to see batch cost');
        }
        var partial = cost.missing.length > 0;
        return e('div',{style:{marginTop:'6px',paddingTop:'6px',borderTop:'1px solid var(--border-light)'}},
          e('div',null,e('strong',null,'Batch cost: '),'$'+cost.totalCost.toFixed(2)+(partial?'+':'')),
          unitsForCost>0 ? e('div',null,e('strong',null,'Per unit: '),'$'+cost.perUnitCost.toFixed(2)+(partial?'+':''))  : null,
          partial ? e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginTop:'2px'}},
            'No price set for '+cost.missing.length+' ingredient'+(cost.missing.length!==1?'s':'')+' — actual cost may be higher'
          ) : null
        );
      })(),
      totalBatch > 20000 ? e('div',{style:{color:'var(--red)',marginTop:'4px',fontWeight:500}},'\u26A0 Large batch (>20kg) — consider splitting') : null
    ),
    sf > 0 ? e('div',{style:{marginTop:'10px'}},
      recipe.phases.map(function(phase,pi){
        return e('div',{key:pi},
          e('div',{style:{fontSize:'12px',fontWeight:600,margin:'8px 0 4px',color:'var(--text-light)'}},phase.name||('Phase '+(phase.letter||pi+1))),

// ── Production Suggestions Card ──
// "What should mum make next?" — combines:
//   - Shopify sales velocity per variant (last 30d)
//   - Current Shopify available stock per variant
//   - The recipe→product mappings the user configured
// Recipes whose mapped variants will run out within RUNWAY_DAYS get
// surfaced, ranked by urgency (lowest daysUntilStockout first).
//
// Falls back to the local heuristic (getProductionSuggestions) if
// Shopify isn't configured or the fetch fails.
function ProductionSuggestionsCard(props){
  var RUNWAY_DAYS = 14;          // anything that'll stockout within this gets suggested
  var ds = useState(null);
  var velocity = ds[0], setVelocity = ds[1];
  var es = useState(null);
  var err = es[0], setErr = es[1];
  var ls2 = useState(false);
  var loading = ls2[0], setLoading = ls2[1];

  useEffect(function(){
    if(!shopifyConfigured()) return;
    setLoading(true);
    shopifyInventoryVelocity({days:30}).then(function(res){
      setVelocity(res); setLoading(false);
    }).catch(function(e){
      setErr(e && e.message ? e.message : String(e));
      setLoading(false);
    });
  },[]);

  // Try the Shopify-driven path first if we have data
  var shopifySuggestions = [];
  if(velocity && velocity.variants){
    var byVariant = {};
    velocity.variants.forEach(function(v){ byVariant[v.variantId] = v; });
    var mappings = ls('shopifyMappings',{});
    var allRecipes = getAllRecipes();
    Object.keys(mappings).forEach(function(rid){
      var m = mappings[rid];
      if(!m || !m.products || !m.products.length) return;
      var recipe = allRecipes.find(function(r){return r.id===rid});
      if(!recipe) return;
      var worst = null;
      m.products.forEach(function(p){
        var v = byVariant[p.variantId];
        if(!v || !v.inventoryTracked || v.daysUntilStockout === null) return;
        if(!worst || v.daysUntilStockout < worst.daysUntilStockout) worst = v;
      });
      if(worst && worst.daysUntilStockout <= RUNWAY_DAYS){
        shopifySuggestions.push({recipe:recipe, variant:worst});
      }
    });
    shopifySuggestions.sort(function(a,b){return a.variant.daysUntilStockout - b.variant.daysUntilStockout});
  }

  // Loading skeleton — shows the card scaffold with shimmering placeholders
  // while we wait for the first velocity fetch. Page feels structurally
  // complete instead of empty.
  if(loading && !velocity && !err && shopifyConfigured()){
    return e('div',{className:'card',style:{borderColor:'var(--green)',background:'var(--green-soft)'}},
      e('div',{className:'card-body',style:{padding:'var(--space-3) var(--space-4)'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:'var(--space-2)',marginBottom:'var(--space-2)'}},
          e('span',{style:{color:'var(--green)',display:'flex'}},Icon('lightbulb',16)),
          e('span',{style:{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semi)',color:'var(--green)'}},'Suggested for production')
        ),
        [0,1,2].map(function(i){
          return e('div',{key:i,style:{display:'flex',gap:'var(--space-2)',padding:'var(--space-2) 0',borderTop:i>0?'1px solid var(--border-light)':'none'}},
            e(Skel,{style:{height:'14px',flex:1,maxWidth:(60-i*8)+'%'}}),
            e(Skel,{style:{height:'14px',width:'60px'}})
          );
        })
      )
    );
  }

  // Render Shopify-driven suggestions when we have any
  if(shopifySuggestions.length > 0){
    return e('div',{className:'card',style:{borderColor:'var(--green)',background:'#E8F2E8'}},
      e('div',{className:'card-body',style:{padding:'12px 16px'}},
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}},
          e('span',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,color:'var(--green)'}},
          e('span',{style:{display:'flex'}},Icon('lightbulb',16)),
          'Suggested for production'),
          e('span',{style:{fontSize:'10px',color:'var(--text-muted)'}},'based on Shopify sales · 30d')
        ),
        shopifySuggestions.slice(0,5).map(function(s){
          var v = s.variant;
          var days = Math.round(v.daysUntilStockout);
          var perWeek = (v.dailyRate * 7).toFixed(1);
          var urgent = days <= 7;
          return e('div',{key:s.recipe.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderTop:'1px solid var(--border-light)'}},
            e('div',{style:{flex:1,minWidth:0,marginRight:'8px'}},
              e('div',{style:{fontSize:'13px',fontWeight:500,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},s.recipe.name),
              e('div',{style:{fontSize:'11px',color:urgent?'var(--red)':'var(--text-muted)'}},
                v.available + ' left · sells ~' + perWeek + '/wk · ' + (days <= 0 ? 'out now' : '~' + days + ' days left')
              )
            ),
            e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'6px 10px'},onClick:function(){props.onSelectRecipe ? props.onSelectRecipe(s.recipe) : props.nav('recipes')}},'Open')
          );
        })
      )
    );
  }

  // Fallback to the local heuristic — used when Shopify isn't configured,
  // when no mappings exist, when no Shopify-mapped variant is in danger,
  // or when the velocity fetch errored.
  var localSugg = getProductionSuggestions();
  if(!localSugg.length) return null;

// Pure-SVG sparkline. Series is an array of numbers; renders an area
// chart scaled to fit the viewBox. Single colour, single stroke.
// Pretty bare on purpose — this is a 12-pixel sparkline, not a
// dashboard chart. The headline number lives next to it.
function Sparkline(props){
  var series = (props.series || []).map(function(n){ return Number(n) || 0; });
  if(series.length < 2) return e('div',{style:{height:'40px'}}, null);
  var max = Math.max.apply(null, series);
  var min = Math.min.apply(null, series);
  var range = max - min || 1;
  var w = 200, h = 50;
  var points = series.map(function(v, i){
    var x = (i / (series.length - 1)) * w;
    var y = h - ((v - min) / range) * (h - 4) - 2;
    return [x, y];
  });
  var line = points.map(function(p){return p[0].toFixed(1) + ',' + p[1].toFixed(1)}).join(' ');
  var area = '0,' + h + ' ' + line + ' ' + w + ',' + h;
  var color = props.color || 'var(--gold)';
  var fillOpacity = props.fillOpacity || 0.12;
  return e('svg', {
    viewBox: '0 0 ' + w + ' ' + h,
    preserveAspectRatio:'none',
    style:{display:'block',width:'100%',height:'40px',overflow:'visible'},
    'aria-hidden':'true'
  },
    e('polygon', { points: area, fill: color, opacity: fillOpacity }),
    e('polyline', { points: line, fill:'none', stroke: color, 'stroke-width':1.5, 'stroke-linecap':'round', 'stroke-linejoin':'round' })
  );
}

// ── Trend Charts Card ──
// Three sparklines on the dashboard: orders/week, revenue/week, top
// product velocity over the last 12 weeks. Pulls from the new
// /shopify/trends worker endpoint. One card replaces what would
// otherwise be three separate widgets — keeps the dashboard calm.
function TrendChartsCard(props){
  var ds = useState(null);
  var data = ds[0], setData = ds[1];
  var es = useState(null);
  var err = es[0], setErr = es[1];
  var ls2 = useState(false);
  var loading = ls2[0], setLoading = ls2[1];

  function load(force){
    if(!shopifyConfigured()) return;
    setLoading(true); setErr(null);
    shopifyTrends({weeks:12, refresh: !!force}).then(function(res){
      setData(res); setLoading(false);
    }).catch(function(e){
      setErr(e && e.message ? e.message : String(e));
      setLoading(false);
    });
  }
  useEffect(function(){ load(false) }, []);

  if(!shopifyConfigured()) return null;

  if(loading && !data && !err){
    return e('div',{className:'card'},
      e('div',{className:'card-body',style:{padding:'14px 16px'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,marginBottom:'10px'}},
          e('span',{style:{color:'var(--text-muted)',display:'flex'}},Icon('history',16)),
          'Trends · 12 weeks'),
        [0,1,2].map(function(i){
          return e('div',{key:i,style:{marginBottom:'10px'}},
            e(Skel,{style:{height:'12px',width:'30%',marginBottom:'4px'}}),
            e(Skel,{style:{height:'40px',width:'100%'}})
          );
        })
      )
    );
  }
  if(err) return e(ErrorCard,{title:'Couldn\'t load trends', message:err, onRetry:function(){load(true)}});
  if(!data || !data.buckets || data.buckets.length === 0) return null;

  var currency = data.shop && data.shop.currency || 'NZD';
  function money(n){
    if(typeof n !== 'number' || !isFinite(n)) return '—';
    try { return new Intl.NumberFormat('en-NZ',{style:'currency',currency:currency,maximumFractionDigits:0}).format(n); }
    catch(e){ return '$' + n.toFixed(0); }
  }

  // Series
  var orders = data.buckets.map(function(b){return b.orderCount||0});
  var revenue = data.buckets.map(function(b){return b.revenueAmount||0});
  // Top-product velocity → pick the variantId that sold most across the
  // whole 12 weeks, then plot its weekly qty. Keeps the third chart
  // representative rather than jumping between products each week.
  var totals = {};
  data.buckets.forEach(function(b){
    if(b.topVariantId !== null && b.topVariantQty > 0){
      totals[b.topVariantId] = (totals[b.topVariantId] || 0) + b.topVariantQty;
    }
  });
  var winner = Object.keys(totals).sort(function(a,b){return totals[b]-totals[a]})[0];
  var topQty = data.buckets.map(function(b){
    return (b.topVariantId && String(b.topVariantId) === winner) ? b.topVariantQty : 0;
  });
  var topTitle = (function(){
    for(var i=data.buckets.length-1;i>=0;i--){
      if(data.buckets[i].topVariantId && String(data.buckets[i].topVariantId) === winner){
        return data.buckets[i].topVariantTitle;
      }
    }
    return null;
  })();

  // Headline numbers — sums + this-week-vs-last-week deltas
  var totalOrders = orders.reduce(function(a,b){return a+b},0);
  var totalRevenue = revenue.reduce(function(a,b){return a+b},0);
  var lastIdx = orders.length - 1;
  function delta(arr){
    if(arr.length < 2) return null;
    var a = arr[lastIdx-1], b = arr[lastIdx];
    if(a === 0) return null;
    return Math.round(((b - a) / a) * 100);
  }
  function deltaPill(d){
    if(d === null) return null;
    var color = d > 0 ? 'var(--green)' : d < 0 ? 'var(--red)' : 'var(--text-muted)';
    var prefix = d > 0 ? '+' : '';
    return e('span',{style:{fontSize:'10px',fontWeight:600,color:color,marginLeft:'6px'}}, prefix + d + '%');
  }

  function row(label, value, color, series, deltaPct){
    return e('div',{style:{padding:'8px 0',borderTop:'1px solid var(--border-light)'}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'4px'}},
        e('div',{style:{fontSize:'11px',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em'}}, label),
        e('div',{style:{fontSize:'14px',fontWeight:600,fontVariantNumeric:'tabular-nums'}}, value, deltaPill(deltaPct))
      ),
      e(Sparkline,{series:series, color:color})
    );
  }

  return e('div',{className:'card'},
    e('div',{className:'card-body',style:{padding:'12px 16px'}},
      e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px'}},
        e('span',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,color:'var(--text)'}},
          e('span',{style:{color:'var(--text-muted)',display:'flex'}},Icon('history',16)),
          'Trends · 12 weeks'),
        e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:function(){load(true)},disabled:loading,title:'Refresh now'},loading ? '…' : Icon('refresh',12))
      ),
      e('div',{style:{fontSize:'10px',color:'var(--text-muted)',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'0.05em'}},'Last bucket vs the one before'),
      row('Orders / week', totalOrders + ' total', 'var(--gold)', orders, delta(orders)),
      row('Revenue / week', money(totalRevenue) + ' total', 'var(--green)', revenue, delta(revenue)),
      topTitle ? row('Top: ' + topTitle, topQty.reduce(function(a,b){return a+b},0) + ' units', 'var(--blue)', topQty, delta(topQty)) : null
    )
  );
}

// ── Ingredient Demand Forecast Card ──
// Combines Shopify sales velocity with recipe→variant mappings to project
// when each ingredient runs out. Surfaces the soonest 5 with daysUntilOut
// rank. Renders nothing if Shopify isn't configured or there's no signal.
//
// Math:
//   recipe_dailyUnits = Σ(v.dailyRate) over variants mapped to this recipe
//   recipe_dailyGrams = recipe_dailyUnits × avg_fillWeight  (from batchLogs)
//   ingredient_dailyGrams = Σ across recipes of (ing.gramsPer100 × recipe_dailyGrams / 100)
//   daysUntilOut = stock / ingredient_dailyGrams
//
// fillWeight defaults to 50g if there are no past batches with that recipe.
function IngredientDemandCard(props){
  var ds = useState(null);
  var data = ds[0], setData = ds[1];
  var es = useState(null);
  var err = es[0], setErr = es[1];
  var ls2 = useState(false);
  var loading = ls2[0], setLoading = ls2[1];

  function load(){
    if(!shopifyConfigured()) return;
    setLoading(true); setErr(null);
    shopifyInventoryVelocity({days:30}).then(function(res){
      setData(res); setLoading(false);
    }).catch(function(e){
      setErr(e && e.message ? e.message : String(e));
      setLoading(false);
    });
  }
  useEffect(load, []);

  if(!shopifyConfigured()) return null;

  // Skeleton while we wait for the first response
  if(loading && !data && !err){
    return e('div',{className:'card'},
      e('div',{className:'card-body',style:{padding:'14px 16px'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,marginBottom:'10px'}},
          e('span',{style:{color:'var(--text-muted)',display:'flex'}},Icon('flask',16)),
          'Ingredient demand forecast'),
        [0,1,2,3,4].map(function(i){
          return e(Skel,{key:i,style:{height:'14px',width:(80-i*8)+'%',marginBottom:'8px'}});
        })
      )
    );
  }
  if(err) return e(ErrorCard,{title:'Couldn\'t forecast demand',message:err,onRetry:load});
  if(!data || !data.variants) return null;

  // Build recipe → daily-units map from velocity + mappings
  var byVariant = {};
  data.variants.forEach(function(v){ byVariant[v.variantId] = v; });
  var mappings = ls('shopifyMappings',{});
  var allRecipes = getAllRecipes();
  var batchLogs = ls('batchLogs',[]);
  var stockData = ls('ingredientData',{});

  // Per-recipe avg fill weight from past batches (fallback 50g)
  function avgFill(recipeId){
    var fills = batchLogs.filter(function(b){return b.recipeId===recipeId && b.containerSize > 0}).map(function(b){return b.containerSize});
    if(fills.length === 0) return 50;
    return fills.reduce(function(a,b){return a+b},0) / fills.length;
  }

  // Per-recipe daily grams (units/day × avg fill)
  var recipeDailyGrams = {};
  Object.keys(mappings).forEach(function(rid){
    var m = mappings[rid];
    if(!m || !m.products) return;
    var unitsPerDay = 0;
    m.products.forEach(function(p){
      var v = byVariant[p.variantId];
      if(v && typeof v.dailyRate === 'number') unitsPerDay += v.dailyRate;
    });
    if(unitsPerDay > 0){
      recipeDailyGrams[rid] = unitsPerDay * avgFill(rid);
    }
  });

  // Aggregate ingredient demand: gramsPer100 × recipeDailyGrams / 100
  var ingredientDaily = {};
  allRecipes.forEach(function(r){
    var dg = recipeDailyGrams[r.id];
    if(!dg) return;
    (r.phases||[]).forEach(function(phase){
      (phase.ingredients||[]).forEach(function(ing){
        if(!ing.name || !(ing.grams > 0)) return;
        var key = ing.name.toLowerCase();
        if(!ingredientDaily[key]) ingredientDaily[key] = { name: ing.name, gramsPerDay: 0 };
        ingredientDaily[key].gramsPerDay += (ing.grams * dg / 100);
      });
    });
  });

  // Project days until out using local stock data
  var projections = Object.keys(ingredientDaily).map(function(key){
    var item = ingredientDaily[key];
    var ud = stockData[key] || {};
    var stock = (typeof ud.stock === 'number' && ud.stock >= 0) ? ud.stock : null;
    var leadDays = (typeof ud.leadDays === 'number' && ud.leadDays > 0) ? ud.leadDays : 14;
    var daysOut = stock !== null && item.gramsPerDay > 0 ? stock / item.gramsPerDay : null;
    return {
      name: item.name,
      gramsPerDay: item.gramsPerDay,
      stock: stock,
      leadDays: leadDays,
      daysOut: daysOut,
      urgent: daysOut !== null && daysOut <= leadDays + 2
    };
  }).filter(function(p){return p.daysOut !== null}); // can only rank ones with stock data

  if(projections.length === 0) return null;
  projections.sort(function(a,b){return a.daysOut - b.daysOut});
  var top = projections.slice(0,5);
  if(top.length === 0) return null;

  function fmtDays(d){
    if(d <= 0) return 'Out';
    if(d < 1) return '<1d';
    return Math.round(d) + 'd';
  }

  return e('div',{className:'card'},
    e('div',{className:'card-body',style:{padding:'12px 16px'}},
      e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}},
        e('span',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',fontWeight:600,color:'var(--text)'}},
          e('span',{style:{color:'var(--text-muted)',display:'flex'}},Icon('flask',16)),
          'Ingredient demand forecast'),
        e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:load,disabled:loading,title:'Refresh now'},loading?'…':Icon('refresh',12))
      ),
      e('div',{style:{fontSize:'10px',color:'var(--text-muted)',marginBottom:'8px',textTransform:'uppercase',letterSpacing:'0.05em'}},'Based on Shopify sales velocity · 30d'),
      top.map(function(p,i){
        return e('div',{key:p.name,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderTop:i>0?'1px solid var(--border-light)':'none',gap:'8px'}},
          e('div',{style:{flex:1,minWidth:0}},
            e('div',{style:{fontSize:'13px',fontWeight:500,color:p.urgent?'var(--red)':'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}, p.name),
            e('div',{style:{fontSize:'11px',color:'var(--text-muted)'}},
              p.stock.toFixed(0) + 'g · ~' + p.gramsPerDay.toFixed(1) + 'g/day · lead ' + p.leadDays + 'd'
            )
          ),
          e('div',{style:{fontSize:'14px',fontWeight:600,color:p.urgent?'var(--red)':'var(--text)',fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}}, fmtDays(p.daysOut)),
          e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:function(){props.nav && props.nav('ingredients')}},'Open')
        );
      })
    )
  );
}

function TipOfDay(props){
  var todayStr = new Date().toISOString().slice(0,10);
  var dis = useState(ls('tipDismissedDate', '') === todayStr);
  var dismissed = dis[0], setDismissed = dis[1];
  if(dismissed) return null;
  // Pick deterministically by date + a small hash so adjacent days differ
  var seed = 0;
  for(var i = 0; i < todayStr.length; i++){ seed = (seed * 31 + todayStr.charCodeAt(i)) | 0; }
  var idx = ((seed % TIPS.length) + TIPS.length) % TIPS.length;
  var tip = TIPS[idx];
  function dismiss(ev){
    ev.stopPropagation();
    lsSet('tipDismissedDate', todayStr);
    setDismissed(true);
  }
  return e('div', {
    className:'card',
    style:{
      marginBottom:'var(--space-3)',
      padding:'var(--space-3) var(--space-4)',
      display:'flex',alignItems:'center',gap:'var(--space-3)',
      borderColor:'var(--gold-soft)',background:'var(--gold-soft)'
    },
    onClick: function(){ if(props.nav && tip.nav) props.nav(tip.nav); },
    onKeyDown: function(ev){
      if((ev.key === 'Enter' || ev.key === ' ') && props.nav && tip.nav){
        ev.preventDefault();
        props.nav(tip.nav);
      }
    },
    role:'button',tabIndex:0
  },
    e('span',{style:{color:'var(--gold)',display:'flex',flexShrink:0}}, Icon('lightbulb',18)),
    e('div',{style:{flex:1,minWidth:0,fontSize:'var(--text-sm)',color:'var(--text)',lineHeight:'var(--leading-snug)'}},
      e('span',{style:{fontSize:'10px',fontWeight:'var(--weight-semi)',color:'var(--gold)',textTransform:'uppercase',letterSpacing:'0.05em',marginRight:'8px'}},'Tip'),
      tip.text
    ),
    e('button',{
      className:'modal-close',
      onClick:dismiss,
      style:{padding:'4px 8px',fontSize:'14px',color:'var(--text-muted)',flexShrink:0},
      'aria-label':'Dismiss tip for today',
      title:'Dismiss for today'
    }, '✕')
  );
}

// ── Dashboard ──
function Dashboard(props){
  var syncTick = useSyncTick();

  // Daily push triggers — manual-release-due + low-stock. Fires at most once
  // per local day per trigger; worker also dedupes 24h. Best-effort, no UI.
  useEffect(function(){
    try { maybeFireDailyPushTriggers(); } catch(e){ console.warn('push triggers failed', e) }
  },[]);

  // Stamp last-visit timestamp every mount. Used by the attention inbox
  // (recalled batches in the last 7 days) and reserved for future
  // "since you were here" features. Stamped after a 1-frame delay so
  // the inbox computation reading lastDashboardVisit on first render
  // still sees the *previous* visit, not now.
  useEffect(function(){
    var prev = ls('lastDashboardVisit', null);
    requestAnimationFrame(function(){
      lsSet('lastDashboardVisit', Date.now());
    });
    // expose previous timestamp for the inbox computation below
    window._geckoPrevDashVisit = prev;
  },[]);

  // Memoize the heavy reads — only recompute when sync data changes, not on every
  // 1Hz cooldown re-render of the parent App component.
  var stats = useMemo(function(){
    var batchLogs = ls('batchLogs',[]);
    var now = new Date();
    var thisMonth = 0, totalUnits = 0;
    for(var i=0;i<batchLogs.length;i++){
      var b = batchLogs[i];
      totalUnits += (b.unitsProduced||0);
      if(b.date){
        var d = new Date(b.date);
        if(d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear()) thisMonth++;
      }
    }
    return {batchLogs:batchLogs, thisMonth:thisMonth, totalUnits:totalUnits};
  },[syncTick]);
  var batchLogs = stats.batchLogs;
  var thisMonth = {length: stats.thisMonth};
  var totalUnits = stats.totalUnits;
  var lastBackup = ls('lastBackupDate',null);
  var daysSinceBackup = lastBackup ? Math.floor((Date.now()-new Date(lastBackup).getTime())/(86400000)) : 999;

  return e('div',{className:'container'},
    e('div',{className:'dash-stats'},
      e('div',{className:'stat-card'},e('div',{className:'stat-num'},getAllRecipes().length),e('div',{className:'stat-label'},'Recipes')),
      e('div',{className:'stat-card'},e('div',{className:'stat-num'},thisMonth.length),e('div',{className:'stat-label'},'Batches This Month')),
      e('div',{className:'stat-card'},e('div',{className:'stat-num'},totalUnits),e('div',{className:'stat-label'},'Total Units'))
    ),

    // "Since your last visit" line — uses the previous lastDashboardVisit
    // timestamp captured by the useEffect above. Counts batches logged
    // and pushes any recent recall flags. Renders only when the gap is
    // big enough to be interesting (> 30 min and < 30 days).
    (function(){
      var prev = window._geckoPrevDashVisit;
      if(!prev) return null;
      var prevMs = parseInt(prev, 10) || 0;
      if(!prevMs) return null;
      var gap = Date.now() - prevMs;
      if(gap < 30 * 60 * 1000 || gap > 30 * 86400 * 1000) return null;
      var newBatches = (ls('batchLogs', []) || []).filter(function(b){
        var t = b.loggedAt || (b.date ? new Date(b.date).getTime() : 0);
        return t >= prevMs;
      }).length;
      var feed = ls('activityFeed', []) || [];
      var newActivity = feed.filter(function(a){
        var t = a.time ? new Date(a.time).getTime() : 0;
        return t >= prevMs;
      }).length;
      if(newBatches === 0 && newActivity === 0) return null;
      // "X hours" / "X days" gap label
      var gapLabel = gap < 3600000 ? Math.round(gap/60000) + ' min'
        : gap < 86400000 ? Math.round(gap/3600000) + ' h'
        : Math.round(gap/86400000) + ' d';
      var parts = [];
      if(newBatches > 0) parts.push(newBatches + ' new batch' + (newBatches===1?'':'es'));
      if(newActivity > newBatches) parts.push((newActivity - newBatches) + ' other action' + (newActivity-newBatches===1?'':'s'));
      return e('div',{
        style:{
          padding:'8px 14px',marginBottom:'var(--space-3)',
          background:'var(--bg-sunken)',borderRadius:'var(--radius-sm)',
          fontSize:'var(--text-xs)',color:'var(--text-muted)',
          display:'flex',alignItems:'center',gap:'8px'
        }
      },
        e('span',{style:{color:'var(--text-subtle)',display:'flex'}}, Icon('history',12)),
        'Since ' + gapLabel + ' ago: ' + parts.join(' · ')
      );
    })(),

    // Tip of the day — small dismissible line that rotates by date.
    // Each day picks the same tip across reloads (so it doesn't churn
    // mid-day) and the user can hide it for that day with one tap.
    e(TipOfDay, {nav:props.nav}),

    // ── Needs-your-attention inbox ──
    // Single rolled-up card that consolidates backup reminders, storage
    // warnings, and low-stock alerts. Replaces the previous trio of
    // separate cards. Tier 4.F adds manual-release-pending + recall +
    // new-orders to the same card.
    (function(){
      var items = [];

      // Backup reminder
      if(daysSinceBackup >= 7){
        items.push({
          urgent:false,
          title: lastBackup ? 'Time for a backup' : 'No backups yet',
          detail: lastBackup ? 'Last backup '+fmtDate(lastBackup)+'. Tap to export now.' : 'One tap saves everything to a single file.',
          actionLabel:'Backup',
          onAction:function(){exportBackup()}
        });
      }

      // Storage meter
      var frac = lsUsedFraction();
      if(frac >= 0.8){
        var pct = Math.round(frac*100);
        var critical = frac >= 0.95;
        items.push({
          urgent:critical,
          title:(critical?'Storage almost full':'Storage filling up')+' — '+pct+'%',
          detail:critical?'New edits may fail to save. Empty Trash and export a backup first.':'Export a backup and clear old recipe versions.',
          actionLabel:'Manage',
          onAction:function(){props.nav('settings')}
        });
      }

      // Manual-release-due batches — same data the daily push trigger uses.
      // Surfaced here so users see the prompt even if push isn't enabled.
      var dueBatches = getManualReleaseDueBatches();
      if(dueBatches.length > 0){
        var firstBatch = dueBatches[0].batch.batchNumber || 'a batch';
        items.push({
          urgent:false,
          title: dueBatches.length === 1
            ? 'Batch ready to release'
            : dueBatches.length + ' batches ready to release',
          detail: dueBatches.length === 1
            ? 'Batch ' + firstBatch + ' has finished curing.'
            : firstBatch + ' and ' + (dueBatches.length - 1) + ' more have finished curing.',
          actionLabel:'Open',
          onAction:function(){props.nav('batches')}
        });
      }

      // Recently recalled batches — last 7 days. Reminder to email buyers
      // (or to revert if it was a mis-click). Includes a quick action to
      // jump to the Batches page where the recall row + buyers modal live.
      var recallCutoff = Date.now() - 7 * 86400 * 1000;
      var recentRecalls = (ls('batchLogs', []) || []).filter(function(b){
        if(b.status !== 'failed') return false;
        var when = b.statusChangedAt || (b.date ? new Date(b.date).getTime() : 0);
        return when >= recallCutoff;
      });
      if(recentRecalls.length > 0){
        var rcFirst = recentRecalls[0].batchNumber || 'a batch';
        items.push({
          urgent: true,
          title: recentRecalls.length === 1
            ? 'Recalled batch needs follow-up'
            : recentRecalls.length + ' recalled batches need follow-up',
          detail: recentRecalls.length === 1
            ? 'Batch ' + rcFirst + ' was recalled — open it to see who bought from it.'
            : rcFirst + ' and ' + (recentRecalls.length - 1) + ' more. Open Batches to email buyers.',
          actionLabel:'Review',
          onAction:function(){props.nav('batches')}
        });
      }

      // Trash items expiring soon — within 5 days of the 30-day purge.
      // Gives Heath a chance to restore anything that was deleted by
      // accident before it's gone for good.
      var expiringSoon = (typeof trashList === 'function' ? trashList() : []).filter(function(t){
        var age = (Date.now() - new Date(t.deletedAt).getTime()) / 86400000;
        return age >= TRASH_TTL_DAYS - 5 && age < TRASH_TTL_DAYS;
      });
      if(expiringSoon.length > 0){
        items.push({
          urgent: false,
          title: expiringSoon.length + ' trash item' + (expiringSoon.length===1?'':'s') + ' expiring soon',
          detail: 'Deleted items get cleared after ' + TRASH_TTL_DAYS + ' days. Restore anything you want to keep.',
          actionLabel:'Open trash',
          onAction:function(){props.nav('trash')}
        });
      }

      // Low-stock ingredients
      var lowItems = getLowStockItems();
      if(lowItems.length > 0){
        var urgentCount = lowItems.filter(function(i){return i.urgent}).length;
        var summary = lowItems.slice(0,3).map(function(it){
          var label = it.name+' ('+it.stock.toFixed(0)+'g';
          if(it.daysLeft != null) label += it.daysLeft <= 0 ? ' · out' : ' · ~'+it.daysLeft+'d';
          return label+')';
        }).join(' · ') + (lowItems.length>3?' …':'');
        items.push({
          urgent: urgentCount > 0,
          title: urgentCount > 0
            ? urgentCount+' ingredient'+(urgentCount!==1?'s':'')+' need reordering now'
            : lowItems.length+' ingredient'+(lowItems.length!==1?'s':'')+' to watch',
          detail:summary,
          actionLabel:'View',
          onAction:function(){props.nav('ingredients')}
        });
      }

      if(items.length === 0) return null;

      var anyUrgent = items.some(function(i){return i.urgent});
      var cls = 'attention-inbox '+(anyUrgent?'has-urgent':'has-warning');

      return e('div',{className:cls,'data-tut':'attention-inbox'},
        e('div',{className:'attention-inbox-header'},
          e('span',{className:'ai-icon'},Icon(anyUrgent?'alert':'bell',18)),
          e('span',{className:'attention-inbox-title'},'Needs your attention'),
          e('span',{className:'attention-inbox-meta'},items.length+' item'+(items.length!==1?'s':''))
        ),
        items.map(function(it,i){
          return e('div',{key:i,className:'attention-item'+(it.urgent?' urgent':'')},
            e('span',{className:'ai-bullet'}),
            e('div',{className:'ai-body'},
              e('div',{className:'ai-title'},it.title),
              it.detail ? e('div',{className:'ai-detail'},it.detail) : null
            ),
            it.actionLabel ? e('button',{className:'ai-action',onClick:it.onAction},it.actionLabel) : null
          );
        })
      );
    })(),

    // Today's Workshop — surfaces only on days with planned batches.
    // Quick entrypoint to the printable runsheet.
    (function(){
      var todayStr = today();
      var sched = ls('scheduledBatches',[]);
      var todays = sched.filter(function(s){return s.date === todayStr && (s.status||'planned') !== 'completed'});
      if(todays.length === 0) return null;
      return e('div',{className:'card',style:{borderColor:'var(--gold)',background:'var(--gold-soft)'}},
        e('div',{className:'card-body',style:{padding:'12px 16px',display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}},
          e('span',{style:{color:'var(--gold)',display:'flex'}},Icon('calendar',18)),
          e('div',{style:{flex:1,minWidth:0}},
            e('div',{style:{fontSize:'13px',fontWeight:600,color:'var(--text)'}},"Today's Workshop"),
            e('div',{style:{fontSize:'12px',color:'var(--text-muted)'}}, todays.length + ' batch' + (todays.length===1?'':'es') + ' planned · tap for the runsheet')
          ),
          e('button',{className:'tool-btn primary',style:{fontSize:'11px',padding:'6px 12px'},onClick:function(){props.nav('today-workshop')}},'Open')
        )
      );
    })(),

    e(ProductionSuggestionsCard,{nav:props.nav, onSelectRecipe:props.onSelectRecipe}),

    // Ingredient demand forecast — projects days-until-out from sales velocity
    e(IngredientDemandCard, {nav:props.nav}),

    // Live snapshot from Shopify (orders + top sellers, last 7 days)
    e('div',{'data-tut':'shopify-card'},e(ShopifyDashboardCard,null)),

    // Trend sparklines — orders, revenue, top product velocity over 12 weeks
    e(TrendChartsCard, null),

    e('div',{style:{fontSize:'14px',fontWeight:600,marginBottom:'8px'}},'Quick Actions'),
    e('div',{'data-tut':'quick-actions',className:'quick-actions'},
      e('button',{className:'qa-btn',onClick:function(){props.nav('recipes')}},e('span',{className:'qa-icon'},Icon('clipboard',20)),e('span',null,'Browse Recipes')),
      e('button',{className:'qa-btn',onClick:function(){props.nav('addRecipe')}},e('span',{className:'qa-icon'},Icon('plus',20)),e('span',null,'Add Recipe')),
      e('button',{className:'qa-btn',onClick:function(){props.nav('ingredients')}},e('span',{className:'qa-icon'},Icon('flask',20)),e('span',null,'Ingredients')),
      e('button',{className:'qa-btn',onClick:function(){props.nav('calendar')}},e('span',{className:'qa-icon'},Icon('calendar',20)),e('span',null,'Calendar')),
      e('button',{className:'qa-btn',onClick:function(){props.nav('batches')}},e('span',{className:'qa-icon'},Icon('package',20)),e('span',null,'Batch History')),
      e('button',{className:'qa-btn',onClick:function(){props.nav('settings')}},e('span',{className:'qa-icon'},Icon('settings',20)),e('span',null,'Settings'))
    ),

    batchLogs.length > 0 ? e('div',{'data-tut':'recent-batches'},

// ── Recipe List ──
function getEffectiveGroup(recipe){
  var overrides = ls('recipeGroupOverrides',{});
  if(overrides[recipe.id]) return overrides[recipe.id];
  return recipe.productLine || 'Ungrouped';
}

function getGroupList(){
  var custom = ls('customGroups',null);
  if(custom) return custom;
  // Build from defaults + any override targets
  var groups = PRODUCT_LINES.slice();
  var overrides = ls('recipeGroupOverrides',{});
  Object.keys(overrides).forEach(function(id){
    var g = overrides[id];
    if(groups.indexOf(g) === -1) groups.push(g);
  });
  return groups;
}

function saveGroupList(groups){
  lsSet('customGroups',groups);
}

function RecipeList(props){
  var ss = useState('');
  var search = ss[0], setSearch = ss[1];
  var pf = useState('All');
  var lineFilter = pf[0], setLineFilter = pf[1];
  var _gm = useState(null);
  var groupMenu = _gm[0], setGroupMenu = _gm[1]; // which group has its menu open
  var _mm = useState(null);
  var moveMenu = _mm[0], setMoveMenu = _mm[1]; // which recipe ID has move-to open
  var _tick = useState(0);
  var tick = _tick[0], setTick = _tick[1]; // force re-render after group changes

  var groups = getGroupList();
  var lines = ['All'].concat(groups);

  // Include user-added recipes (excluding deleted)
  var allRecipes = getAllRecipes();

  // Apply effective group to each recipe for display
  var recipesWithGroup = allRecipes.map(function(r){
    return Object.assign({},r,{_group:getEffectiveGroup(r)});
  });

  var filtered = recipesWithGroup.filter(function(r){
    // Match by recipe name OR by any ingredient in any phase. Lets Heath
    // type "beeswax" and find every recipe that uses it.
    var s = (search || '').toLowerCase();
    var matchSearch = !s || r.name.toLowerCase().indexOf(s) >= 0;
    if(!matchSearch && r.phases){
      for(var pi = 0; pi < r.phases.length && !matchSearch; pi++){
        var ings = (r.phases[pi].ingredients) || [];
        for(var ii = 0; ii < ings.length; ii++){
          if((ings[ii].name || '').toLowerCase().indexOf(s) >= 0){ matchSearch = true; break; }
        }
      }
    }
    var matchLine = lineFilter === 'All' || r._group === lineFilter;
    return matchSearch && matchLine;
  });

  // Group by effective group
  var grouped = {};
  filtered.forEach(function(r){
    var line = r._group;
    if(!grouped[line]) grouped[line] = [];
    grouped[line].push(r);
  });

  function renameGroup(oldName){
    dialogPrompt('Rename group',oldName,{body:'Renaming "'+oldName+'"',placeholder:'New group name'}).then(function(newName){
      if(!newName || newName.trim() === '' || newName.trim() === oldName) return;
      newName = newName.trim();
      var gl = getGroupList();
      var idx = gl.indexOf(oldName);
      if(idx !== -1) gl[idx] = newName;
      else gl.push(newName);
      saveGroupList(gl);
      var ov = ls('recipeGroupOverrides',{});
      Object.keys(ov).forEach(function(id){
        if(ov[id] === oldName) ov[id] = newName;
      });
      allRecipes.forEach(function(r){
        if((r.productLine || 'Ungrouped') === oldName && !ov[r.id]){
          ov[r.id] = newName;
        }
      });
      lsSet('recipeGroupOverrides',ov);
      setGroupMenu(null);
      setTick(tick+1);
      showToast('Group renamed to "'+newName+'"');
    });
  }

  function deleteGroup(groupName){
    var recipesInGroup = recipesWithGroup.filter(function(r){return r._group === groupName});
    var body = recipesInGroup.length > 0
      ? recipesInGroup.length+' recipe'+(recipesInGroup.length!==1?'s':'')+' will be moved to "Ungrouped".'
      : 'This group has no recipes.';
    dialogConfirm('Delete group "'+groupName+'"?', body, {danger:true, confirmLabel:'Delete'}).then(function(ok){
      if(!ok) return;
      var ov = ls('recipeGroupOverrides',{});
      recipesInGroup.forEach(function(r){
        ov[r.id] = 'Ungrouped';
      });
      lsSet('recipeGroupOverrides',ov);
      var gl = getGroupList().filter(function(g){return g !== groupName});
      if(recipesInGroup.length > 0 && gl.indexOf('Ungrouped') === -1) gl.push('Ungrouped');
      saveGroupList(gl);
      setGroupMenu(null);
      if(lineFilter === groupName) setLineFilter('All');
      setTick(tick+1);
      showToast('"'+groupName+'" deleted — recipes moved to Ungrouped');
    });
  }

  function createGroup(){
    dialogPrompt('New group','',{placeholder:'e.g. Gecko Skincare'}).then(function(name){
      if(!name || name.trim() === '') return;
      name = name.trim();
      var gl = getGroupList();
      if(gl.indexOf(name) !== -1){showToast('Group "'+name+'" already exists');return}
      gl.push(name);
      saveGroupList(gl);
      setTick(tick+1);
      showToast('Group "'+name+'" created');
    });
  }

  function moveRecipe(recipeId, targetGroup){
    var ov = ls('recipeGroupOverrides',{});
    ov[recipeId] = targetGroup;
    lsSet('recipeGroupOverrides',ov);
    // Ensure target group is in the list
    var gl = getGroupList();
    if(gl.indexOf(targetGroup) === -1){gl.push(targetGroup);saveGroupList(gl)}
    setMoveMenu(null);
    setTick(tick+1);
    showToast('Recipe moved to "'+targetGroup+'"');
  }

  return e('div',{className:'container'},
    e('div',{'data-tut':'search-bar',className:'search-bar'},
      e('input',{className:'search-input',placeholder:'Search recipes...',value:search,onChange:function(ev){setSearch(ev.target.value)}}),
      e('button',{className:'tool-btn',onClick:createGroup}, Icon('folder-plus',14), 'New group'),
      e('button',{'data-tut':'add-recipe-btn',className:'tool-btn',onClick:function(){props.nav('addRecipe')}}, Icon('plus',14), 'Add')
    ),
    // Group filter pills
    e('div',{style:{display:'flex',gap:'4px',marginBottom:'12px',overflowX:'auto',paddingBottom:'4px',flexWrap:'wrap',alignItems:'center'}},
      lines.map(function(l){
        var count = l === 'All' ? recipesWithGroup.length : recipesWithGroup.filter(function(r){return r._group===l}).length;
        if(l !== 'All' && count === 0) return null;
        return e('button',{key:l,className:'filter-btn'+(lineFilter===l?' active':''),onClick:function(){setLineFilter(l)}},l+' ('+count+')');
      }),
      // Bundles chip \u2014 moved here from Settings. It's a recipe editor, not a setting.
      e('button',{
        'data-tut':'gift-bundles',
        className:'filter-btn',
        style:{marginLeft:'auto',whiteSpace:'nowrap',display:'inline-flex',alignItems:'center',gap:'6px'},
        onClick:function(){props.nav('bundles')},
        title:'Group products into Shopify bundles that share components.'
      }, Icon('package',14), 'Bundles')
    ),
    filtered.length === 0 ? EmptyState({illustration:'recipes', title:'No recipes match', message:'Try a different search or category filter.'}) :
    (lineFilter === 'All' && !search ?
      // Grouped view
      Object.keys(grouped).sort().map(function(line){
        var isMenuOpen = groupMenu === line;
        return e('div',{key:line},
          e('div',{'data-tut':'group-header',style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0 4px',borderBottom:'1px solid var(--border-light)',marginBottom:'4px'}},
            e('div',{style:{fontSize:'13px',fontWeight:600,color:'var(--gold)'}},line+' ('+grouped[line].length+')'),
            e('div',{style:{position:'relative'}},
              e('button',{className:'tool-btn',style:{fontSize:'14px',padding:'2px 8px',lineHeight:'1'},onClick:function(){setGroupMenu(isMenuOpen?null:line);setMoveMenu(null)}},'\u22EF'),
              isMenuOpen ? e('div',{style:{position:'absolute',right:0,top:'100%',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',boxShadow:'0 4px 12px rgba(0,0,0,0.15)',zIndex:100,minWidth:'140px',overflow:'hidden'}},
                e('button',{style:{display:'block',width:'100%',textAlign:'left',padding:'8px 12px',fontSize:'12px',border:'none',background:'none',color:'var(--text)',cursor:'pointer'},onClick:function(){renameGroup(line)}},'\u270F\uFE0F Rename Group'),
                e('button',{style:{display:'block',width:'100%',textAlign:'left',padding:'8px 12px',fontSize:'12px',border:'none',background:'none',color:'#e74c3c',cursor:'pointer'},onClick:function(){deleteGroup(line)}},'\uD83D\uDDD1 Delete Group')
              ) : null
            )
          ),
          grouped[line].map(function(r){
            var isMoveOpen = moveMenu === r.id;
            return e('div',{key:r.id,'data-tut':'recipe-card',className:'recipe-card',style:{position:'relative',zIndex:isMoveOpen?50:'auto'}},
              e('div',{style:{flex:1,cursor:'pointer'},onClick:function(){props.onSelect(r)}},
                e('div',{className:'recipe-name'},r.name),
                e('div',{className:'recipe-meta'},
                  r.category||'',
                  r.format?' \u2022 '+r.format:'',
                  r.totalIngredients?' \u2022 '+r.totalIngredients+' ingredients':''
                )
              ),
              e('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},
                e('button',{className:'tool-btn',style:{fontSize:'10px',padding:'2px 6px'},onClick:function(ev){ev.stopPropagation();setMoveMenu(isMoveOpen?null:r.id);setGroupMenu(null)}},'\u21C4 Move'),
                e('span',{style:{color:'var(--text-muted)',fontSize:'18px',cursor:'pointer'},onClick:function(){props.onSelect(r)}},'\u203A')
              ),
              isMoveOpen ? e('div',{style:{position:'absolute',right:0,top:'100%',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',boxShadow:'0 4px 12px rgba(0,0,0,0.15)',zIndex:100,minWidth:'160px',maxHeight:'200px',overflowY:'auto'}},
                e('div',{style:{padding:'6px 12px',fontSize:'11px',fontWeight:600,color:'var(--text-muted)',borderBottom:'1px solid var(--border-light)'}},'Move to\u2026'),
                groups.filter(function(g){return g !== r._group}).map(function(g){
                  return e('button',{key:g,style:{display:'block',width:'100%',textAlign:'left',padding:'8px 12px',fontSize:'12px',border:'none',background:'none',color:'var(--text)',cursor:'pointer'},onClick:function(ev){ev.stopPropagation();moveRecipe(r.id,g)}},g);
                }),
                groups.filter(function(g){return g !== r._group}).length === 0 ? e('div',{style:{padding:'8px 12px',fontSize:'12px',color:'var(--text-muted)'}},'No other groups') : null
              ) : null
            );
          })
        );
      })
    :
      // Flat list (when filtered or searching)
      filtered.map(function(r){
        var isMoveOpen = moveMenu === r.id;
        return e('div',{key:r.id,className:'recipe-card',style:{position:'relative',zIndex:isMoveOpen?50:'auto'}},
          e('div',{style:{flex:1,cursor:'pointer'},onClick:function(){props.onSelect(r)}},
            e('div',{className:'recipe-name'},r.name),
            e('div',{className:'recipe-meta'},
              r._group||'',
              r.category?' \u2022 '+r.category:'',
              r.format?' \u2022 '+r.format:'',
              r.totalIngredients?' \u2022 '+r.totalIngredients+' ingredients':''
            )
          ),
          e('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},
            e('button',{className:'tool-btn',style:{fontSize:'10px',padding:'2px 6px'},onClick:function(ev){ev.stopPropagation();setMoveMenu(isMoveOpen?null:r.id);setGroupMenu(null)}},'\u21C4 Move'),
            e('span',{style:{color:'var(--text-muted)',fontSize:'18px',cursor:'pointer'},onClick:function(){props.onSelect(r)}},'\u203A')
          ),
          isMoveOpen ? e('div',{style:{position:'absolute',right:0,top:'100%',background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:'var(--radius)',boxShadow:'0 4px 12px rgba(0,0,0,0.15)',zIndex:100,minWidth:'160px',maxHeight:'200px',overflowY:'auto'}},
            e('div',{style:{padding:'6px 12px',fontSize:'11px',fontWeight:600,color:'var(--text-muted)',borderBottom:'1px solid var(--border-light)'}},'Move to\u2026'),
            groups.filter(function(g){return g !== r._group}).map(function(g){
              return e('button',{key:g,style:{display:'block',width:'100%',textAlign:'left',padding:'8px 12px',fontSize:'12px',border:'none',background:'none',color:'var(--text)',cursor:'pointer'},onClick:function(ev){ev.stopPropagation();moveRecipe(r.id,g)}},g);
            })
          ) : null
        );
      })
    )
  );
}

// ── Recipe Detail ──
function RecipeDetail(props){
  var originalRecipe = props.recipe;

  // Version history system
  var versionsKey = 'recipeVersions_'+originalRecipe.id;
  var allVersions = ls(versionsKey, []);
  var latestVersion = allVersions.length > 0 ? allVersions[allVersions.length-1] : null;

  // Also check recipeEdits_ for auto-saved changes (e.g. section reorder)
  var legacyEdits = ls('recipeEdits_'+originalRecipe.id, null);
  var initialPhases = latestVersion ? latestVersion.phases : (legacyEdits && legacyEdits.phases ? legacyEdits.phases : JSON.parse(JSON.stringify(originalRecipe.phases)));
  var initialName = latestVersion ? latestVersion.name : (legacyEdits && legacyEdits.name ? legacyEdits.name : originalRecipe.name);
  var initialSections = latestVersion && latestVersion.sections ? JSON.parse(JSON.stringify(latestVersion.sections)) : (legacyEdits && legacyEdits.sections ? JSON.parse(JSON.stringify(legacyEdits.sections)) : JSON.parse(JSON.stringify(originalRecipe.sections||[])));

  var ps = useState(initialPhases);
  var phases = ps[0], setPhases = ps[1];
  var ns = useState(initialName);
  var recipeName = ns[0], setRecipeName = ns[1];
  var ss2 = useState(initialSections);
  var sections = ss2[0], setSections = ss2[1];

  var showCalc = useState(false);
  var calcOpen = showCalc[0], setCalcOpen = showCalc[1];
  // Cost & margin card is hidden by default — tap the Cost button on
  // the toolbar to expand it. Keeps the recipe page calm on open.
  var showCost = useState(false);
  var costOpen = showCost[0], setCostOpen = showCost[1];
  var em = useState(false);
  var editing = em[0], setEditing = em[1];
  var vp = useState(false);
  var showVersions = vp[0], setShowVersions = vp[1];
  var dp = useState(null);
  var diffVersion = dp[0], setDiffVersion = dp[1];
  var hasEdits = allVersions.length > 0;
  // Toolbar overflow menu — true while the ⋯ sheet is open. Holds rarely
  // used recipe actions (Duplicate, Labels, Export, Delete, Edit) so the
  // primary toolbar can stay focused on Produce.
  var tm = useState(false);
  var toolMenuOpen = tm[0], setToolMenuOpen = tm[1];

  // Build a working recipe object that uses current state
  var recipe = Object.assign({}, originalRecipe, {phases: phases, name: recipeName, sections: sections});

  function saveEdits(){
    dialogPrompt('Version note','',{
      body:'What changed in this version? (optional)',
      placeholder:'e.g. Reduced beeswax to 10%',
      multiline:true,
      confirmLabel:'Save Version'
    }).then(function(noteText){
      if(noteText===null) return;
      var versions = ls(versionsKey, []);
      var vNum = 'V'+(versions.length+1)+'.0';
      versions.push({
        versionId: uid(),
        versionNumber: vNum,
        name: recipeName,
        phases: JSON.parse(JSON.stringify(phases)),
        sections: JSON.parse(JSON.stringify(sections)),
        savedAt: new Date().toISOString(),
        author: ls('activeProfile','Heath'),
        changeNotes: noteText || ''
      });
      lsSet(versionsKey, pruneVersions(versions));
      lsSet('recipeEdits_'+originalRecipe.id, {phases: phases, sections: sections, name: recipeName, savedAt: new Date().toISOString()});
      showToast('Saved as '+vNum);logActivity('edited recipe',originalRecipe.name+' → '+vNum);
      setEditing(false);
    });
  }

  function rollbackTo(versionIdx){
    if(versionIdx === -1){
      dialogConfirm('Revert to original?','This creates a new version with the original recipe contents. Your current edits will remain in version history.',{confirmLabel:'Revert',danger:true}).then(function(ok){
        if(!ok) return;
        var orig = JSON.parse(JSON.stringify(originalRecipe.phases));
        var origSec = JSON.parse(JSON.stringify(originalRecipe.sections||[]));
        setPhases(orig);
        setSections(origSec);
        setRecipeName(originalRecipe.name);
        var versions = ls(versionsKey, []);
        versions.push({versionId:uid(),versionNumber:'V'+(versions.length+1)+'.0',name:originalRecipe.name,phases:orig,sections:origSec,savedAt:new Date().toISOString(),author:ls('activeProfile','Heath'),changeNotes:'Rolled back to original'});
        lsSet(versionsKey, pruneVersions(versions));
        lsSet('recipeEdits_'+originalRecipe.id, {phases:orig,sections:origSec,name:originalRecipe.name,savedAt:new Date().toISOString()});
        showToast('Rolled back to original');
        setEditing(false);
        setDiffVersion(null);
      });
    } else {
      var versions = ls(versionsKey, []);
      var v = versions[versionIdx];
      if(!v) return;
      dialogConfirm('Roll back to '+v.versionNumber+'?','This creates a new version with the contents of '+v.versionNumber+'.',{confirmLabel:'Roll Back',danger:true}).then(function(ok){
        if(!ok) return;
        var restoredPhases = JSON.parse(JSON.stringify(v.phases));
        var restoredSections = v.sections ? JSON.parse(JSON.stringify(v.sections)) : JSON.parse(JSON.stringify(originalRecipe.sections||[]));
        setPhases(restoredPhases);
        setSections(restoredSections);
        setRecipeName(v.name);
        var versions2 = ls(versionsKey, []);
        versions2.push({versionId:uid(),versionNumber:'V'+(versions2.length+1)+'.0',name:v.name,phases:restoredPhases,sections:restoredSections,savedAt:new Date().toISOString(),author:ls('activeProfile','Heath'),changeNotes:'Rolled back to '+v.versionNumber});
        lsSet(versionsKey, pruneVersions(versions2));
        lsSet('recipeEdits_'+originalRecipe.id, {phases:restoredPhases,sections:restoredSections,name:v.name,savedAt:new Date().toISOString()});
        showToast('Rolled back to '+v.versionNumber);
        setEditing(false);
        setDiffVersion(null);
      });
    }
  }

  function discardEdits(){
    rollbackTo(-1);
  }

  function updateIngredient(phaseIdx, ingIdx, field, value){
    var newPhases = JSON.parse(JSON.stringify(phases));
    newPhases[phaseIdx].ingredients[ingIdx][field] = value;
    // Recalc totals
    var p = newPhases[phaseIdx];
    p.totalGrams = p.ingredients.reduce(function(s,i){return s+i.grams},0);
    p.totalPercent = p.ingredients.reduce(function(s,i){return s+i.percent},0);
    setPhases(newPhases);
  }

  function addIngredient(phaseIdx){
    var newPhases = JSON.parse(JSON.stringify(phases));
    newPhases[phaseIdx].ingredients.push({id:uid(),number:newPhases[phaseIdx].ingredients.length+1,name:'New Ingredient',grams:0,percent:0,function:''});
    setPhases(newPhases);
  }

  function removeIngredient(phaseIdx, ingIdx){
    var newPhases = JSON.parse(JSON.stringify(phases));
    newPhases[phaseIdx].ingredients.splice(ingIdx, 1);
    // Renumber
    newPhases[phaseIdx].ingredients.forEach(function(ing,i){ing.number=i+1});
    // Recalc
    var p = newPhases[phaseIdx];
    p.totalGrams = p.ingredients.reduce(function(s,i){return s+i.grams},0);
    p.totalPercent = p.ingredients.reduce(function(s,i){return s+i.percent},0);
    setPhases(newPhases);
  }

  function handlePrint(){
    // Print ingredients (phases) + production method + QC checklist
    var sections = document.querySelectorAll('.section');
    sections.forEach(function(sec){
      var title = ((sec.querySelector('.section-title')||{}).textContent||'').toLowerCase();
      var isPhase = title.indexOf('phase ')>-1;
      var isProd = title.indexOf('production')>-1 && title.indexOf('timer')===-1;
      var isQC = title.indexOf('quality')>-1 || title.indexOf('qc')>-1 || title.indexOf('check')>-1;
      if(!isPhase && !isProd && !isQC) sec.setAttribute('data-print-hide','true');
    });
    window.print();
    sections.forEach(function(sec){sec.removeAttribute('data-print-hide')});
  }

  function startBatch(){
    var num = genBatchNum(recipe.name);
    var batch = {
      id:uid(),
      batchNumber:num,
      recipeId:recipe.id,
      recipeName:recipe.name,
      recipeVersion:recipe.version||'V1.0',
      scent:'',
      batchSizeGrams:0,
      unitsProduced:0,
      containerSize:0,
      date:today(),
      qcResults:[],
      notes:'',
      totalCost:0,
      status:'completed',
      author:ls('activeProfile','Heath'),
      expiryDate:addMonths(today(), parseShelfMonths(recipe.shelfLife))
    };
    props.onLogBatch(batch);
  }

  function exportRecipeMD(){
    var text = '# ' + recipe.name + '\n\n';
    var meta = [recipe.category, recipe.format, recipe.shelfLife, recipe.batchSize?recipe.batchSize+'g master batch':null].filter(Boolean);
    if(meta.length) text += meta.join(' • ') + '\n\n';
    // Phases as Markdown tables
    (recipe.phases||[]).forEach(function(p,pi){
      var heading = 'PHASE ' + (p.letter||String.fromCharCode(65+pi));
      if(p.name) heading += ' — ' + p.name;
      text += '## ' + heading + '\n\n';
      if(p.temperature) text += '_Temperature: ' + p.temperature + '_\n\n';
      text += '| # | Ingredient | Grams | % | Function |\n';
      text += '|---|---|---|---|---|\n';
      (p.ingredients||[]).forEach(function(ing){
        var fn = (ing.function||'').replace(/\|/g,'\\|');
        text += '| ' + (ing.number||'') + ' | ' + (ing.name||'') + ' | ' + (ing.grams||0) + ' | ' + (ing.percent||0) + ' | ' + fn + ' |\n';
      });
      text += '\n_Phase total: ' + (p.totalGrams||0).toFixed(1) + 'g · ' + (p.totalPercent||0).toFixed(1) + '%_\n\n';
    });
    // Scent profiles
    if(recipe.scentProfiles && recipe.scentProfiles.length){
      text += '## SCENT PROFILES\n\n';
      recipe.scentProfiles.forEach(function(sp){
        text += '### ' + (sp.name||'Profile') + '\n\n';
        if(sp.description) text += sp.description + '\n\n';
        // Scent profile oils — the parser writes these as `oils`, not
        // `ingredients`. Older code path here read from the wrong key
        // and produced empty tables on every export.
        var spOils = (sp.oils && sp.oils.length) ? sp.oils : (sp.ingredients || []);
        if(spOils.length){
          text += '| Oil | Grams | % |\n|---|---|---|\n';
          spOils.forEach(function(i){
            text += '| ' + (i.name||'') + ' | ' + (i.grams||0) + ' | ' + (i.percent||0) + ' |\n';
          });
          text += '\n';
        }
      });
    }
    // Other sections — convert HTML → Markdown for tables, lists, headings
    (recipe.sections||[]).forEach(function(sec){
      text += '## ' + (sec.title||'Section') + '\n\n';
      text += htmlToMarkdown(sec.html||'') + '\n\n';
    });
    doCopy(text);
  }

  // Section editing functions
  var _editingSec = useState(null);
  var editingSectionIdx = _editingSec[0], setEditingSectionIdx = _editingSec[1];

  function moveSectionToProduction(secIdx){
    var newSecs = JSON.parse(JSON.stringify(sections));
    newSecs[secIdx].category = 'production';
    setSections(newSecs);
    showToast('Moved to production method');
  }

  function moveSectionFromProduction(secIdx){
    var newSecs = JSON.parse(JSON.stringify(sections));
    newSecs[secIdx].category = 'info';
    setSections(newSecs);
    showToast('Moved to More Details');
  }

  function renameSection(secIdx){
    var sec = sections[secIdx];
    dialogPrompt('Rename section', sec.title, {placeholder:'Section title'}).then(function(newTitle){
      if(!newTitle || newTitle === sec.title) return;
      var newSecs = JSON.parse(JSON.stringify(sections));
      newSecs[secIdx].title = newTitle;
      setSections(newSecs);
      showToast('Section renamed');
    });
  }

  function editSectionContent(secIdx, newHtml){
    var newSecs = JSON.parse(JSON.stringify(sections));
    newSecs[secIdx].html = newHtml;
    setSections(newSecs);
  }

  function deleteSection(secIdx){
    var sec = sections[secIdx];
    dialogConfirm('Delete section?','"'+sec.title+'" will be moved to Trash and can be restored within 30 days.',{confirmLabel:'Delete',danger:true}).then(function(ok){
      if(!ok) return;
      var newSecs = JSON.parse(JSON.stringify(sections));
      var removed = newSecs.splice(secIdx, 1)[0];
      if(typeof trashAdd==='function') trashAdd('section',{recipeId:originalRecipe.id,recipeName:recipeName,section:removed,index:secIdx});
      setSections(newSecs);
      // Auto-save the deletion immediately — same pattern as reorderSection.
      // Without this the section would reappear on next visit while the
      // trash row stayed, leaving an orphan.
      lsSet('recipeEdits_'+originalRecipe.id, {phases: phases, sections: newSecs, name: recipeName, savedAt: new Date().toISOString()});
      showToast('Section moved to Trash');
    });
  }

  function reorderSection(fromRealIdx, toRealIdx){
    if(fromRealIdx === toRealIdx) return;
    var newSecs = JSON.parse(JSON.stringify(sections));
    var item = newSecs.splice(fromRealIdx, 1)[0];
    newSecs.splice(toRealIdx, 0, item);
    setSections(newSecs);
    // Auto-save order immediately (no manual save needed)
    lsSet('recipeEdits_'+originalRecipe.id, {phases: phases, sections: newSecs, name: recipeName, savedAt: new Date().toISOString()});
  }

  function addPhase(){
    var newPhases = JSON.parse(JSON.stringify(phases));
    var letter = String.fromCharCode(65 + newPhases.length);
    newPhases.push({
      id: uid(),
      name: 'New Phase',
      letter: letter,
      temperature: '',
      ingredients: [{id:uid(),number:1,name:'New Ingredient',grams:0,percent:0,function:''}],
      totalGrams: 0,
      totalPercent: 0
    });
    setPhases(newPhases);
  }

  function removePhase(phaseIdx){
    if(phases.length <= 1){showToast('Cannot remove the last phase');return}
    var p = phases[phaseIdx];
    var ingCount = (p.ingredients||[]).length;
    dialogConfirm('Remove Phase '+(p.letter||phaseIdx+1)+'?','This deletes the phase and all '+ingCount+' of its ingredients. Recipe edits aren\'t saved until you tap Save.',{confirmLabel:'Remove',danger:true}).then(function(ok){
      if(!ok) return;
      var newPhases = JSON.parse(JSON.stringify(phases));
      newPhases.splice(phaseIdx, 1);
      newPhases.forEach(function(p,i){p.letter = String.fromCharCode(65+i)});
      setPhases(newPhases);
    });
  }

  // Validation
  var grandTotalPct = phases.reduce(function(s,p){return s+p.ingredients.reduce(function(s2,i){return s2+i.percent},0)},0);
  var grandTotalG = phases.reduce(function(s,p){return s+p.ingredients.reduce(function(s2,i){return s2+i.grams},0)},0);
  var pctWarning = Math.abs(grandTotalPct - 100) > 0.5;
  var gramWarning = Math.abs(grandTotalG - (recipe.batchSize||100)) > 0.5;

  return e('div',{className:'container'},
    e('button',{className:'back-btn no-print',onClick:props.onBack},'\u2190 Back'),
    e('div',{className:'recipe-header'},
      editing ? e('input',{className:'form-input',value:recipeName,onChange:function(ev){setRecipeName(ev.target.value)},style:{fontSize:'18px',fontWeight:700,marginBottom:'4px'}}) :
      e('div',{className:'recipe-title'},recipe.name),

// ── Production Notes ──
function ProductionNotes(props){
  var key = 'notes_'+props.recipeId;
  var ns = useState(ls(key,[]));
  var notes = ns[0], setNotesRaw = ns[1];
  var is = useState('');
  var input = is[0], setInput = is[1];

  function setNotes(v){setNotesRaw(v);lsSet(key,v)}
  function addNote(){
    if(!input.trim()) return;
    var n = notes.concat([{id:uid(),text:input.trim(),date:today(),author:ls('activeProfile','Heath')}]);
    setNotes(n);
    setInput('');
  }
  function deleteNote(idx){
    dialogConfirm('Delete this note?',null,{confirmLabel:'Delete',danger:true}).then(function(ok){
      if(!ok) return;
      var n = notes.slice();
      n.splice(idx,1);
      setNotes(n);
    });
  }

  return e('div',{className:'card',style:{marginTop:'12px'}},
    e('div',{className:'card-body',style:{padding:'16px'}},
      e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}},
        e('div',{style:{fontSize:'15px',fontWeight:600}},'\uD83D\uDCDD Notes'),
        notes.length > 0 ? e('span',{style:{fontSize:'12px',color:'var(--text-muted)'}},notes.length+' note'+(notes.length!==1?'s':'')) : null
      ),
      // Quick-add input — always visible and prominent
      e('div',{style:{display:'flex',gap:'8px',marginBottom:notes.length>0?'12px':'0'},className:'no-print'},
        e('input',{className:'form-input',placeholder:'Add a note \u2014 observations, tips, batch feedback...',value:input,onChange:function(ev){setInput(ev.target.value)},onKeyDown:function(ev){if(ev.key==='Enter')addNote()},style:{flex:1,padding:'10px 12px',fontSize:'14px'}}),
        e('button',{className:'tool-btn primary',onClick:addNote,style:{padding:'10px 16px'}},'+  Add')
      ),
      // Existing notes
      notes.length > 0 ? e('div',{style:{borderTop:'1px solid var(--border-light)',paddingTop:'8px'}},
        notes.slice().reverse().map(function(n,i){
          var realIdx = notes.length - 1 - i;

            e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
              e('div',{style:{flex:1,lineHeight:'1.5'}},n.text),

// ── Ingredient Management Helpers ──
function renameIngredient(oldName, newName){
  if(!newName || newName === oldName) return false;
  // Check if newName already exists
  var existing = INGREDIENTS_DB.find(function(i){ return i.name === newName; });
  if(existing){ showToast('An ingredient with that name already exists'); return false; }
  // Update INGREDIENTS_DB
  var dbItem = INGREDIENTS_DB.find(function(i){ return i.name === oldName; });
  if(dbItem) dbItem.name = newName;
  // Update built-in RECIPES array (in-memory)
  RECIPES.forEach(function(r){
    r.phases.forEach(function(p){
      p.ingredients.forEach(function(ing){
        if(ing.name === oldName) ing.name = newName;
      });
    });
  });
  // Update user recipes in localStorage
  var userRecipes = ls('userRecipes',[]);
  var changed = false;
  userRecipes.forEach(function(r){
    r.phases.forEach(function(p){
      p.ingredients.forEach(function(ing){
        if(ing.name === oldName){ ing.name = newName; changed = true; }
      });
    });
  });
  if(changed) lsSet('userRecipes', userRecipes);
  // Persist rename for reload
  var renames = ls('ingredientRenames',{});
  // If oldName was itself a rename target, update the chain
  var origKey = null;
  Object.keys(renames).forEach(function(k){ if(renames[k]===oldName) origKey=k; });
  if(origKey){ renames[origKey] = newName; } else { renames[oldName] = newName; }
  lsSet('ingredientRenames', renames);
  // Update ingredientData keys
  var ud = ls('ingredientData',{});
  if(ud[oldName.toLowerCase()]){
    ud[newName.toLowerCase()] = ud[oldName.toLowerCase()];
    delete ud[oldName.toLowerCase()];
    lsSet('ingredientData', ud);
  }
  // Update description edits key if exists
  var descEdits = ls('ingredientDescEdits',{});
  if(descEdits[oldName]){ descEdits[newName] = descEdits[oldName]; delete descEdits[oldName]; lsSet('ingredientDescEdits',descEdits); }
  showToast('Renamed: '+oldName+' \u2192 '+newName);
  return true;
}

function editIngredientDescription(name, newDesc){
  var dbItem = INGREDIENTS_DB.find(function(i){ return i.name === name; });
  if(dbItem){ dbItem.description = newDesc; }
  // Persist for reload
  var descEdits = ls('ingredientDescEdits',{});
  descEdits[name] = newDesc;
  lsSet('ingredientDescEdits', descEdits);
  showToast('Description updated');
}

function removeIngredient(name){
  var idx = INGREDIENTS_DB.findIndex(function(i){ return i.name === name; });
  if(idx === -1) return;
  INGREDIENTS_DB.splice(idx, 1);
  // Persist for reload
  var removals = ls('ingredientRemovals',[]);
  if(removals.indexOf(name)===-1) removals.push(name);
  lsSet('ingredientRemovals', removals);
  showToast('Removed: '+name);
}

function addNewIngredientsToDB(recipe){
  // Check all ingredients in a recipe and add any that aren't in INGREDIENTS_DB
  var added = [];
  recipe.phases.forEach(function(p){
    p.ingredients.forEach(function(ing){
      var exists = INGREDIENTS_DB.find(function(db){ return db.name === ing.name; });
      if(!exists){
        INGREDIENTS_DB.push({
          name: ing.name,
          function: ing.function || '',
          category: detectIngredientCategory(ing.name, ing.function),
          usedIn: [{recipe: recipe.name, recipeId: recipe.id, percent: ing.percent, grams: ing.grams}],
          description: ing.function ? ing.function.substring(0, 80) : ''
        });
        added.push(ing.name);
      } else {
        // Add usedIn reference if not already there
        var alreadyRef = exists.usedIn.find(function(u){ return u.recipeId === recipe.id && u.percent === ing.percent; });
        if(!alreadyRef){
          exists.usedIn.push({recipe: recipe.name, recipeId: recipe.id, percent: ing.percent, grams: ing.grams});
        }
      }
    });
  });
  return added;
}

function detectIngredientCategory(name, fn){
  var n = (name + ' ' + (fn||'')).toLowerCase();
  if(n.match(/\beo\b|essential oil|fragrance/)) return 'Essential Oil';
  if(n.match(/tallow|oil|butter|squalane|capry/)) return 'Oil';
  if(n.match(/wax|beeswax|candelilla/)) return 'Wax';
  if(n.match(/oxide|zinc|mica|silica|powder|clay/)) return 'Powder / Mineral';
  if(n.match(/extract|infused|botanical|kawakawa|calendula|arnica/)) return 'Botanical / Extract';
  if(n.match(/vitamin|tocopherol|bisabolol|retinol|niacinamide/)) return 'Active';
  if(n.match(/lanolin|emollient|ceramide/)) return 'Emollient';
  return 'Other';
}

// ── Receive Ingredient Modal ──
// Quick "ingredients arrived" check-in. Adds grams to the picked
// ingredient's stock + appends a positive stockMovement entry. Lets
// Heath also update the price-per-gram and supplier in one go (both
// optional). Replaces the multi-step prompt flow that lived behind
// individual ingredient buttons before.
function ReceiveIngredientModal(props){
  var allowed = INGREDIENTS_DB.map(function(i){return i.name});
  // The userData store holds extra ingredient names that aren't in
  // INGREDIENTS_DB but show up in user recipes. Merge them in.
  var existingKeys = Object.keys(ls('ingredientData', {}));
  existingKeys.forEach(function(k){
    var match = allowed.find(function(n){return n.toLowerCase() === k});
    if(!match) allowed.push(k);
  });
  allowed.sort(function(a,b){return a.localeCompare(b)});

  var ns = useState(props.initialName || (allowed[0] || ''));
  var name = ns[0], setName = ns[1];
  var gs = useState('');
  var grams = gs[0], setGrams = gs[1];
  var ps = useState('');
  var price = ps[0], setPrice = ps[1];
  var ss = useState('');
  var supplier = ss[0], setSupplier = ss[1];
  var es = useState(null);
  var err = es[0], setErr = es[1];

  // Pre-fill price + supplier from existing data when the picked name changes
  useEffect(function(){
    if(!name) return;
    var d = ls('ingredientData',{})[name.toLowerCase()] || {};
    setPrice(d.pricePerGram != null ? String(d.pricePerGram) : '');
    setSupplier(d.supplier || '');
  },[name]);

  function save(){
    setErr(null);
    var key = (name || '').trim().toLowerCase();
    if(!key){ setErr('Pick an ingredient'); return; }
    var qty = parseFloat(grams);
    if(!isFinite(qty) || qty <= 0){ setErr('Enter the grams received'); return; }
    var d = ls('ingredientData', {});
    if(!d[key]) d[key] = {};
    var before = parseFloat(d[key].stock) || 0;
    var after = Math.round((before + qty) * 100) / 100;
    d[key].stock = after;
    if(price !== '' && isFinite(parseFloat(price))) d[key].pricePerGram = parseFloat(price);
    if(supplier && supplier.trim()) d[key].supplier = supplier.trim();
    lsSet('ingredientData', d);
    // Log the movement so Recent Stock Movements + daily-usage math see it
    var movements = ls('stockMovements', []);
    movements.unshift({
      id: uid(),
      ingredient: key,
      delta: qty,
      before: before,
      after: after,
      reason: 'received' + (supplier ? ' from ' + supplier : ''),
      date: today(),
      author: ls('activeProfile','User')
    });
    if(movements.length > 500) movements = movements.slice(0, 500);
    lsSet('stockMovements', movements);
    if(typeof logActivity === 'function') logActivity('received ingredient', '+' + qty + 'g ' + name);
    showToast('Received ' + qty + 'g ' + name);
    props.onClose && props.onClose();
  }

  return e('div',{className:'modal-overlay',onClick:props.onClose},
    e('div',{className:'modal',style:{maxWidth:'460px',width:'95%'},onClick:function(ev){ev.stopPropagation()}},
      e('div',{className:'modal-title'},
        e('span',{style:{display:'inline-flex',alignItems:'center',gap:'8px'}}, Icon('package',18), 'Receive ingredients'),
        e('button',{className:'modal-close',onClick:props.onClose,'aria-label':'Close'},'✕')
      ),
      e('div',{style:{fontSize:'12px',color:'var(--text-muted)',marginBottom:'12px'}},'Adds the grams to current stock and logs the movement. Price + supplier are optional but help future cost / reorder maths.'),
      err ? e(ErrorCard,{title:'Hold on',message:err}) : null,
      e('div',{className:'form-group'},
        e('label',{className:'form-label'},'Ingredient'),
        e('select',{className:'form-select',value:name,onChange:function(ev){setName(ev.target.value)},style:{width:'100%'}},
          allowed.map(function(n){return e('option',{key:n,value:n},n)})
        )
      ),
      e('div',{className:'form-group'},
        e('label',{className:'form-label'},'Grams received'),
        e('input',{type:'number',inputMode:'decimal',className:'form-input',value:grams,onChange:function(ev){setGrams(ev.target.value)},placeholder:'e.g. 500', autoFocus:true})
      ),
      e('div',{className:'form-group'},
        e('label',{className:'form-label'},'Price per gram (NZD, optional)'),
        e('input',{type:'number',inputMode:'decimal',className:'form-input',value:price,onChange:function(ev){setPrice(ev.target.value)},placeholder:'e.g. 0.05'})
      ),
      e('div',{className:'form-group'},
        e('label',{className:'form-label'},'Supplier (optional)'),
        e('input',{type:'text',className:'form-input',value:supplier,onChange:function(ev){setSupplier(ev.target.value)},placeholder:'e.g. Manuka Biotic'})
      ),
      e('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end',marginTop:'12px'}},
        e('button',{className:'tool-btn',onClick:props.onClose}, 'Cancel'),
        e('button',{className:'tool-btn primary',onClick:save}, 'Receive')
      )
    )
  );
}
