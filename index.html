// ============================================================
// DIALOG SYSTEM — promise-based replacement for prompt()/confirm()/alert()
// ============================================================
var DIALOG_STATE = {open:false, type:null, options:null, resolver:null};
var DIALOG_LISTENERS = [];

function _notifyDialog(){
  for(var i=0;i<DIALOG_LISTENERS.length;i++){try{DIALOG_LISTENERS[i]()}catch(e){}}
}

function showDialog(opts){
  // Auto-close any existing dialog (resolve as cancelled)
  if(DIALOG_STATE.open && DIALOG_STATE.resolver){
    var prev = DIALOG_STATE.resolver;
    DIALOG_STATE = {open:false, type:null, options:null, resolver:null};
    prev(opts && opts.type==='prompt' ? null : false);
  }
  return new Promise(function(resolve){
    DIALOG_STATE = {open:true, type:opts.type||'alert', options:opts, resolver:resolve};
    _notifyDialog();
  });
}

function _closeDialog(value){
  var resolver = DIALOG_STATE.resolver;
  DIALOG_STATE = {open:false, type:null, options:null, resolver:null};
  _notifyDialog();
  if(resolver) resolver(value);
}

// dialogConfirm(title, body, opts) → Promise<boolean>
function dialogConfirm(title, body, opts){
  opts = opts || {};
  return showDialog({
    type:'confirm', title:title, body:body,
    confirmLabel:opts.confirmLabel||'Confirm',
    cancelLabel:opts.cancelLabel||'Cancel',
    danger:!!opts.danger,
    warn:opts.warn||null
  });
}

// dialogPrompt(title, defaultValue, opts) → Promise<string|null>  (null = cancelled)
function dialogPrompt(title, defaultValue, opts){
  opts = opts || {};
  return showDialog({
    type:'prompt', title:title,
    defaultValue:defaultValue==null?'':String(defaultValue),
    placeholder:opts.placeholder||'',
    inputType:opts.inputType||'text',
    multiline:!!opts.multiline,
    body:opts.body||null,
    confirmLabel:opts.confirmLabel||'OK',
    cancelLabel:opts.cancelLabel||'Cancel',
    danger:!!opts.danger
  });
}

// dialogAlert(title, body) → Promise<true>
function dialogAlert(title, body){
  return showDialog({type:'alert', title:title, body:body, confirmLabel:'OK'});
}

function DialogHost(){
  var st = useState(0);
  var setTick = st[1];
  var inputRef = useRef(null);

  useEffect(function(){
    function listener(){setTick(function(t){return t+1})}
    DIALOG_LISTENERS.push(listener);
    return function(){
      var i = DIALOG_LISTENERS.indexOf(listener);
      if(i!==-1) DIALOG_LISTENERS.splice(i,1);
    };
  },[]);

  useEffect(function(){
    if(DIALOG_STATE.open && DIALOG_STATE.type==='prompt' && inputRef.current){
      var el = inputRef.current;
      setTimeout(function(){
        try{el.focus(); if(el.select) el.select();}catch(e){}
      },60);
    }
  });

  if(!DIALOG_STATE.open) return null;
  var opts = DIALOG_STATE.options || {};
  var type = DIALOG_STATE.type;

  function onConfirm(){
    if(type==='prompt'){
      var v = inputRef.current ? inputRef.current.value : '';
      _closeDialog(v);
    } else if(type==='confirm'){
      _closeDialog(true);
    } else {
      _closeDialog(true);
    }
  }
  function onCancel(){
    _closeDialog(type==='prompt' ? null : false);
  }
  function onKey(ev){
    if(ev.key==='Enter' && type!=='alert' && !(type==='prompt' && opts.multiline)){
      ev.preventDefault();
      onConfirm();
    } else if(ev.key==='Escape'){
      ev.preventDefault();
      onCancel();
    }
  }

  return e('div',{
    className:'dialog-overlay',
    onClick:function(ev){if(ev.target===ev.currentTarget) onCancel()},
    onKeyDown:onKey
  },
    e('div',{className:'dialog-card'},
      opts.title ? e('div',{className:'dialog-title'},opts.title) : null,
      opts.warn ? e('div',{className:'dialog-warn'},opts.warn) : null,
      opts.body ? e('div',{className:'dialog-body'},opts.body) : null,
      type==='prompt' ? (opts.multiline
        ? e('textarea',{
            ref:inputRef, className:'dialog-input dialog-textarea',
            defaultValue:opts.defaultValue, placeholder:opts.placeholder,
            onKeyDown:onKey
          })
        : e('input',{
            ref:inputRef, className:'dialog-input',
            defaultValue:opts.defaultValue, placeholder:opts.placeholder,
            type:opts.inputType||'text',
            onKeyDown:onKey
          })
      ) : null,
      e('div',{className:'dialog-actions'},
        type!=='alert' ? e('button',{className:'dialog-btn dialog-btn-cancel',onClick:onCancel},opts.cancelLabel||'Cancel') : null,
        e('button',{
          className:'dialog-btn dialog-btn-confirm'+(opts.danger?' dialog-btn-danger':''),
          onClick:onConfirm
        },opts.confirmLabel||'OK')
      )
    )
  );
}

// ============================================================
// PAT ENCRYPTION — optional passphrase-based AES-GCM at-rest encryption
// ============================================================
// When enabled, the GitHub PAT in syncConfig is replaced with an encrypted
// blob. The decrypted token lives only in sessionStorage (cleared when the
// browser/PWA is closed) and never touches localStorage in plaintext.
//
// Storage shape when locked:
//   syncConfig = { gistId, encrypted: { salt, iv, ct } }   // no `pat` field
// Plaintext shape (legacy / not-locked):
//   syncConfig = { gistId, pat }
function _b64encode(buf){
  var bytes = new Uint8Array(buf);
  var bin = '';
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function _b64decode(s){
  var bin = atob(s);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function deriveKey(passphrase, saltBytes){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(passphrase), {name:'PBKDF2'}, false, ['deriveKey'])
    .then(function(baseKey){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:saltBytes, iterations:200000, hash:'SHA-256'},
        baseKey,
        {name:'AES-GCM', length:256},
        false,
        ['encrypt','decrypt']
      );
    });
}

function encryptPAT(plaintext, passphrase){
  if(!window.crypto || !window.crypto.subtle) return Promise.reject(new Error('Web Crypto unavailable'));
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var enc = new TextEncoder();
  return deriveKey(passphrase, salt).then(function(key){
    return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, enc.encode(plaintext));
  }).then(function(ct){
    return {salt:_b64encode(salt), iv:_b64encode(iv), ct:_b64encode(ct)};
  });
}

function decryptPAT(blob, passphrase){
  if(!window.crypto || !window.crypto.subtle) return Promise.reject(new Error('Web Crypto unavailable'));
  return deriveKey(passphrase, _b64decode(blob.salt)).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:_b64decode(blob.iv)}, key, _b64decode(blob.ct));
  }).then(function(plain){
    return new TextDecoder().decode(plain);
  });
}

// Returns the in-memory PAT, or a Promise<string> if it needs to be unlocked.
// Use this anywhere the previous code did `config.pat`.
function getActivePAT(){
  var cfg = ls('syncConfig', null);
  if(!cfg) return null;
  // Plaintext (legacy / not locked) — return directly
  if(cfg.pat) return cfg.pat;
  // Encrypted — check session cache
  var cached = sessionStorage.getItem('gecko_pat_cache');
  if(cached) return cached;
  return null;
}

// Mirror of getActivePAT for the Shopify HMAC key. Returns the plaintext
// HMAC if the workspace is unlocked (or never was locked); null when locked.
// Use this anywhere the previous code did `shopifyConfig().hmacKey`.
function getActiveHmacKey(){
  var sc = ls('shopifyConfig', null);
  if(!sc) return null;
  if(sc.hmacKey) return sc.hmacKey;
  var cached = sessionStorage.getItem('gecko_hmac_cache');
  if(cached) return cached;
  return null;
}

// Async unlock: prompts for the passphrase, decrypts, caches in sessionStorage.
// Also decrypts the Shopify HMAC key (if encrypted with the same passphrase
// at lock time). The HMAC decrypt is best-effort — if it fails, sync still
// works and Shopify ops just throw the configured-but-locked error.
function unlockPAT(){
  var cfg = ls('syncConfig', null);
  if(!cfg || !cfg.encrypted) return Promise.resolve(null);
  if(sessionStorage.getItem('gecko_pat_cache')) return Promise.resolve(sessionStorage.getItem('gecko_pat_cache'));
  return dialogPrompt('Unlock workspace','',{
    inputType:'password',
    body:'Enter your passphrase to unlock the cloud sync token. It stays unlocked until you close the app.',
    placeholder:'Passphrase',
    confirmLabel:'Unlock'
  }).then(function(pw){
    if(!pw) return null;
    return decryptPAT(cfg.encrypted, pw).then(function(token){
      sessionStorage.setItem('gecko_pat_cache', token);
      // Also unlock the Shopify HMAC key if it was encrypted with the
      // same passphrase at lock time. Don't fail unlock if it's missing
      // or the blob is corrupt — sync still works without it.
      var sc = ls('shopifyConfig', null);
      if(sc && sc.encryptedHmacKey){
        decryptPAT(sc.encryptedHmacKey, pw).then(function(hmac){
          sessionStorage.setItem('gecko_hmac_cache', hmac);
        }).catch(function(err){
          console.warn('HMAC decrypt failed:', err && err.message);
        });
      }
      return token;
    }).catch(function(){
      return dialogAlert('Wrong passphrase','That didn\'t work. Try again — make sure caps lock is off.').then(function(){return null});
    });
  });
}

function lockWorkspace(){
  sessionStorage.removeItem('gecko_pat_cache');
  sessionStorage.removeItem('gecko_hmac_cache');
}

// Confirm-then-show flow for sharing the workspace credentials with a helper.
// The PAT is power-equivalent to your GitHub gist account — full read+delete
// of every gist you own. Don't share over email/text where it persists.
function _doShareReveal(gistId, pat){
  dialogConfirm(
    'Share workspace credentials?',
    'These credentials let your helper edit your shared workspace AND read or delete every other gist on your GitHub account.\n\n' +
    'Best practice: read them aloud in person, or use a self-destructing message app. Avoid email/SMS where they persist forever.',
    {confirmLabel:'I understand — show me',danger:true,warn:'Anyone with this token has the same access you do.'}
  ).then(function(ok){
    if(!ok) return;
    var info = 'Gist ID: '+gistId+'\nGitHub PAT: '+pat;
    return showDialog({
      type:'alert',
      title:'Share these — then revoke when no longer needed',
      body:info,
      confirmLabel:'Copy & close'
    }).then(function(){
      if(navigator.clipboard){navigator.clipboard.writeText(info).then(function(){showToast('Credentials copied — clear your clipboard when done')})}
    });
  });
}

function _doSetLock(){
  var cfg = ls('syncConfig',null);
  if(!cfg || !cfg.pat){
    dialogAlert('Nothing to lock','Set up cloud sync first.');
    return;
  }
  if(!window.crypto || !window.crypto.subtle){
    dialogAlert('Web Crypto unavailable','This browser doesn\'t support encryption. Try a more recent iOS Safari version.');
    return;
  }
  dialogPrompt('Choose a passphrase','',{
    inputType:'password',
    body:'You\'ll need this to unlock the app each time you open it. Pick something memorable but not guessable. There is no recovery — if you forget the passphrase, you\'ll have to remove the lock and reconnect with a new GitHub token.',
    placeholder:'New passphrase',
    confirmLabel:'Next'
  }).then(function(pw1){
    if(!pw1) return;
    if(pw1.length < 8){
      dialogAlert('Too short','Use at least 8 characters.');
      return;
    }
    return dialogPrompt('Confirm passphrase','',{
      inputType:'password',
      placeholder:'Type it again',
      confirmLabel:'Encrypt'
    }).then(function(pw2){
      if(pw2 !== pw1){
        dialogAlert('Doesn\'t match','The two entries didn\'t match. Try again.');
        return;
      }
      // Encrypt the PAT first, then the HMAC key (if present) with the same
      // passphrase. Both share session-storage caches keyed off the same
      // unlock event so the user only types the passphrase once.
      return encryptPAT(cfg.pat, pw1).then(function(blob){
        var newCfg = {gistId: cfg.gistId, encrypted: blob};
        lsSet('syncConfig', newCfg);
        sessionStorage.setItem('gecko_pat_cache', cfg.pat); // keep current session unlocked

        // Also encrypt the Shopify HMAC key if configured. Errors here are
        // shown but don't roll back the PAT lock — the user can re-run
        // "Lock workspace" later if they fix the HMAC config.
        var sc = ls('shopifyConfig', null);
        var hmacStep = (sc && sc.hmacKey)
          ? encryptPAT(sc.hmacKey, pw1).then(function(hmacBlob){
              var newSc = {};
              Object.keys(sc).forEach(function(k){ if(k !== 'hmacKey') newSc[k] = sc[k]; });
              newSc.encryptedHmacKey = hmacBlob;
              lsSet('shopifyConfig', newSc);
              sessionStorage.setItem('gecko_hmac_cache', sc.hmacKey);
            })
          : Promise.resolve();

        return hmacStep.then(function(){
          showToast('Workspace locked');
          window.dispatchEvent(new CustomEvent('gecko-sync-update'));
        }).catch(function(err){
          // Surface but don't undo the PAT lock — the user can rerun lock later.
          dialogAlert('HMAC encryption failed', (err && err.message) || 'The PAT is locked, but the Shopify HMAC key was not encrypted. Try Lock workspace again.');
        });
      }).catch(function(err){
        dialogAlert('Couldn\'t encrypt', err.message || 'Unknown error');
      });
    });
  });
}

function _doRemoveLock(){
  dialogConfirm('Remove encryption?','The token (and Shopify HMAC key, if locked) will go back to plaintext in localStorage. Anyone with access to this device will be able to read them.',{confirmLabel:'Remove lock',danger:true}).then(function(ok){
    if(!ok) return;
    var cached = sessionStorage.getItem('gecko_pat_cache');
    var cfg = ls('syncConfig',null);
    if(!cfg) return;
    if(!cached){
      dialogAlert('Unlock first','You need to unlock the workspace before removing the lock. Refresh the page and unlock, then try again.');
      return;
    }
    var newCfg = {gistId: cfg.gistId, pat: cached};
    lsSet('syncConfig', newCfg);

    // Mirror for the Shopify HMAC key — restore plaintext if it was encrypted.
    var sc = ls('shopifyConfig', null);
    var hmacCached = sessionStorage.getItem('gecko_hmac_cache');
    if(sc && sc.encryptedHmacKey && hmacCached){
      var newSc = {};
      Object.keys(sc).forEach(function(k){ if(k !== 'encryptedHmacKey') newSc[k] = sc[k]; });
      newSc.hmacKey = hmacCached;
      lsSet('shopifyConfig', newSc);
    } else if(sc && sc.encryptedHmacKey && !hmacCached){
      // Edge case: PAT was unlocked but HMAC decryption silently failed at
      // unlock time. Leave the encrypted blob in place so the user can fix it.
      console.warn('HMAC was encrypted but no plaintext cached — leaving encryptedHmacKey in place.');
    }

    showToast('Lock removed');
    window.dispatchEvent(new CustomEvent('gecko-sync-update'));
  });
}

// ============================================================
// PHOTOS — IndexedDB local-only photo storage for batch QC
// ============================================================
// Photos are stored in IndexedDB on each device (NOT synced via gist —
// would blow the 5MB localStorage cap). Each photo: {id, batchId, dataUrl, takenAt}.
// Stored as compressed JPEG ~800px wide, ~50-100KB each.
var PHOTO_DB_NAME = 'gecko_photos';
var PHOTO_STORE = 'photos';
var _photoDbPromise = null;

function openPhotoDb(){
  if(_photoDbPromise) return _photoDbPromise;
  _photoDbPromise = new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('IndexedDB not available')); return; }
    var req = indexedDB.open(PHOTO_DB_NAME, 1);
    req.onerror = function(){reject(req.error)};
    req.onsuccess = function(){resolve(req.result)};
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains(PHOTO_STORE)){
        var store = db.createObjectStore(PHOTO_STORE, {keyPath:'id'});
        store.createIndex('batchId','batchId',{unique:false});
      }
    };
  });
  return _photoDbPromise;
}

function photoSave(batchId, dataUrl){
  return openPhotoDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(PHOTO_STORE,'readwrite');
      var store = tx.objectStore(PHOTO_STORE);
      var entry = {id:uid(), batchId:batchId, dataUrl:dataUrl, takenAt:new Date().toISOString()};
      var req = store.add(entry);
      req.onsuccess = function(){resolve(entry)};
      req.onerror = function(){reject(req.error)};
    });
  });
}

function photoListForBatch(batchId){
  return openPhotoDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(PHOTO_STORE,'readonly');
      var store = tx.objectStore(PHOTO_STORE);
      var idx = store.index('batchId');
      var req = idx.getAll(batchId);
      req.onsuccess = function(){resolve(req.result || [])};
      req.onerror = function(){reject(req.error)};
    });
  }).catch(function(){return []});
}

function photoDelete(photoId){
  return openPhotoDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(PHOTO_STORE,'readwrite');
      var req = tx.objectStore(PHOTO_STORE).delete(photoId);
      req.onsuccess = function(){resolve()};
      req.onerror = function(){reject(req.error)};
    });
  });
}

// Compress an image File to ~800px wide JPEG. Returns Promise<dataUrl>.
function compressImage(file, maxWidth, quality){
  maxWidth = maxWidth || 800;
  quality = quality || 0.7;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        if(w > maxWidth){
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try {
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        } catch(e){ reject(e); }
      };
      img.onerror = function(){reject(new Error('Image load failed'))};
      img.src = ev.target.result;
    };
    reader.onerror = function(){reject(reader.error)};
    reader.readAsDataURL(file);
  });
}

// ============================================================
// STOCK MANAGEMENT — auto-deduct on batch log + low-stock alerts
// ============================================================
// Computes scaled grams: if batch.batchSizeGrams is set, use that.
// Otherwise multiply units × per-unit fill weight, falling back to recipe.batchSize.
function computeBatchScale(batch, recipe){
  if(!recipe || !recipe.phases) return 0;
  var recipeBatchG = recipe.batchSize || 100;
  // Prefer explicit total grams on the batch
  if(batch.batchSizeGrams && batch.batchSizeGrams > 0) return batch.batchSizeGrams / recipeBatchG;
  // Then units × container size
  if(batch.unitsProduced && batch.containerSize){
    return (batch.unitsProduced * batch.containerSize) / recipeBatchG;
  }
  // Then units alone (assume units roughly map to recipe master batch — conservative)
  if(batch.unitsProduced && batch.unitsProduced > 0){
    return batch.unitsProduced / Math.max(1, Math.round(recipeBatchG / 50));
  }
  return 1;
}

// Compute production suggestions: recipes that haven't been made in a while
// AND can fully be produced from current stock.
// Returns top 3 sorted by "most overdue × can-produce".
function getProductionSuggestions(){
  var recipes = (typeof getAllRecipes==='function') ? getAllRecipes() : [];
  if(recipes.length === 0) return [];
  var logs = ls('batchLogs', []);
  var stockData = ls('ingredientData', {});
  var now = Date.now();

  // Map recipeId -> {lastMade, count}
  var historyByRecipe = {};
  logs.forEach(function(b){
    if(!b.recipeId || !b.date) return;
    var t = new Date(b.date).getTime();
    if(!historyByRecipe[b.recipeId] || t > historyByRecipe[b.recipeId].lastMade){
      historyByRecipe[b.recipeId] = historyByRecipe[b.recipeId] || {count:0};
      historyByRecipe[b.recipeId].lastMade = t;
    }
    if(!historyByRecipe[b.recipeId]) historyByRecipe[b.recipeId] = {count:0, lastMade:t};
    historyByRecipe[b.recipeId].count = (historyByRecipe[b.recipeId].count||0) + 1;
  });

  var suggestions = [];
  recipes.forEach(function(r){
    var hist = historyByRecipe[r.id];
    var count = hist ? hist.count : 0;
    if(count === 0) return; // Never made — don't auto-suggest
    var daysSince = hist ? Math.floor((now - hist.lastMade)/86400000) : 999;
    if(daysSince < 14) return; // Made recently — skip

    // Check if we can make it at master batch size from current stock
    var canProduce = true;
    var firstShortage = null;
    if(r.phases){
      for(var i=0;i<r.phases.length;i++){
        var ings = r.phases[i].ingredients || [];
        for(var j=0;j<ings.length;j++){
          var ing = ings[j];
          if(!ing.name) continue;
          var key = ing.name.toLowerCase();
          var entry = stockData[key];
          if(!entry || entry.stock === undefined || entry.stock === null) continue; // unknown stock — give benefit of doubt
          var have = parseFloat(entry.stock) || 0;
          if(have < (ing.grams||0)){
            canProduce = false;
            firstShortage = ing.name;
            break;
          }
        }
        if(!canProduce) break;
      }
    }
    if(!canProduce) return;

    // Score: more days since × log of count (popularity)
    var score = daysSince * Math.log(1 + count);
    suggestions.push({
      recipe: r,
      daysSince: daysSince,
      count: count,
      score: score
    });
  });
  suggestions.sort(function(a,b){return b.score - a.score});
  return suggestions.slice(0, 3);
}

// Compute the ingredient cost of producing a recipe at a given scale (1 = master batch).
// Returns {totalCost, perUnitCost, missing, breakdown}. Missing = ingredient names with no
// pricePerGram set; their cost is treated as 0 but they're listed so the user knows the figure
// is incomplete.
function computeRecipeCost(recipe, scale, units){
  scale = scale || 1;
  units = units || 0;
  if(!recipe || !recipe.phases) return {totalCost:0, perUnitCost:0, missing:[], breakdown:[]};
  var data = ls('ingredientData',{});
  var totalCost = 0;
  var missing = [];
  var breakdown = [];
  recipe.phases.forEach(function(phase){
    (phase.ingredients||[]).forEach(function(ing){
      if(!ing.name) return;
      var key = ing.name.toLowerCase();
      var price = data[key] && parseFloat(data[key].pricePerGram);
      var grams = (ing.grams||0) * scale;
      if(grams <= 0) return;
      if(price && price > 0){
        var cost = grams * price;
        totalCost += cost;
        breakdown.push({name:ing.name, grams:grams, price:price, cost:cost});
      } else {
        missing.push(ing.name);
        breakdown.push({name:ing.name, grams:grams, price:0, cost:0, missingPrice:true});
      }
    });
  });
  return {
    totalCost: Math.round(totalCost*100)/100,
    perUnitCost: units > 0 ? Math.round((totalCost/units)*100)/100 : 0,
    missing: missing,
    breakdown: breakdown
  };
}

// Returns Map<lowercaseName, totalGrams> consumed by this batch
function computeIngredientUsage(batch, recipe){
  var scale = computeBatchScale(batch, recipe);
  if(scale <= 0) return {};
  var usage = {};
  recipe.phases.forEach(function(phase){
    (phase.ingredients||[]).forEach(function(ing){
      if(!ing.name) return;
      var key = ing.name.toLowerCase();
      var g = (ing.grams||0) * scale;
      if(g <= 0) return;
      usage[key] = (usage[key]||0) + g;
    });
  });
  return usage;
}

// Returns Promise<true> to proceed with logging, Promise<false> to cancel.
function deductStockForBatch(batch, recipe){
  if(!recipe){
    // Re-resolve recipe by id so this works from any caller
    recipe = (typeof getAllRecipes==='function')
      ? getAllRecipes().find(function(r){return r.id===batch.recipeId})
      : null;
  }
  if(!recipe) return Promise.resolve(true);
  var usage = computeIngredientUsage(batch, recipe);
  var keys = Object.keys(usage);
  if(keys.length === 0) return Promise.resolve(true);

  var stockData = ls('ingredientData',{});
  // Find shortages — only count ingredients that have a stock value set
  var shortages = [];
  keys.forEach(function(key){
    var entry = stockData[key];
    if(!entry || entry.stock === undefined || entry.stock === null) return;
    var available = parseFloat(entry.stock) || 0;
    var needed = usage[key];
    if(available < needed){
      shortages.push({name: _findOriginalName(key, recipe), available: available, needed: needed, short: needed - available});
    }
  });

  function applyDeduction(){
    var d = ls('ingredientData',{});
    var movements = ls('stockMovements',[]);
    keys.forEach(function(key){
      if(!d[key]) d[key] = {};
      var before = parseFloat(d[key].stock) || 0;
      var newVal = Math.max(0, before - usage[key]); // never store negative
      d[key].stock = Math.round(newVal * 100) / 100;
      movements.unshift({
        id: uid(),
        ingredient: key,
        delta: -Math.round(usage[key]*100)/100,
        before: Math.round(before*100)/100,
        after: d[key].stock,
        reason: 'batch '+(batch.batchNumber||''),
        batchId: batch.id,
        recipeId: recipe.id,
        date: today(),
        author: ls('activeProfile','User')
      });
    });
    if(movements.length > 500) movements = movements.slice(0, 500);
    lsSet('ingredientData', d);
    lsSet('stockMovements', movements);
  }

  if(shortages.length === 0){
    applyDeduction();
    return Promise.resolve(true);
  }

  // Build warning body
  var lines = shortages.map(function(s){
    return '• '+s.name+': need '+s.needed.toFixed(1)+'g, have '+s.available.toFixed(1)+'g (short '+s.short.toFixed(1)+'g)';
  }).join('\n');

  return dialogConfirm(
    'Insufficient stock',
    lines+'\n\nLog the batch anyway? Stock will be deducted to zero for these ingredients.',
    {confirmLabel:'Log Anyway',danger:true,warn:'You don\'t have enough stock to make this batch. Update stock counts in Ingredients before proceeding, or log anyway and reconcile later.'}
  ).then(function(go){
    if(go) applyDeduction();
    return go;
  });
}

function _findOriginalName(lowercaseKey, recipe){
  if(recipe && recipe.phases){
    for(var i=0;i<recipe.phases.length;i++){
      var ings = recipe.phases[i].ingredients || [];
      for(var j=0;j<ings.length;j++){
        if(ings[j].name && ings[j].name.toLowerCase() === lowercaseKey) return ings[j].name;
      }
    }
  }
  return lowercaseKey;
}

// Compute average daily usage for an ingredient over the last 60 days using
// the stockMovements log. Returns grams/day or null if no recent usage.
function _avgDailyUsage(key){
  var movements = ls('stockMovements', []);
  var cutoff = Date.now() - 60*86400000;
  var totalUsed = 0, daysSpanned = 0, earliest = Infinity, latest = 0;
  for(var i=0;i<movements.length;i++){
    var m = movements[i];
    if(m.ingredient !== key) continue;
    if(!m.date) continue;
    var t = new Date(m.date).getTime();
    if(t < cutoff) continue;
    var delta = m.delta || 0;
    if(delta < 0){ totalUsed += -delta; }
    if(t < earliest) earliest = t;
    if(t > latest) latest = t;
  }
  if(totalUsed <= 0 || latest === 0) return null;
  daysSpanned = Math.max(1, (latest - earliest) / 86400000);
  return totalUsed / daysSpanned;
}

// Smart low-stock: if we have enough movement history, use lead-time × daily usage.
// Otherwise fall back to a flat threshold. Returns array of {name, stock, daysLeft, leadDays, urgent}.
function getLowStockItems(){
  var fallbackThreshold = ls('lowStockThreshold', 10);
  var data = ls('ingredientData',{});
  var low = [];
  Object.keys(data).forEach(function(key){
    var entry = data[key];
    if(!entry || entry.stock === undefined || entry.stock === null) return;
    var s = parseFloat(entry.stock);
    if(isNaN(s)) return;
    var leadDays = parseInt(entry.leadDays) || 14; // default 2 week reorder time
    var avg = _avgDailyUsage(key);
    var dbItem = INGREDIENTS_DB.find(function(i){return i.name.toLowerCase()===key});
    var name = dbItem ? dbItem.name : key;
    if(avg && avg > 0){
      var daysLeft = s / avg;
      // Urgent if remaining stock won't outlast the reorder lead time
      if(daysLeft <= leadDays){
        low.push({name:name, stock:s, daysLeft:Math.floor(daysLeft), leadDays:leadDays, dailyUse:avg, urgent:daysLeft<leadDays/2});
      }
    } else if(s <= fallbackThreshold){
      // No usage data → simple threshold
      low.push({name:name, stock:s, daysLeft:null, leadDays:leadDays, dailyUse:null, urgent:s<=fallbackThreshold/2});
    }
  });
  // Sort: urgent first, then by daysLeft asc, then by stock asc
  low.sort(function(a,b){
    if(a.urgent !== b.urgent) return a.urgent ? -1 : 1;
    var ad = a.daysLeft==null ? 999 : a.daysLeft;
    var bd = b.daysLeft==null ? 999 : b.daysLeft;
    if(ad !== bd) return ad - bd;
    return a.stock - b.stock;
  });
  return low;
}

// ============================================================
// TRASH BIN — soft-delete with 30-day recovery
// ============================================================
// Schema: gecko_trash = [{id, type, payload, deletedAt, deletedBy}]
//   type: 'recipe' | 'section' | 'ingredient' | 'batch'
//   payload: type-specific data (see deleteRecipe / deleteSection / etc.)
var TRASH_TTL_DAYS = 30;

function trashList(){
  return ls('trash', []);
}

function trashAdd(type, payload){
  var list = trashList();
  list.unshift({
    id: uid(),
    type: type,
    payload: payload,
    deletedAt: new Date().toISOString(),
    deletedBy: ls('activeProfile','User')
  });
  // Cap at 200 items so localStorage doesn't fill up
  if(list.length > 200) list = list.slice(0, 200);
  lsSet('trash', list);
  if(typeof logActivity==='function') logActivity('moved to trash', type+' — '+_trashLabel(type, payload));
}

function _trashLabel(type, payload){
  if(!payload) return '(unknown)';
  if(type==='recipe') return (payload.recipe && payload.recipe.name) || 'recipe';
  if(type==='section') return (payload.section && payload.section.title) || 'section';
  if(type==='ingredient') return payload.name || 'ingredient';
  if(type==='batch') return payload.batchNumber || 'batch';
  return type;
}

function trashPurgeExpired(){
  var list = trashList();
  var cutoff = Date.now() - TRASH_TTL_DAYS*86400000;
  var kept = list.filter(function(item){
    return new Date(item.deletedAt).getTime() >= cutoff;
  });
  if(kept.length !== list.length) lsSet('trash', kept);
  return list.length - kept.length;
}

function trashRestore(itemId){
  var list = trashList();
  var idx = -1;
  for(var i=0;i<list.length;i++){if(list[i].id===itemId){idx=i;break}}
  if(idx===-1) return false;
  var item = list[idx];
  var p = item.payload || {};
  try {
    if(item.type==='recipe'){
      // Restore recipe + versions + notes
      if(p.isUserRecipe){
        var ur = ls('userRecipes',[]);
        ur.push(p.recipe);
        lsSet('userRecipes', ur);
      } else {
        var del = ls('deletedRecipes',[]);
        del = del.filter(function(id){return id !== p.recipe.id});
        lsSet('deletedRecipes', del);
      }
      if(p.versions && p.versions.length) lsSet('recipeVersions_'+p.recipe.id, p.versions);
      if(p.edits) lsSet('recipeEdits_'+p.recipe.id, p.edits);
      if(p.notes && p.notes.length) lsSet('notes_'+p.recipe.id, p.notes);
    } else if(item.type==='section'){
      // Re-attach to recipe — find current sections and splice back at original index
      var key='recipeEdits_'+p.recipeId;
      var ed=ls(key,null);
      if(!ed){ if(typeof showToast==='function') showToast('Cannot restore — recipe missing'); return false; }
      var newSecs = (ed.sections||[]).slice();
      var insertAt = Math.min(p.index||0, newSecs.length);
      newSecs.splice(insertAt, 0, p.section);
      ed.sections = newSecs;
      ed.savedAt = new Date().toISOString();
      lsSet(key, ed);
    } else if(item.type==='ingredient'){
      // Restore the DB entry (skip if name is already taken)
      if(p.dbItem && !INGREDIENTS_DB.find(function(i){return i.name===p.dbItem.name})){
        INGREDIENTS_DB.push(p.dbItem);
      }
      // Restore user-entered stock/price/supplier if present
      if(p.userData && p.name){
        var d = ls('ingredientData',{});
        d[p.name.toLowerCase()] = p.userData;
        lsSet('ingredientData', d);
      }
      // Persist by re-clearing the rename/remove edit so next reload sees it
      var removals = ls('ingredientRemovals',[]);
      removals = removals.filter(function(n){return n !== p.name});
      lsSet('ingredientRemovals', removals);
    } else if(item.type==='batch'){
      var logs = ls('batchLogs',[]);
      logs.push(p);
      lsSet('batchLogs', logs);
    }
    list.splice(idx, 1);
    lsSet('trash', list);
    if(typeof logActivity==='function') logActivity('restored from trash', item.type+' — '+_trashLabel(item.type,p));
    return true;
  } catch(err){
    console.error('trashRestore failed', err);
    return false;
  }
}

function trashRemove(itemId){
  var list = trashList().filter(function(it){return it.id !== itemId});
  lsSet('trash', list);
}

function trashEmpty(){
  lsSet('trash', []);
}

// Run purge on script load
try { trashPurgeExpired(); } catch(e) {}

// BatchPhotos — thumbnails + camera input + lightbox.
// Stored in IndexedDB locally, never synced (would blow the gist size cap).
function BatchPhotos(props){
  // Hybrid storage:
  //  - IndexedDB: instant local cache, works offline. Items have `dataUrl`.
  //  - R2 (via worker): cross-device source-of-truth + visible on the
  //    public batch page. Items have `remoteId`; render via /p/<id>.
  // Each entry is tagged `source: 'local' | 'r2'` so handlers know which
  // storage to delete from.
  var ps = useState([]);
  var photos = ps[0], setPhotos = ps[1];
  // Tracks whether we've finished the first load attempt (local + remote).
  // Without this, an empty photos[] looks the same as "still loading" — and
  // we want a skeleton in the latter case.
  var fl = useState(false);
  var firstLoaded = fl[0], setFirstLoaded = fl[1];
  var us = useState(false);
  var uploading = us[0], setUploading = us[1];
  var lb = useState(null);
  var lightbox = lb[0], setLightbox = lb[1];
  var fileRef = useRef(null);
  var canSync = shopifyConfigured();

  useEffect(function(){
    var cancelled = false;
    var combined = [];
    // 1) Local cache first — instant
    photoListForBatch(props.batchId).then(function(localList){
      if(cancelled) return;
      var local = (localList||[]).map(function(p){
        return {id:p.id, source:'local', dataUrl:p.dataUrl, takenAt:p.takenAt};
      });
      combined = combined.concat(local);
      setPhotos(combined.slice().sort(function(a,b){return (a.takenAt||0) - (b.takenAt||0)}));
      // If we don't need to wait on R2, mark the first load done now so
      // the empty state can render instead of permanent skeletons.
      if(!canSync) setFirstLoaded(true);
    }).catch(function(){ if(!canSync) setFirstLoaded(true) });
    // 2) Remote — adds R2 photos when configured
    if(canSync){
      workerListPhotos(props.batchId).then(function(res){
        if(cancelled) return;
        if(res && res.photos){
          var remote = res.photos.map(function(p){
            return {
              id:p.id,
              source:'r2',
              remoteId:p.id,
              src: workerPhotoSrc(p.id),
              takenAt: p.takenAt || p.uploadedAt
            };
          });
          // Merge with whatever's already in state. Dedupe by id (local + r2
          // ids never collide — different generators).
          setPhotos(function(prev){
            var byId = {};
            prev.forEach(function(p){byId[p.id]=p});
            remote.forEach(function(p){byId[p.id]=p});
            return Object.keys(byId).map(function(k){return byId[k]})
              .sort(function(a,b){return (a.takenAt||0) - (b.takenAt||0)});
          });
        }
        setFirstLoaded(true);
      }).catch(function(err){
        // R2 down or D1 hiccup — fall back silently to local list.
        console.warn('photo list failed', err);
        if(!cancelled) setFirstLoaded(true);
      });
    }
    return function(){cancelled = true};
  },[props.batchId, canSync]);

  function onFile(ev){
    var file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if(!file) return;
    setUploading(true);
    var compressed;
    compressImage(file, 800, 0.7).then(function(dataUrl){
      compressed = dataUrl;
      // Always cache locally — instant render + offline access
      return photoSave(props.batchId, dataUrl);
    }).then(function(localEntry){
      // Optimistic UI: add the local cached version immediately
      var localPhoto = {id:localEntry.id, source:'local', dataUrl:localEntry.dataUrl, takenAt:localEntry.takenAt};
      setPhotos(function(prev){return prev.concat([localPhoto])});

      if(!canSync){
        // No worker — local-only, done
        setUploading(false);
        showToast('Photo saved on this device');
        return;
      }
      // Push to R2 in the background
      return workerUploadPhoto(compressed, props.batchId, props.batchCode).then(function(remote){
        if(!remote) return;
        // Replace the optimistic local entry with the synced R2 version so
        // the photo shows up cross-device + on the public batch page.
        // Drop the IndexedDB copy — R2 is now the source-of-truth, and we
        // don't want to keep duplicates eating localStorage.
        photoDelete(localEntry.id).catch(function(){});
        setPhotos(function(prev){
          var withoutLocal = prev.filter(function(p){return p.id !== localEntry.id});
          var remotePhoto = {id:remote.id, source:'r2', remoteId:remote.id, src:workerPhotoSrc(remote.id), takenAt: remote.takenAt || remote.uploadedAt};
          return withoutLocal.concat([remotePhoto])
            .sort(function(a,b){return (a.takenAt||0) - (b.takenAt||0)});
        });
        setUploading(false);
        showToast('Photo synced');
      }).catch(function(err){
        // Local cache stays; R2 failed. Tell mum but don't lose her photo.
        console.warn('R2 upload failed', err);
        setUploading(false);
        showToast('Saved locally — sync will retry next time');
      });
    }).catch(function(err){
      setUploading(false);
      dialogAlert('Photo failed', err.message || 'Could not save photo. iOS sometimes blocks the camera if storage is full.');
    });
  }

  function removePhoto(p){
    dialogConfirm('Delete photo?',null,{confirmLabel:'Delete',danger:true}).then(function(ok){
      if(!ok) return;
      var op = p.source === 'r2'
        ? workerDeletePhoto(p.remoteId || p.id)
        : photoDelete(p.id);
      Promise.resolve(op).then(function(){
        setPhotos(function(prev){return prev.filter(function(x){return x.id !== p.id})});
        setLightbox(null);
        showToast('Photo deleted');
      }).catch(function(err){
        console.warn('photo delete failed', err);
        dialogAlert('Delete failed','Could not remove the photo. Try again in a moment.');
      });
    });
  }

  function photoSrc(p){
    return p.source === 'r2' ? p.src : p.dataUrl;
  }

  return e('div',null,
    e('div',{className:'photo-row'+(uploading?' photo-uploading':'')},
      // Skeleton thumbs only on first load when nothing's come back yet — keeps
      // the row from collapsing to height-zero while remote photos stream in.
      (!firstLoaded && photos.length === 0) ? [0,1,2].map(function(i){
        return e(Skel,{key:'sk-'+i,kind:'thumb'});
      }) : null,
      photos.map(function(p){
        return e('img',{key:p.id,className:'photo-thumb',src:photoSrc(p),alt:'Batch photo',onClick:function(){setLightbox(p)},loading:'lazy'});
      }),
      e('label',{className:'photo-add-btn',title:'Add photo'},
        Icon('plus',24),
        e('input',{
          ref:fileRef, type:'file', accept:'image/*', capture:'environment',
          style:{display:'none'}, onChange:onFile
        })
      ),
      uploading ? e('span',{style:{fontSize:'11px',color:'var(--text-muted)'}},'Saving…') : null
    ),
    photos.length===0 && !uploading ? e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginTop:'4px'}},
      canSync
        ? 'Photos sync across devices and show on the public batch page.'
        : 'Photos are saved locally on this device only.'
    ) : null,
    lightbox ? e('div',{className:'photo-lightbox',onClick:function(){setLightbox(null)}},
      e('img',{src:photoSrc(lightbox),alt:'Photo',onClick:function(ev){ev.stopPropagation()}}),
      e('div',{className:'photo-lightbox-actions',onClick:function(ev){ev.stopPropagation()}},
        e('button',{className:'tool-btn',style:{color:'var(--red)'},onClick:function(){removePhoto(lightbox)}},'Delete'),
        e('button',{className:'tool-btn primary',onClick:function(){setLightbox(null)}},'Close')
      )
    ) : null
  );
}

// useSyncTick — re-render this component when remote sync data is merged in.
// Pages that snapshot localStorage into useState must call this so they refresh
// when Kendal/another device pushes changes.
function useSyncTick(){
  var st = useState(0);
  var setTick = st[1];
  useEffect(function(){
    function onUpdate(){setTick(function(t){return t+1})}
    window.addEventListener('gecko-sync-update', onUpdate);
    return function(){window.removeEventListener('gecko-sync-update', onUpdate)};
  },[]);
  return st[0];
}

// Beep sound using Web Audio API
function playBeep(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.value = 0.3;
    osc.start();
    setTimeout(function(){osc.stop();ctx.close()},300);
    // Do it 3 times
    setTimeout(function(){
      var ctx2 = new (window.AudioContext||window.webkitAudioContext)();
      var osc2 = ctx2.createOscillator();
      var gain2 = ctx2.createGain();
      osc2.connect(gain2);gain2.connect(ctx2.destination);
      osc2.frequency.value = 1100;osc2.type = 'sine';gain2.gain.value = 0.3;
      osc2.start();setTimeout(function(){osc2.stop();ctx2.close()},300);
    },400);
    setTimeout(function(){
      var ctx3 = new (window.AudioContext||window.webkitAudioContext)();
      var osc3 = ctx3.createOscillator();
      var gain3 = ctx3.createGain();
      osc3.connect(gain3);gain3.connect(ctx3.destination);
      osc3.frequency.value = 1320;osc3.type = 'sine';gain3.gain.value = 0.3;
      osc3.start();setTimeout(function(){osc3.stop();ctx3.close()},500);
    },800);
  }catch(e){}
}

// Generate batch number
function genBatchNum(recipeName){
  var code = recipeName.replace(/[^A-Z]/g,'').substring(0,5) || 'BATCH';
  if(code.length < 3) code = recipeName.replace(/\s+/g,'').substring(0,5).toUpperCase();
  var d = new Date();
  var ds = String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  var logs = ls('batchLogs',[]);
  var todayLogs = logs.filter(function(l){return l.batchNumber && l.batchNumber.includes(ds)});
  var seq = String(todayLogs.length + 1).padStart(2,'0');
  return code + '-' + ds + '-' + seq;
}

// QR code as a base64 PNG data URL — for inlining in printed labels.
// Some browsers don't render inline SVG reliably in print/PDF; PNG always
// works. cellSize controls resolution (px per QR module).
function geckoQrPngDataUrl(text, cellSize){
  if(typeof qrcode !== 'function' || !text) return '';
  try{
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var moduleCount = qr.getModuleCount();
    var cs = cellSize || 8;
    var margin = cs * 4;
    var size = moduleCount * cs + margin * 2;
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#000';
    for(var r=0;r<moduleCount;r++){
      for(var c=0;c<moduleCount;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect(margin + c*cs, margin + r*cs, cs, cs);
        }
      }
    }
    return canvas.toDataURL('image/png');
  } catch(e){
    console.warn('geckoQrPngDataUrl failed', e);
    return '';
  }
}

// Download a QR for `text` as a PNG file (high-resolution, white-on-black,
// 4-cell quiet zone). Used by the Print Labels page so Heath can grab a
// single QR image without going through a full label print sheet.
// Returns true if download started, false on failure.
function downloadQrPng(text, filename){
  if(typeof qrcode !== 'function' || !text) return false;
  try{
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var moduleCount = qr.getModuleCount();
    var cellSize = 16;            // 16px per module → ~ (moduleCount*16)px image
    var margin = cellSize * 4;    // standard 4-cell quiet zone
    var size = moduleCount * cellSize + margin * 2;
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#000';
    for(var r=0;r<moduleCount;r++){
      for(var c=0;c<moduleCount;c++){
        if(qr.isDark(r,c)){
          ctx.fillRect(margin + c*cellSize, margin + r*cellSize, cellSize, cellSize);
        }
      }
    }
    canvas.toBlob(function(blob){
      if(!blob){ if(typeof showToast==='function') showToast('Failed to generate QR image'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = (filename || 'qr-code') + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url)}, 1000);
    });
    return true;
  } catch(e){
    console.warn('downloadQrPng failed', e);
    return false;
  }
}

// Parse shelf life to months
function parseShelfMonths(s){
  if(!s) return 12;
  var m = s.match(/(\d+)/);
  return m ? parseInt(m[1]) : 12;
}

// Markdown to HTML converter — full support for tables, blockquotes, headings, lists, inline formatting, horizontal rules
// Escape HTML so user-pasted markdown can't inject <script>, <img onerror>, etc.
// Applied to every text node before it's interpolated into HTML in mdToHtml/inlineFmt.
// Cap a recipe-versions list at MAX_VERSIONS (oldest pruned). Keeps localStorage
// from filling up over months of edits. Returns the (possibly truncated) array.
var MAX_VERSIONS_PER_RECIPE = 30;
function pruneVersions(versions){
  if(!versions || versions.length <= MAX_VERSIONS_PER_RECIPE) return versions || [];
  return versions.slice(versions.length - MAX_VERSIONS_PER_RECIPE);
}

// Render a plain-text note with @recipe-name autolinks. Recipe names are matched
// against the current recipes list (case-insensitive, longest first to avoid
// partial-match collisions). Returns React children (string + spans).
function renderNoteWithLinks(text, onRecipeClick){
  if(!text) return text;
  var recipes = (typeof getAllRecipes==='function') ? getAllRecipes() : [];
  if(recipes.length === 0) return text;
  // Sort by name length desc so "Tallow Beard Oil" matches before "Tallow"
  var byLength = recipes.slice().sort(function(a,b){return (b.name||'').length - (a.name||'').length});
  var pattern = /@([A-Za-z0-9 _'\-]+)/g;
  var children = [];
  var lastIdx = 0, m;
  while((m = pattern.exec(text)) !== null){
    if(m.index > lastIdx) children.push(text.substring(lastIdx, m.index));
    var raw = m[1];
    // Find longest matching recipe name that is a prefix of `raw` (case-insensitive)
    var match = null;
    for(var i=0;i<byLength.length;i++){
      var name = (byLength[i].name||'').trim();
      if(!name) continue;
      if(raw.toLowerCase().indexOf(name.toLowerCase()) === 0){
        match = byLength[i];
        // Only consume the matched portion; rest goes back as plain text
        var consumed = '@' + name;
        children.push(e('span',{
          key:m.index,
          style:{color:'var(--gold)',fontWeight:600,cursor:'pointer'},
          onClick: onRecipeClick ? function(r){return function(ev){ev.stopPropagation();onRecipeClick(r)}}(match) : null
        }, consumed));
        // Push the leftover text after the recipe name
        var leftover = raw.substring(name.length);
        if(leftover) children.push(leftover);
        lastIdx = m.index + 1 + raw.length;
        break;
      }
    }
    if(!match){
      // No recipe matched — leave the @whatever as plain text
      children.push(m[0]);
      lastIdx = m.index + m[0].length;
    }
  }
  if(lastIdx < text.length) children.push(text.substring(lastIdx));
  return children;
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// Block dangerous URL schemes in [text](url) links.
function safeUrl(u){
  if(!u) return '#';
  var s = String(u).trim();
  // Allow only http(s), mailto, tel, anchors, and relative paths
  if(/^(https?:|mailto:|tel:|#|\/|\.\/|\.\.\/)/i.test(s)) return s.replace(/"/g,'%22');
  return '#';
}

function mdToHtml(md){
  var lines = md.split('\n');
  var out = [];
  var i = 0;
  while(i < lines.length){
    var line = lines[i];
    var trimmed = line.trim();

    // Horizontal rule
    if(trimmed.match(/^[-*_]{3,}$/)){
      out.push('<hr>');
      i++; continue;
    }

    // Headings
    if(trimmed.match(/^#{1,6}\s/)){
      var lvl = trimmed.match(/^(#{1,6})\s/)[1].length;
      var htag = lvl <= 2 ? 'h3' : (lvl === 3 ? 'h4' : 'h5');
      var htext = trimmed.replace(/^#{1,6}\s+/,'');
      out.push('<'+htag+'>'+inlineFmt(htext)+'</'+htag+'>');
      i++; continue;
    }

    // Table: collect all consecutive lines starting with |
    if(trimmed.startsWith('|')){
      var tableLines = [];
      while(i < lines.length && lines[i].trim().startsWith('|')){
        tableLines.push(lines[i].trim());
        i++;
      }
      out.push(parseTableToHtml(tableLines));
      continue;
    }

    // Blockquote: collect consecutive > lines
    if(trimmed.startsWith('>')){
      var bqLines = [];
      while(i < lines.length && lines[i].trim().startsWith('>')){
        bqLines.push(lines[i].trim().replace(/^>\s?/,''));
        i++;
      }
      out.push('<blockquote style="border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;background:rgba(198,165,110,0.08);font-size:12px;color:var(--text-light);border-radius:4px">'+inlineFmt(bqLines.join(' '))+'</blockquote>');
      continue;
    }

    // Unordered list
    if(trimmed.match(/^[-•*]\s+/)){
      var listItems = [];
      while(i < lines.length && lines[i].trim().match(/^[-•*]\s+/)){
        listItems.push(lines[i].trim().replace(/^[-•*]\s+/,''));
        i++;
      }
      out.push('<ul style="margin:6px 0;padding-left:20px">'+listItems.map(function(li){return '<li style="margin:2px 0;font-size:13px">'+inlineFmt(li)+'</li>'}).join('')+'</ul>');
      continue;
    }

    // Ordered list
    if(trimmed.match(/^\d+\.\s+/)){
      var olItems = [];
      while(i < lines.length && lines[i].trim().match(/^\d+\.\s+/)){
        olItems.push(lines[i].trim().replace(/^\d+\.\s+/,''));
        i++;
      }
      out.push('<ol style="margin:6px 0;padding-left:20px">'+olItems.map(function(li){return '<li style="margin:2px 0;font-size:13px">'+inlineFmt(li)+'</li>'}).join('')+'</ol>');
      continue;
    }

    // Empty line = paragraph break
    if(trimmed === ''){
      i++; continue;
    }

    // Regular paragraph
    out.push('<p style="margin:6px 0;font-size:13px">'+inlineFmt(trimmed)+'</p>');
    i++;
  }
  return out.join('\n');
}

// Inline formatting: bold, italic, code, links.
// We escape FIRST so the input can never inject HTML, then we re-introduce
// only the markdown structures we recognise. Markdown delimiters (* _ ` [ ])
// don't survive escapeHtml unchanged so we operate on the escaped string.
function inlineFmt(text){
  var s = escapeHtml(text);
  // Pull out [link text](url) — escape the URL via safeUrl()
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_,label,url){
    return '<a href="'+safeUrl(url)+'" rel="noopener noreferrer" style="color:var(--gold)">'+label+'</a>';
  });
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s = s.replace(/`(.+?)`/g,'<code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;font-size:12px">$1</code>');
  return s;
}

// Auto-convert section HTML that still has raw markdown (e.g. imported recipes with pipe tables)
function ensureHtml(html){
  if(!html) return '';
  // If it has markdown table pattern (line starting with |) but no <table tag, convert it
  if(html.match(/^\|/m) && html.indexOf('<table') === -1){
    return mdToHtml(html);
  }
  // Also catch blockquotes that weren't converted (line starting with >)
  if(html.match(/^>/m) && html.indexOf('<blockquote') === -1){
    return mdToHtml(html);
  }
  return html;
}

// Convert markdown table lines to an HTML table
function parseTableToHtml(tableLines){
  if(tableLines.length < 2) return tableLines.join('<br>');
  // Parse cells from a line
  function getCells(line){
    return line.split('|').map(function(c){return c.trim()}).filter(function(c){return c !== ''});
  }
  // Detect separator line (the --- row)
  var sepIdx = -1;
  for(var s=0;s<tableLines.length;s++){
    if(tableLines[s].match(/^\|[\s-:|]+\|$/)){sepIdx=s;break}
  }
  var headerCells = getCells(tableLines[0]);
  var dataStart = sepIdx >= 0 ? sepIdx + 1 : 1;

  var html = '<table style="width:100%;border-collapse:collapse;font-size:12px;margin:8px 0">';
  // Header
  html += '<thead><tr>';
  headerCells.forEach(function(h){
    html += '<th style="text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);font-weight:600;color:var(--text);background:var(--bg-elevated)">'+inlineFmt(h)+'</th>';
  });
  html += '</tr></thead>';
  // Body
  html += '<tbody>';
  for(var r=dataStart;r<tableLines.length;r++){
    if(tableLines[r].match(/^\|[\s-:|]+\|$/)) continue; // skip extra separator lines
    var cells = getCells(tableLines[r]);
    html += '<tr>';
    cells.forEach(function(c,ci){
      var style = 'padding:5px 8px;border-bottom:1px solid var(--border-light);color:var(--text-light)';
      html += '<td style="'+style+'">'+inlineFmt(c)+'</td>';
    });
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

// Markdown parser (for recipe import)
function parseMarkdownRecipe(md){
  var recipe = {id:uid(),name:'',phases:[],scentProfiles:[],sections:[],batchSize:100,format:'',shelfLife:'12 months',ifraCategory:'',category:'',productLine:'',targetRRP:'',totalIngredients:0,qcItems:[]};

  // Extract name from first H1
  var nameMatch = md.match(/^#\s+(.+)/m);
  if(nameMatch) recipe.name = nameMatch[1].trim().replace(/\s*[—–-]\s*V[\d.]+$/,'');

  // Extract metadata from subtitle line (line after H1)
  var metaLine = md.match(/^#\s+.+\n+(.+)/m);
  if(metaLine){
    var ml = metaLine[1];
    var bsMatch = ml.match(/(\d+)\s*g\s*(?:master\s*)?batch/i);
    if(bsMatch) recipe.batchSize = parseInt(bsMatch[1]);
    if(/poured|tin|jar/i.test(ml)) recipe.format = 'Poured (tin/jar)';
    else if(/tube/i.test(ml)) recipe.format = 'Tube';
    else if(/(?<!un)whipped/i.test(ml)) recipe.format = 'Whipped (jar)';
    else if(/pump|bottle/i.test(ml)) recipe.format = 'Pump bottle';
    else if(/stick|twist/i.test(ml)) recipe.format = 'Stick/twist-up';
    else if(/bar/i.test(ml)) recipe.format = 'Solid bar';
    var shelfMatch = ml.match(/(\d+)\s*months?\s*shelf/i) || md.match(/shelf\s*life[:\s]*(\d+)\s*months/i);
    if(shelfMatch) recipe.shelfLife = shelfMatch[1]+' months';
    if(/cat\s*5a/i.test(ml)) recipe.ifraCategory = 'Cat 5A — Body lotion, body cream';
    else if(/cat\s*4/i.test(ml)) recipe.ifraCategory = 'Cat 4 — Fine fragrance';
  }

  // Helper: parse a table into rows of cells, auto-detect column layout
  function parseTable(tableText){
    var lines = tableText.split('\n').filter(function(r){
      var t = r.trim();
      return t.startsWith('|') && !t.match(/^\|[\s-:|]+\|$/);
    });
    if(lines.length === 0) return [];
    // Detect header row to find column mapping
    var headerLine = lines[0];
    var headerCells = headerLine.split('|').map(function(c){return c.trim()}).filter(Boolean);
    // Find which column index is the name, grams, percent
    var nameCol = -1, gramsCol = -1, pctCol = -1, numCol = -1;
    headerCells.forEach(function(h,i){
      var hl = h.toLowerCase();
      if(hl === '#' || hl === 'no' || hl === 'no.') numCol = i;
      else if(hl.includes('ingredient') || hl.includes('name') || hl.includes('component') || hl.includes('item')) nameCol = i;
      else if(hl.includes('gram') || hl === 'g' || hl.includes('weight')) gramsCol = i;
      else if(hl === '%' || hl.includes('% w/w') || hl.includes('percent')) pctCol = i;
    });
    // Fallback: if no header detected, guess from column count
    if(nameCol === -1){
      if(headerCells.length >= 5){ nameCol=1;gramsCol=2;pctCol=3; }
      else if(headerCells.length >= 3){ nameCol=0;gramsCol=1;pctCol=2; }
    }
    if(gramsCol === -1) gramsCol = nameCol + 1;
    if(pctCol === -1) pctCol = gramsCol + 1;
    // Parse data rows (skip header)
    var dataRows = lines.slice(1);
    var results = [];
    dataRows.forEach(function(row){
      var cells = row.split('|').map(function(c){return c.trim()}).filter(Boolean);
      if(cells.length < 2) return;
      var rawName = cells[nameCol] || '';
      var rawGrams = cells[gramsCol] || '';
      var rawPct = cells[pctCol] || '';
      // Strip units: "72.0g" -> "72.0", "72.0%" -> "72.0"
      var g = parseFloat(rawGrams.replace(/[g%\s]/gi,''));
      var p = parseFloat(rawPct.replace(/[g%\s]/gi,''));
      // Clean ingredient name — strip parenthetical specs like "(specify carrier on batch card)"
      var cleanName = rawName.replace(/\s*\(specify[^)]*\)/gi,'').trim();
      if(cleanName && !isNaN(g)){
        results.push({name:cleanName, grams:g, percent:isNaN(p)?g:p});
      }
    });
    return results;
  }

  // Extract phases — flexible regex handles pipes, colons, dashes in headers
  // Matches: "## PHASE A — Name | Temp | Weight", "## Phase 1: Name", "## PHASE B — Name" etc.
  var phaseRegex = /^##\s+PHASE\s+([A-Z]|\d+)\s*[—–:\-|]?\s*([^\n]*)/gim;
  var pm;
  var phasePositions = [];
  while((pm = phaseRegex.exec(md)) !== null){
    var rawLetter = pm[1];
    var pLetter = rawLetter.length === 1 && rawLetter.match(/[A-Z]/i) ? rawLetter.toUpperCase() : String.fromCharCode(64+parseInt(rawLetter));
    var pHeaderRest = pm[2] || '';
    // Extract phase name (first segment before | or end)
    var pNameParts = pHeaderRest.split('|');
    var pName = pNameParts[0].replace(/^[—–:\-\s]+/,'').trim();
    // Extract temperature hint from header
    var tempHint = '';
    var tempMatch = pHeaderRest.match(/(\d+)\s*[–-]\s*(\d+)\s*°C/);
    if(tempMatch) tempHint = tempMatch[1]+'–'+tempMatch[2]+'°C';
    phasePositions.push({letter:pLetter, name:pName, temp:tempHint, start:pm.index});
  }

  // For each phase, find the table between this phase header and the next section
  phasePositions.forEach(function(pp, i){
    var endPos = i < phasePositions.length-1 ? phasePositions[i+1].start : md.length;
    // Also stop at next ## that isn't a phase
    var nextSection = md.substring(pp.start+1).match(/\n##\s+(?!PHASE)/i);
    if(nextSection) endPos = Math.min(endPos, pp.start+1+nextSection.index);
    var block = md.substring(pp.start, endPos);
    // Skip the header line before looking for table pipes
    var firstNewline = block.indexOf('\n');
    var blockAfterHeader = firstNewline > -1 ? block.substring(firstNewline+1) : block;
    var tableStart = blockAfterHeader.indexOf('|');
    if(tableStart === -1){ recipe.phases.push({id:uid(),name:pp.name,letter:pp.letter,temperature:pp.temp,ingredients:[],totalGrams:0,totalPercent:0}); return; }
    var tableText = blockAfterHeader.substring(tableStart);
    var parsed = parseTable(tableText);
    var ingredients = [];
    var num = 1;
    parsed.forEach(function(row){
      ingredients.push({id:uid(),number:num++,name:row.name,grams:row.grams,percent:row.percent,function:''});
    });
    var totalG = ingredients.reduce(function(s,ing){return s+ing.grams},0);
    var totalP = ingredients.reduce(function(s,ing){return s+ing.percent},0);
    recipe.phases.push({id:uid(),name:pp.name,letter:pp.letter,temperature:pp.temp,ingredients:ingredients,totalGrams:totalG,totalPercent:totalP});
  });

  recipe.totalIngredients = recipe.phases.reduce(function(s,p){return s+p.ingredients.length},0);

  // Extract scent profiles
  var scentMatch = md.match(/##\s+SCENT PROFILES?([\s\S]*?)(?=\n##\s+(?!###)|$)/i);
  if(scentMatch){
    var scentBlock = scentMatch[1];
    var optRegex = /###\s+(?:Option\s+\d+\s*[—–:\-]?\s*)?(.+?)(?:\n)([\s\S]*?)(?=\n###\s|\n##\s|$)/gi;
    var om;
    while((om = optRegex.exec(scentBlock)) !== null){
      var sName = om[1].trim();
      var sBody = om[2];
      var oils = [];
      // Try bullet format: "- Lavender EO: 0.8g"
      var oilRows = sBody.match(/[-•*]\s*(.+?):\s*([\d.]+)\s*g/g) || [];
      oilRows.forEach(function(or){
        var parts = or.match(/[-•*]\s*(.+?):\s*([\d.]+)/);
        if(parts) oils.push({name:parts[1].trim(),grams:parseFloat(parts[2])});
      });
      // Try table format
      if(oils.length === 0){
        var tRows = sBody.match(/\|\s*(.+?)\s*\|\s*([\d.]+)\s*g?\s*\|/g) || [];
        tRows.forEach(function(tr){
          var tp = tr.match(/\|\s*(.+?)\s*\|\s*([\d.]+)/);
          if(tp && !tp[1].includes('---') && !tp[1].toLowerCase().includes('ingredient') && !tp[1].toLowerCase().includes('grams') && !tp[1].toLowerCase().includes('notes')) oils.push({name:tp[1].trim(),grams:parseFloat(tp[2])});
        });
      }
      var totalOils = oils.reduce(function(s,o){return s+o.grams},0);
      var isFree = /fragrance.free|unscented/i.test(sName);
      recipe.scentProfiles.push({id:uid(),name:sName,subtitle:'',description:'',isFragranceFree:isFree,fragranceFreeSubstitute:'',oils:oils,totalGrams:totalOils});
    }
  }

  // Extract QC items
  var qcMatch = md.match(/##\s+QC CHECKLIST([\s\S]*?)(?=\n##\s|$)/i);
  if(qcMatch){
    var qcBlock = qcMatch[1];
    var qcLines = qcBlock.split('\n');
    qcLines.forEach(function(line){
      var t = line.trim();
      if(!t || t.match(/^\|[\s-:|]+\|$/) || t.toLowerCase().includes('check') && t.toLowerCase().includes('method')) return;
      if(t.startsWith('|')){
        var cells = t.split('|').map(function(c){return c.trim()}).filter(Boolean);
        if(cells.length >= 1 && cells[0] && !cells[0].includes('---')){
          recipe.qcItems.push(cells[0]);
        }
      }
    });
  }

  // Build sections from remaining markdown
  var secRegex = /^##\s+(.+)/gm;
  var secMatchR;
  var secPositions = [];
  while((secMatchR = secRegex.exec(md)) !== null){
    secPositions.push({title:secMatchR[1].trim(), start:secMatchR.index});
  }
  secPositions.forEach(function(sp, i){
    var end = i < secPositions.length-1 ? secPositions[i+1].start : md.length;
    var body = md.substring(sp.start, end);
    // Markdown to HTML — handles tables, blockquotes, headings, lists, inline formatting
    var html = mdToHtml(body);
    var cat = 'other';
    var tl = sp.title.toLowerCase();
    if(tl.includes('phase')) cat = 'phase';
    else if(tl.includes('batch total')) cat = 'phase';
    else if(tl.includes('safety') || tl.includes('regulatory') || tl.includes('notice') || tl.includes('warning')) cat = 'regulatory';
    else if(tl.includes('production') || tl.includes('protocol') || tl.includes('method')) cat = 'production';
    else if(tl.includes('qc') || tl.includes('checklist')) cat = 'qc';
    else if(tl.includes('scent')) cat = 'scent_profiles';
    else if(tl.includes('scaling')) cat = 'scaling';
    else if(tl.includes('pricing') || tl.includes('margin') || tl.includes('cogs')) cat = 'pricing';
    else if(tl.includes('inci') || tl.includes('allergen')) cat = 'inci';
    else if(tl.includes('formulation') || tl.includes('rationale')) cat = 'formulation_notes';
    else if(tl.includes('packaging')) cat = 'packaging';
    else if(tl.includes('label')) cat = 'label';
    else if(tl.includes('positioning')) cat = 'positioning';
    else if(tl.includes('version') || tl.includes('changelog')) cat = 'version_history';
    else if(tl.includes('website') || tl.includes('retail') || tl.includes('copy')) cat = 'retail_copy';
    else if(tl.includes('how to use') || tl.includes('usage')) cat = 'how_to_use';
    recipe.sections.push({title:sp.title, category:cat, html:html});
  });

  // Determine category from name
  var nm = recipe.name.toLowerCase();
  if(nm.includes('gold') || nm.includes('serum') || nm.includes('eye') || nm.includes('cleansing') || nm.includes('foundation')) recipe.category = 'Face care';
  else if(nm.includes('body') || nm.includes('butter')) recipe.category = 'Body care';
  else if(nm.includes('beard') || nm.includes('hair') || nm.includes('clay') || nm.includes('deodorant')) recipe.category = "Men's grooming";
  else if(nm.includes('shampoo') || nm.includes('conditioner')) recipe.category = 'Hair care';
  else if(nm.includes('lip') || nm.includes('stick')) recipe.category = 'Lip care';
  else if(nm.includes('soap')) recipe.category = 'Soap';
  else if(nm.includes('baby') || nm.includes('little')) recipe.category = 'Baby';
  else recipe.category = 'Skincare';

  // Detect product line from positioning or name
  if(/budget|everyday|gateway/i.test(md.substring(0,2000))) recipe.productLine = 'Gecko Everyday';
  else if(/premium|clinical|recovery|gold/i.test(nm)) recipe.productLine = 'Gecko Gold';
  else if(/little|baby|nappy/i.test(nm)) recipe.productLine = 'Little Geckos';
  else if(/beard|clay|men/i.test(nm)) recipe.productLine = "Gecko Men's";

  if(recipe.qcItems.length === 0){
    recipe.qcItems = ['All ingredients weighed accurately','Temperatures monitored','Visual inspection passed','Product fills correct','Batch labelled','Equipment cleaned'];
  }

  return recipe;
}

// ── Timer Component ──
// Parse "5 min", "30 sec", "10 minutes", "2 hours", "1.5h", "90s" out of an HTML/text blob.
// Returns the FIRST plausible duration in seconds, or null if none found.
// Skips temperatures (Celsius numbers) and percent values.
function extractTimerSeconds(text){
  if(!text) return null;
  // Strip HTML tags so the regex doesn't match attribute values
  var plain = String(text).replace(/<[^>]+>/g,' ');
  // Patterns ordered by specificity. Word boundaries on the unit prevent
  // matching things like "10 mg" or "5 mol".
  var patterns = [
    /(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\b/i,
    /(\d+(?:\.\d+)?)\s*(?:minutes?|mins?|min)\b/i,
    /(\d+(?:\.\d+)?)\s*(?:seconds?|secs?|sec)\b/i,
    /(\d+(?:\.\d+)?)\s*h\b/i,
    /(\d+(?:\.\d+)?)\s*m\b(?!l|g)/i,
    /(\d+(?:\.\d+)?)\s*s\b/i
  ];
  for(var i=0;i<patterns.length;i++){
    var m = plain.match(patterns[i]);
    if(m){
      var n = parseFloat(m[1]);
      if(isNaN(n) || n <= 0) continue;
      var unit = patterns[i].source.match(/h|m|s/)[0];
      // The order of patterns matches: 0=hour, 1=min, 2=sec, 3=h, 4=m, 5=s
      if(i===0 || i===3) return Math.round(n*3600);
      if(i===1 || i===4) return Math.round(n*60);
      return Math.round(n);
    }
  }
  return null;
}

function TimerWidget(props){
  var s = useState(props.initialSeconds || 300);
  var seconds = s[0], setSeconds = s[1];
  var r = useState(false);
  var running = r[0], setRunning = r[1];
  var d = useState(false);
  var done = d[0], setDone = d[1];
  var intervalRef = useRef(null);

  useEffect(function(){
    if(running && seconds > 0){
      intervalRef.current = setInterval(function(){
        setSeconds(function(prev){
          if(prev <= 1){
            clearInterval(intervalRef.current);
            setRunning(false);
            setDone(true);
            playBeep();
            // Notify parent (used for auto-advance in ProductionWalkthrough)
            if(typeof props.onComplete === 'function'){
              try{ props.onComplete() }catch(e){ console.error('timer onComplete failed', e) }
            }
            return 0;
          }
          return prev - 1;
        });
      },1000);
    }
    return function(){clearInterval(intervalRef.current)};
  },[running]);

  function startStop(){
    if(done){setDone(false);return}
    if(running){clearInterval(intervalRef.current);setRunning(false)}
    else{setDone(false);setRunning(true)}
  }
  function reset(){clearInterval(intervalRef.current);setRunning(false);setDone(false);setSeconds(props.initialSeconds||300)}
  function setPreset(s){clearInterval(intervalRef.current);setRunning(false);setDone(false);setSeconds(s)}

  var mins = Math.floor(seconds/60);
  var secs = seconds%60;

  return e('div',{className:'timer-panel'+(done?' timer-done':'')},
    e('div',{className:'timer-label'},props.label||'Hold Timer'),
    e('div',{className:'timer-display'+(running?' running':'')+(done?' done':'')},
      String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')
    ),
    e('div',{className:'timer-buttons'},
      e('button',{className:'timer-btn '+(running?'stop':'start'),onClick:startStop},running?'\u23F8 Pause':done?'\u2705 Done':'\u25B6 Start'),
      e('button',{className:'timer-btn',onClick:reset},'\u21BB Reset')
    ),
    e('div',{className:'timer-presets'},

// ── QC Checklist Component ──
function QCChecklist(props){
  var items = props.items || [];
  if(items.length === 0) return null;
  var stateKey = 'qc_'+props.recipeId+'_'+today();
  var qs = useState(ls(stateKey, {}));
  var states = qs[0], setStatesRaw = qs[1];
  function setStates(v){setStatesRaw(v);lsSet(stateKey,v)}

  function cycle(i){
    var cur = states[i]||'';
    var next = cur===''?'pass':cur==='pass'?'fail':cur==='fail'?'skip':'';
    var n = Object.assign({},states);
    n[i] = next;
    setStates(n);
  }
  function approveAll(){
    var n = {};
    items.forEach(function(_,i){n[i]='pass'});
    setStates(n);
  }

  var passed = 0, failed = 0, skipped = 0;
  items.forEach(function(_,i){
    var s = states[i]||'';
    if(s==='pass') passed++;
    if(s==='fail') failed++;
    if(s==='skip') skipped++;
  });
  var done = passed + failed + skipped;
  var total = items.length;

  var os = useState(true);
  var open = os[0], setOpen = os[1];

  return e('div',{className:'qc-panel'},
    e('div',{className:'qc-bar'},
      e('div',{className:'qc-bar-header',onClick:function(){setOpen(!open)}},
        e('span',{className:'qc-bar-title'},'QC Checklist ('+done+'/'+total+')'),
        e('div',{className:'qc-bar-actions'},
          done < total ? e('button',{className:'approve-all-btn',onClick:function(ev){ev.stopPropagation();approveAll()}},'Approve All') : null,
          e('span',{style:{fontSize:'12px',color:failed>0?'var(--red)':'var(--text-muted)'}},
            passed>0?passed+' pass  ':'',
            failed>0?failed+' fail':''),
          e('span',{className:'chevron'+(open?' open':'')},'\u25BC')
        )
      ),
      open ? e('div',null,
        items.map(function(item, i){
          var st = states[i] || '';
          var icon = st==='pass'?'\u2713':st==='fail'?'\u2717':st==='skip'?'\u2014':'';
          return e('div',{key:i,className:'qc-item'},
            e('div',{className:'qc-check '+(st||''),onClick:function(){cycle(i)},title:'Tap to cycle: pass > fail > skip > clear'}, icon),
            e('div',{className:'qc-text'+(st?' done':'')}, item),
            e('div',{className:'qc-actions'},
              e('button',{className:'qc-action-btn',onClick:function(){var n=Object.assign({},states);n[i]='pass';setStates(n)},style:{color:st==='pass'?'var(--green)':''},title:'Pass'},'\u2713'),
              e('button',{className:'qc-action-btn',onClick:function(){var n=Object.assign({},states);n[i]='fail';setStates(n)},style:{color:st==='fail'?'var(--red)':''},title:'Fail'},'\u2717'),
              e('button',{className:'qc-action-btn',onClick:function(){var n=Object.assign({},states);n[i]='skip';setStates(n)},style:{color:st==='skip'?'var(--text-muted)':''},title:'Skip'},'\u2014')
            )
          );
        }),
        e('div',{className:'qc-summary '+(done===total&&failed===0?'qc-pass':'qc-incomplete')},
          done===total&&failed===0 ? 'All '+total+' checks passed' :
          done===total ? 'Complete \u2014 '+failed+' failed' :
          done+' of '+total+' checked'
        )
      ) : null
    )
  );
}

// ── Batch Calculator (inline) ──
// Compare two recipe-version phase trees and return a small delta
// summary: how many ingredients were added, removed, and how many had
// their gram weight changed. Used by the version timeline so each row
// can show "what changed" at a glance.
function summarizeVersionDelta(prevPhases, curPhases){
  function flatten(phases){
    var out = {};
    (phases || []).forEach(function(p){
      (p.ingredients || []).forEach(function(ing){
        if(!ing.name) return;
        var key = (p.letter||'') + '/' + ing.name.toLowerCase();
        out[key] = ing.grams || 0;
      });
    });
    return out;
  }
  var prev = flatten(prevPhases);
  var cur = flatten(curPhases);
  var added = 0, removed = 0, changed = 0;
  Object.keys(cur).forEach(function(k){
    if(!(k in prev)) added++;
    else if(Math.abs((cur[k]||0) - (prev[k]||0)) > 0.001) changed++;
  });
  Object.keys(prev).forEach(function(k){
    if(!(k in cur)) removed++;
  });
  return {added:added, removed:removed, changed:changed};
}

// Per-recipe cost-per-unit / suggested retail / margin readout. Pulls
// ingredient prices from ingredientData (set on the Ingredients page).
// Per-recipe target margin + assumed unit size persist in localStorage
// so each recipe can have its own target. Slider re-renders the retail
// price live so Heath can see where the cost squeezes happen.
function CostMarginCard(props){
  var recipe = props.recipe;
  var marginsStore = ls('recipeMargins', {});
  var stored = marginsStore[recipe.id] || {};
  var ms = useState(typeof stored.margin === 'number' ? stored.margin : 60);
  var margin = ms[0], setMarginRaw = ms[1];
  var us = useState(typeof stored.unitSize === 'number' ? stored.unitSize : 50);
  var unitSize = us[0], setUnitSizeRaw = us[1];

  function persist(next){
    var all = ls('recipeMargins', {});
    all[recipe.id] = next;
    lsSet('recipeMargins', all);
  }
  function setMargin(v){ setMarginRaw(v); persist({margin:v, unitSize:unitSize}); }
  function setUnitSize(v){ setUnitSizeRaw(v); persist({margin:margin, unitSize:v}); }

  var batchSize = recipe.batchSize || 100;
  // Cost helper expects scale + units. For "cost per unit" we want
  // per-gram cost × unitSize. Compute a master-batch cost first and
  // derive perUnit ourselves so missing-price items roll up cleanly.
  var cost = computeRecipeCost(recipe, 1, Math.max(1, Math.round(batchSize / unitSize)));
  var costPerGram = batchSize > 0 ? cost.totalCost / batchSize : 0;
  var costPerUnit = costPerGram * unitSize;
  var suggestedRetail = margin < 100 ? costPerUnit / (1 - margin / 100) : null;
  var hasMissing = cost.missing && cost.missing.length > 0;

  function fmtMoney(n){

    return '$' + n.toFixed(2);

      e('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'12px'}},
        e('div',{style:{flex:'1 1 90px',padding:'8px 12px',background:'var(--bg-sunken)',borderRadius:'var(--radius-sm)'}},
          e('div',{style:{fontSize:'10px',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em'}},'Cost / unit'),

        e('div',{style:{flex:'1 1 90px',padding:'8px 12px',background:'var(--gold-soft)',borderRadius:'var(--radius-sm)'}},
          e('div',{style:{fontSize:'10px',color:'var(--gold)',textTransform:'uppercase',letterSpacing:'0.05em'}},'Suggested retail'),
          e('div',{style:{fontSize:'18px',fontWeight:600,color:'var(--gold)',fontVariantNumeric:'tabular-nums',marginTop:'2px'}}, fmtMoney(suggestedRetail))
        ),
        e('div',{style:{flex:'1 1 80px',padding:'8px 12px',background:'var(--green-soft)',borderRadius:'var(--radius-sm)'}},
          e('div',{style:{fontSize:'10px',color:'var(--green)',textTransform:'uppercase',letterSpacing:'0.05em'}},'Target margin'),
          e('div',{style:{fontSize:'18px',fontWeight:600,color:'var(--green)',fontVariantNumeric:'tabular-nums',marginTop:'2px'}}, margin + '%')
        )
      ),
      // Margin slider — live preview of retail

        e('label',{style:{fontSize:'11px',color:'var(--text-muted)',minWidth:'70px'}},'Margin'),

          style:{flex:1}
