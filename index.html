// ── Batch History Page ──
// ── GlobalSearch — modal reachable from the header magnifier icon ──
// Searches recipes, ingredients, batches (number, recipe, notes, scent), recipe notes
// Returns grouped results with snippets. Tap any result to navigate.
function GlobalSearch(props){
  var qs = useState('');
  var query = qs[0], setQuery = qs[1];
  var inputRef = useRef(null);

  useEffect(function(){
    setTimeout(function(){if(inputRef.current) inputRef.current.focus()}, 60);
    function onKey(ev){if(ev.key === 'Escape') props.onClose && props.onClose()}
    window.addEventListener('keydown', onKey);
    return function(){window.removeEventListener('keydown', onKey)};
  },[]);

  var results = useMemo(function(){
    if(!query || query.trim().length < 2) return null;
    var q = query.trim().toLowerCase();
    var hits = {recipes:[], ingredients:[], batches:[], notes:[]};

    // Recipes — name, category, format, productLine match
    var allRecipes = (typeof getAllRecipes==='function') ? getAllRecipes() : [];
    allRecipes.forEach(function(r){
      var hay = ((r.name||'')+' '+(r.category||'')+' '+(r.format||'')+' '+(r.productLine||'')).toLowerCase();
      if(hay.indexOf(q) !== -1) hits.recipes.push(r);
    });

    // Ingredients — DB names + descriptions
    INGREDIENTS_DB.forEach(function(ing){
      var hay = ((ing.name||'')+' '+(ing.category||'')+' '+(ing.description||'')+' '+(ing.function||'')).toLowerCase();
      if(hay.indexOf(q) !== -1) hits.ingredients.push(ing);
    });

    // Batches — batchNumber, recipeName, scent, notes, author
    var batches = ls('batchLogs', []);
    batches.slice().reverse().forEach(function(b){
      var hay = ((b.batchNumber||'')+' '+(b.recipeName||'')+' '+(b.scent||'')+' '+(b.notes||'')+' '+(b.author||'')).toLowerCase();
      if(hay.indexOf(q) !== -1) hits.batches.push(b);
    });

    // Recipe notes (per-recipe notes_<id> arrays in localStorage)
    try {
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(!k || k.indexOf('gecko_notes_') !== 0) continue;
        var rid = k.substring('gecko_notes_'.length);
        var notes;
        try { notes = JSON.parse(localStorage.getItem(k)) || []; } catch(e){ notes = [] }
        var rec = allRecipes.find(function(r){return r.id===rid});
        notes.forEach(function(n){
          if((n.text||'').toLowerCase().indexOf(q) !== -1){
            hits.notes.push({recipeId:rid, recipeName:rec?rec.name:'(deleted recipe)', recipe:rec, note:n});
          }
        });
      }
    } catch(e){}

    // Cap each section at 10
    Object.keys(hits).forEach(function(k){if(hits[k].length>10) hits[k] = hits[k].slice(0,10)});
    return hits;
  },[query]);

  function highlight(text){
    if(!text || !query) return text;
    var q = query.trim();
    if(q.length < 2) return text;
    var idx = String(text).toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return text;
    var t = String(text);
    return [
      t.substring(0, idx),
      e('span',{key:'hl',className:'gs-hl'}, t.substring(idx, idx+q.length)),
      t.substring(idx+q.length)
    ];
  }

  // Show a snippet from a longer string, anchored around the match
  function snippet(text, len){
    len = len || 80;
    if(!text) return '';
    var t = String(text).replace(/\s+/g,' ').trim();
    var q = query.trim().toLowerCase();
    if(q.length < 2) return t.length > len ? t.substring(0,len)+'…' : t;
    var idx = t.toLowerCase().indexOf(q);
    if(idx === -1) return t.length > len ? t.substring(0,len)+'…' : t;
    var start = Math.max(0, idx - 30);
    var end = Math.min(t.length, idx + q.length + (len - 30));
    return (start>0?'…':'') + t.substring(start, end) + (end<t.length?'…':'');
  }

  function go(action){
    props.onClose && props.onClose();
    setTimeout(action, 50);
  }

  return e('div',{className:'gs-overlay',onClick:function(ev){if(ev.target===ev.currentTarget) props.onClose && props.onClose()}},
    e('div',{className:'gs-card'},
      e('div',{className:'gs-input-wrap'},
        e('span',{style:{display:'flex',color:'var(--text-muted)'}},Icon('search',18)),
        e("input",{ref:inputRef,className:"gs-input",placeholder:"Search recipes, ingredients, batches, notes\u2026",value:query,onChange:function(ev){setQuery(ev.target.value)}}),
        e('button',{className:'gs-close',onClick:props.onClose,title:'Close (Esc)'},'✕')
      ),
      e('div',{className:'gs-results'},
        !results ? e('div',{className:'gs-empty'},'Type at least 2 characters to search.') :
        (results.recipes.length + results.ingredients.length + results.batches.length + results.notes.length === 0) ?
          e('div',{className:'gs-empty'},'No matches.') :
        e('div',null,
          // Recipes
          results.recipes.length > 0 ? e('div',null,
            e('div',{className:'gs-section'},'Recipes'),
            results.recipes.map(function(r){
              return e('div',{key:'r-'+r.id,className:'gs-item',onClick:function(){go(function(){props.onSelectRecipe && props.onSelectRecipe(r)})}},
                e('span',{className:'gs-item-icon'},Icon('clipboard',18)),
                e('div',{className:'gs-item-body'},
                  e('div',{className:'gs-item-title'},highlight(r.name)),
                  e('div',{className:'gs-item-meta'},[r.category, r.format, r.productLine].filter(Boolean).join(' · '))
                )
              );
            })
          ) : null,
          // Ingredients
          results.ingredients.length > 0 ? e('div',null,
            e('div',{className:'gs-section'},'Ingredients'),
            results.ingredients.map(function(ing,i){
              return e('div',{key:'i-'+i,className:'gs-item',onClick:function(){go(function(){props.onNav && props.onNav('ingredients')})}},
                e('span',{className:'gs-item-icon'},Icon('flask',18)),
                e('div',{className:'gs-item-body'},
                  e('div',{className:'gs-item-title'},highlight(ing.name)),
                  e('div',{className:'gs-item-meta'},(ing.category||'')+' · used in '+(ing.usedIn?ing.usedIn.length:0)+' recipes'),
                  ing.description ? e('div',{className:'gs-item-snippet'},snippet(ing.description)) : null
                )
              );
            })
          ) : null,
          // Batches
          results.batches.length > 0 ? e('div',null,
            e('div',{className:'gs-section'},'Batches'),
            results.batches.map(function(b){
              return e('div',{key:'b-'+b.id,className:'gs-item',onClick:function(){go(function(){props.onNav && props.onNav('batches')})}},
                e('span',{className:'gs-item-icon'},Icon('package',18)),
                e('div',{className:'gs-item-body'},
                  e('div',{className:'gs-item-title'},highlight(b.batchNumber+' · '+(b.recipeName||''))),
                  e('div',{className:'gs-item-meta'},fmtDate(b.date)+(b.scent?' · '+b.scent:'')+(b.author?' · '+b.author:'')),
                  b.notes ? e('div',{className:'gs-item-snippet'},snippet(b.notes)) : null
                )
              );
            })
          ) : null,
          // Recipe notes
          results.notes.length > 0 ? e('div',null,
            e('div',{className:'gs-section'},'Recipe notes'),
            results.notes.map(function(n,i){
              return e('div',{key:'n-'+i,className:'gs-item',onClick:function(){go(function(){if(n.recipe) props.onSelectRecipe && props.onSelectRecipe(n.recipe)})}},
                e('span',{className:'gs-item-icon'},Icon('file',18)),
                e('div',{className:'gs-item-body'},
                  e('div',{className:'gs-item-title'},n.recipeName),
                  e('div',{className:'gs-item-meta'},fmtDate(n.note.date)+(n.note.author?' · '+n.note.author:'')),
                  e('div',{className:'gs-item-snippet'},highlight(snippet(n.note.text)))
                )
              );
            })
          ) : null
        )
      )
    )
  );
}

function BuyersForRecallModal(props){
  // props: {batch, recipe, mapping, onClose}
  var bs = useState(null);
  var buyers = bs[0], setBuyers = bs[1];
  var es = useState(null);
  var err = es[0], setErr = es[1];
  var ss = useState({});
  var selected = ss[0], setSelected = ss[1];

  var batch = props.batch;
  var defaultSubject = 'Important: recall — ' + (batch.recipeName||'product') + ' (Batch ' + batch.batchNumber + ')';
  var defaultBody =
    'Hi there,\n\n' +
    'You bought a ' + (batch.recipeName||'product') + ' from BatchFlow recently. We\'ve identified a quality issue with the batch you received and are recalling it.\n\n' +
    'If you still have the product, please don\'t use it. We want to make this right — reply to this email and let us know whether you\'d prefer a refund or a replacement.\n\n' +
    'Recall details: https://gecko-api.ecoshine.workers.dev/b/' + (batch.batchNumber||'') + '\n\n' +
    'Sorry for the inconvenience.\n\n' +
    'Kendal & Heath\n' +
    'BatchFlow';
  var subjectS = useState(defaultSubject);
  var subject = subjectS[0], setSubject = subjectS[1];
  var bodyS = useState(defaultBody);
  var body = bodyS[0], setBody = bodyS[1];

  // Extracted so the ErrorCard's Try-again button can re-fire it.
  function loadBuyers(){
    setErr(null);
    setBuyers(null);
    if(!props.mapping || !props.mapping.products || !props.mapping.products.length){
      setErr('No Shopify mapping for this recipe — open Settings → Configure recipe → product mapping.');
      setBuyers([]);
      return;
    }
    var variantIds = props.mapping.products.map(function(p){return p.variantId}).filter(function(v){return typeof v === 'number'});
    if(!variantIds.length){
      setErr('Mapping is missing variant IDs — re-save it in Settings → Shopify mapping.');
      setBuyers([]);
      return;
    }
    var since = batch.date ? (new Date(batch.date)).toISOString() : new Date(Date.now()-365*24*60*60*1000).toISOString();
    workerBuyersForBatch(variantIds, since).then(function(res){
      var list = (res && res.buyers) || [];
      setBuyers(list);
      var sel = {};
      list.forEach(function(b){ sel[b.email] = true; });
      setSelected(sel);
    }).catch(function(e){
      setErr(e && e.message ? e.message : String(e));
      setBuyers([]);
    });
  }
  useEffect(loadBuyers, []);

  function toggle(email){
    setSelected(function(s){
      var n = Object.assign({}, s);
      n[email] = !n[email];
      return n;
    });

  function selectedEmails(){
    return (buyers||[]).filter(function(b){return selected[b.email]}).map(function(b){return b.email});
  }
  function openInMail(){
    var emails = selectedEmails();
    if(emails.length === 0){ showToast('No customers selected'); return; }
    var url = 'mailto:?bcc=' + encodeURIComponent(emails.join(',')) +
              '&subject=' + encodeURIComponent(subject) +
              '&body=' + encodeURIComponent(body);
    // Mail clients vary; ~2000 chars is the safe ceiling. Length check
    // covers the WHOLE url (BCC + subject + body), not just the BCC list
    // — long subjects or detailed bodies can push it over too.
    if(url.length > 2000){
      dialogAlert('Mail link too long','The full mailto URL is ' + url.length + ' characters (' + emails.length + ' recipients + subject + body). Most mail clients cap at ~2000. Use "Copy emails" and paste into a fresh email instead.');
      return;
    }
    window.location.href = url;

      navigator.clipboard.writeText(emails.join(', ')).then(function(){
        showToast('Copied ' + emails.length + ' email' + (emails.length===1?'':'s') + ' to clipboard');
      }).catch(function(){
        // Fallback — show in a prompt the user can copy from

      e('div',{className:'modal-title'},
        e('span',{style:{display:'inline-flex',alignItems:'center',gap:'8px'}},Icon('mail',18),'Email buyers — ' + batch.batchNumber),
        e('button',{className:'modal-close',onClick:props.onClose,'aria-label':'Close'},'✕')
      ),
      e('div',{style:{padding:'12px 16px',overflowY:'auto',flex:1}},
        // Loading — skeleton rows so the modal feels structurally complete

              e(Skel,{style:{width:'18px',height:'18px',borderRadius:'3px'}}),
              e(Skel,{style:{height:'14px',flex:1,maxWidth:(70-i*7)+'%'}}),
              e(Skel,{style:{height:'14px',width:'80px'}}),
              e(Skel,{style:{height:'14px',width:'40px'}})

        // Customer list
        e('div',null,

          ),
          e('div',{style:{maxHeight:'240px',overflowY:'auto',border:'1px solid var(--border-light)',borderRadius:'6px',marginBottom:'12px'}},
            e('table',{style:{width:'100%',fontSize:'12px',borderCollapse:'collapse'}},
              e('tbody',null,

          )
        )
      ),
      buyers && buyers.length > 0 ? e('div',{style:{padding:'12px 16px',borderTop:'1px solid var(--border-light)',display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}},
        e('button',{className:'tool-btn primary',onClick:openInMail,disabled:selectedEmails().length===0}, e('span',{style:{display:'inline-flex',alignItems:'center',gap:'6px'}}, Icon('mail',14), 'Open in Mail app (' + selectedEmails().length + ')')),
        e('button',{className:'tool-btn',onClick:copyEmails,disabled:selectedEmails().length===0}, e('span',{style:{display:'inline-flex',alignItems:'center',gap:'6px'}}, Icon('clipboard',14), 'Copy emails')),
        e('button',{className:'tool-btn',onClick:props.onClose,style:{marginLeft:'auto'}}, 'Close')
      ) : e('div',{style:{padding:'12px 16px',borderTop:'1px solid var(--border-light)',display:'flex',justifyContent:'flex-end'}},
        e('button',{className:'tool-btn',onClick:props.onClose}, 'Close')
      )
    )
  );
}

function BatchesPage(props){
  // sales view was removed — keep `view`/`setView` as inert constants so the
  // surrounding view==='batches' conditionals (left in place) just always render.
  var view = 'batches';
  function setView(){}
  var ls2 = useState(ls('batchLogs',[]));
  var logs = ls2[0], setLogs = ls2[1];
  // Row overflow menu — id of the batch whose ⋯ menu is currently open.
  var rm = useState(null);
  var openRowMenuId = rm[0], setOpenRowMenuId = rm[1];
  // Customer detail modal — opens when a buyer email is clicked. State
  // here so it can be triggered from the buyers-for-recall modal too.
  var cd = useState(null);
  var customerDetailEmail = cd[0], setCustomerDetailEmail = cd[1];
  var ss = useState('');
  var search = ss[0], setSearch = ss[1];
  var fs = useState('');
  var fromDate = fs[0], setFromDate = fs[1];
  var ts = useState('');
  var toDate = ts[0], setToDate = ts[1];
  // Buyers-for-recall modal — set to a batchId to open it.
  var bs2 = useState(null);
  var buyersForBatchId = bs2[0], setBuyersForBatchId = bs2[1];
  // Re-pull from localStorage when remote sync arrives
  var syncTick = useSyncTick();
  useEffect(function(){
    if(syncTick > 0){ setLogs(ls('batchLogs',[])); }
  },[syncTick]);

  // Local batch removal — moves to Trash and stamps a tombstone so a
  // future cloud sync from another device doesn't resurrect the row.
  function removeBatchLocal(batchId){
    var batch = logs.find(function(b){return b.id===batchId});
    var label = batch ? (batch.batchNumber||'this batch') : 'this batch';
    dialogConfirm('Remove '+label+'?','It will be moved to Trash and can be restored within 30 days.',{confirmLabel:'Remove',danger:true}).then(function(ok){
      if(!ok) return;
      if(typeof trashAdd==='function' && batch) trashAdd('batch',batch);
      var updated = logs.filter(function(b){return b.id !== batchId});
      lsSet('batchLogs',updated);
      recordTombstone('batchLogs', batchId);
      setLogs(updated);
      showToast('Batch moved to Trash');
    });
  }

  // Status change flow:
  //  - 'failed'    → re-publish public page as Recalled, deduct remaining
  //                  Shopify stock, prompt user about emailing customers
  //  - 'sold_out'  → re-publish as Sold out
  //  - 'completed' → re-publish as Available (revert)
  // The local batch.status is updated in localStorage either way. Public
  // page re-publish is best-effort — we never block on a worker hiccup.
  function changeBatchStatus(batchId, newStatus){
    var batch = logs.find(function(b){return b.id===batchId});
    if(!batch) return;
    var current = batch.status || 'completed';
    if(current === newStatus) return;
    var labels = {completed:'Active', sold_out:'Sold out', failed:'Recalled'};
    var msg;
    if(newStatus === 'failed'){
      msg = 'Mark batch '+batch.batchNumber+' as recalled?\n\n'
          + 'This will:\n'
          + ' • Update the public batch page to "Recalled" with a refund button\n'
          + ' • Deduct the remaining Shopify stock for this batch to zero';
    } else if(newStatus === 'sold_out'){
      msg = 'Mark batch '+batch.batchNumber+' as sold out?\n\n'
          + 'The public batch page will show "Sold out".';
    } else {
      msg = 'Mark batch '+batch.batchNumber+' as active again?\n\n'
          + 'The public batch page will show "Available".';
    }
    dialogConfirm('Change batch status?', msg, {confirmLabel:'Confirm', danger: newStatus==='failed'}).then(function(ok){
      if(!ok) return;

      var updated = logs.map(function(b){
        if(b.id !== batchId) return b;
        return Object.assign({}, b, {status:newStatus, statusChangedAt:Date.now()});
      });
      lsSet('batchLogs', updated);
      setLogs(updated);

      var rec = getAllRecipes().find(function(r){return r.id===batch.recipeId});
      var stamped = Object.assign({}, batch, {status:newStatus});

      // Re-publish public page (no-op if not configured / no internet).
      if(typeof publishBatchPublic === 'function'){
        publishBatchPublic(stamped, rec).catch(function(e){
          console.warn('republish failed', e);
        });
      }

      // Failed → also deduct remaining Shopify stock.
      if(newStatus === 'failed' && shopifyConfigured() && rec){
        var mappings = ls('shopifyMappings', {});
        var mapping = mappings[batch.recipeId];
        if(mapping && mapping.products && mapping.products.length){
          workerDeductRemaining({
            batchId: batch.id,
            recipeId: batch.recipeId,
            products: mapping.products
          }).then(function(res){
            if(res && res.enqueued > 0){
              showToast('Stock deduction queued ('+res.enqueued+' product'+(res.enqueued===1?'':'s')+')');
            } else {
              showToast('No remaining stock to deduct');
            }
          }).catch(function(e){
            console.warn('deduct-remaining failed', e);
            showToast('Failed to deduct stock — see console');
          });
        }
      }

      showToast('Batch '+batch.batchNumber+' marked '+labels[newStatus]);
      logActivity('changed batch status', '#'+batch.batchNumber+' → '+labels[newStatus]);

      // On Recalled: auto-open the buyers list so Heath can email
      // affected customers from his Mail app.
      if(newStatus === 'failed' && shopifyConfigured()){
        setBuyersForBatchId(batchId);
      }
    });
  }

  // Manual release — for recipes whose Shopify mapping is curingMode:'manual'.
  // logBatch skips the auto-enqueue for those; the user clicks Release here
  // when they're ready to push inventory to Shopify (e.g. after curing,
  // labelling, packing). Idempotent on the worker side via idempotency_key.
  function manualReleaseBatch(batchId){
    var batch = logs.find(function(b){return b.id===batchId});
    if(!batch) return;
    var rec = getAllRecipes().find(function(r){return r.id===batch.recipeId});
    if(!rec){ showToast('Recipe not found'); return; }
    var mappings = ls('shopifyMappings',{});
    var m = mappings[batch.recipeId];
    if(!m || !m.products || m.products.length === 0){
      showToast('No Shopify mapping for '+(batch.recipeName||'this recipe'));
      return;
    }
    var units = parseInt(batch.unitsProduced,10) || 0;
    // Spell out exactly what's about to happen — product names + variant
    // titles, not just a count. The confirm dialog body supports plain text
    // with newlines, which dialogBody renders via white-space:pre-wrap.
    var productLines = m.products.map(function(p){
      var name = p.title || p.productTitle || p.name || ('Product '+(p.productId||p.variantId||'?'));
      var variant = p.variantTitle && p.variantTitle !== 'Default Title' ? ' · '+p.variantTitle : '';
      return '  +' + units + (units===1?' unit':' units') + ' → ' + name + variant;
    }).join('\n');
    var preview = 'About to push:\n\n' + productLines + '\n\nThis writes to Shopify immediately.';
    dialogConfirm(
      'Release '+batch.batchNumber+' to Shopify?',
      preview,
      {confirmLabel:'Release'}
    ).then(function(ok){
      if(!ok) return;
      enqueueBatchToShopify(batch, rec, {forceManual:true}).then(function(){
        var updated = logs.map(function(x){
          if(x.id !== batchId) return x;
          return Object.assign({}, x, {shopifyReleased:true, shopifyReleasedAt:Date.now()});
        });
        lsSet('batchLogs', updated);
        setLogs(updated);
        showToast('Released '+batch.batchNumber+' to Shopify');
        logActivity('released batch', '#'+batch.batchNumber+' to Shopify');
      }).catch(function(e){
        console.warn('manual release failed', e);
        showToast('Release failed — see console');
      });
    });
  }

  function exportCSV(){
    var rows = [['Batch Number','Recipe','Date','Scent','Units','Status','Author','Expiry','Notes']];
    logs.forEach(function(b){
      rows.push([
        b.batchNumber||'',
        b.recipeName||'',
        b.date||'',
        b.scent||'',
        String(b.unitsProduced||0),
        b.status||'completed',
        b.author||'',
        b.expiryDate||'',
        (b.notes||'').replace(/"/g,'""')
      ]);
    });
    var csv = rows.map(function(r){return r.map(function(c){return '"'+c+'"'}).join(',')}).join('\n');
    var blob = new Blob([csv],{type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'gecko_batches_'+today()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('CSV exported!');
  }

  function exportBarcodePDF(){
    // Generate a printable HTML page with one scannable QR per batch.
    // Each QR points to the batch's public trust page on the worker.
    var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Gecko Batch QR Codes</title><style>';
    html += 'body{font-family:Arial,sans-serif;margin:20px}';
    html += '.label{display:inline-block;width:170px;padding:12px;margin:8px;border:1px solid #ddd;border-radius:6px;text-align:center;page-break-inside:avoid;vertical-align:top}';
    html += '.label img{width:140px;height:140px;display:block;margin:0 auto;image-rendering:pixelated}';
    html += '.batch-id{font-size:11px;font-weight:700;margin-top:6px;font-family:monospace}';
    html += '.batch-info{font-size:9px;color:#666;margin-top:2px}';
    html += '@media print{.no-print{display:none!important}.label{border:1px solid #999}}';
    html += '</style></head><body>';
    html += '<h2 style="margin-bottom:4px">BatchFlow — Batch QR Codes</h2>';
    html += '<p style="font-size:12px;color:#666;margin-top:0">Generated '+today()+' — '+logs.length+' batch'+(logs.length===1?'':'es')+'. Each QR links to the public batch page.</p>';
    html += '<button class="no-print" onclick="window.print()" style="margin-bottom:12px;padding:8px 16px;font-size:14px;cursor:pointer">Print</button>';
    html += '<div>';
    logs.forEach(function(b){
      var qrUrl = 'https://gecko-api.ecoshine.workers.dev/b/' + encodeURIComponent(b.batchNumber||'');
      var qrPng = geckoQrPngDataUrl(qrUrl, 6);
      html += '<div class="label">';
      if(qrPng) html += '<img src="'+qrPng+'" alt="QR: '+escapeHtml(b.batchNumber||'')+'"/>';
      html += '<div class="batch-id">'+escapeHtml(b.batchNumber||'')+'</div>';
      html += '<div class="batch-info">'+escapeHtml((b.recipeName||'')+(b.scent?' — '+b.scent:''))+'</div>';
      html += '<div class="batch-info">'+escapeHtml(fmtDate(b.date)+(b.expiryDate?' | Exp: '+fmtDate(b.expiryDate):''))+'</div>';
      html += '</div>';
    });
    html += '</div></body></html>';
    var blob = new Blob([html],{type:'text/html;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var win = window.open(url,'_blank');
    if(!win) showToast('Pop-up blocked — allow pop-ups for this site');
    else showToast('QR codes opened!');
  }

  var filtered = logs.filter(function(b){
    var matchSearch = !search || (b.recipeName||'').toLowerCase().indexOf(search.toLowerCase()) >= 0 || (b.batchNumber||'').toLowerCase().indexOf(search.toLowerCase()) >= 0;
    if(!matchSearch) return false;
    if(fromDate && (b.date||'') < fromDate) return false;
    if(toDate && (b.date||'') > toDate) return false;
    return true;
  }).reverse();

  return e('div',{className:'container'},
    null,
    null,
    view==='batches' ? e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}},
      e('div',{style:{fontSize:'16px',fontWeight:600}},'Batch History'),
      logs.length > 0 ? e('div',{style:{display:'flex',gap:'6px'}},
        e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:exportCSV},'\uD83D\uDCCB CSV'),
        e('button',{'data-tut':'barcodes-btn',className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:exportBarcodePDF},'\uD83C\uDFF7 QR Codes')
      ) : null
    ) : null,
    view==='batches' ? e('div',{className:'search-bar'},
      e('input',{className:'search-input',placeholder:'Search batches...',value:search,onChange:function(ev){setSearch(ev.target.value)}})
    ) : null,
    view==='batches' ? e('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',fontSize:'12px',color:'var(--text-light)'}},
      e('span',null,'From'),
      e('input',{type:'date',value:fromDate,onChange:function(ev){setFromDate(ev.target.value)},style:{padding:'6px 8px',border:'1px solid var(--border)',borderRadius:'6px',fontSize:'13px',background:'var(--bg-card)',color:'var(--text)'}}),
      e('span',null,'to'),
      e('input',{type:'date',value:toDate,onChange:function(ev){setToDate(ev.target.value)},style:{padding:'6px 8px',border:'1px solid var(--border)',borderRadius:'6px',fontSize:'13px',background:'var(--bg-card)',color:'var(--text)'}}),
      (fromDate||toDate) ? e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:function(){setFromDate('');setToDate('')}},'Clear') : null,
      (fromDate||toDate) ? e('span',{style:{marginLeft:'auto',color:'var(--gold)'}},filtered.length+' match'+(filtered.length!==1?'es':'')) : null
    ) : null,
    view==='batches' ? (filtered.length === 0 ? EmptyState({illustration:'batches', title:'No batches logged yet', message:'Pick a recipe and log a batch — it shows up here with cost, scent, and a QR code.', action:{label:'Browse recipes', onClick:function(){props.nav && props.nav('recipes')}}}) :
    filtered.map(function(b,i){
      var rowQrUrl = 'https://gecko-api.ecoshine.workers.dev/b/' + encodeURIComponent(b.batchNumber||'');

      // Treat any non-failure/sold-out status as 'completed' for the picker
      // (older batches might have legacy values). Visual class still uses
      // the raw status so we can colour 'planned' etc. distinctly elsewhere.
      var pickerStatus = (curStatus==='failed'||curStatus==='sold_out') ? curStatus : 'completed';

      // Show the manual-release button if this batch's recipe is mapped
      // with curingMode:'manual' and we haven't already released it.
      var rowMappings = ls('shopifyMappings',{});
      var rowMap = b.recipeId ? rowMappings[b.recipeId] : null;
      var needsManualRelease = !!(rowMap && rowMap.curingMode === 'manual' && !b.shopifyReleased);
      var alreadyReleased = !!(rowMap && rowMap.curingMode === 'manual' && b.shopifyReleased);

      var isRecalled = curStatus === 'failed';
      var statusLabel = curStatus === 'failed' ? 'Recalled' : curStatus === 'sold_out' ? 'Sold out' : 'Active';
      return e('div',{key:b.id||i,className:'batch-card','data-tut':i===0?'batch-row':undefined},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px'}},
          e('div',{style:{display:'flex',alignItems:'center',gap:'8px',minWidth:0,flex:1}},
            e('span',{className:'batch-number'},b.batchNumber),
            e('span',{className:'batch-status '+pickerStatus,title:'Open the menu to change status'},statusLabel),
            alreadyReleased ? (function(){
              var releasedDate = b.shopifyReleasedAt ? fmtDate(new Date(b.shopifyReleasedAt).toISOString().slice(0,10)) : null;
              return e('span',{
                style:{fontSize:'10px',padding:'2px 8px',borderRadius:'var(--radius-pill)',background:'var(--green-soft)',color:'var(--green)',fontWeight:600},
                title:'Released to Shopify' + (releasedDate ? ' on ' + releasedDate : '')
              }, releasedDate ? '\u2713 Released ' + releasedDate : '\u2713 Released');
            })() : null,
            needsManualRelease ? e('span',{style:{fontSize:'10px',padding:'2px 8px',borderRadius:'var(--radius-pill)',background:'var(--gold-soft)',color:'var(--gold)',fontWeight:600},title:'Manual release pending \u2014 open the menu to release.'},'\u2022 Ready') : null
          ),
          e('button',{
            className:'row-menu-btn',
            onClick:function(){setOpenRowMenuId(b.id)},
            'aria-label':'Batch actions',
            title:'Actions'
          }, '\u22ef')
        ),
        e('div',{className:'batch-product'},b.recipeName||'Unknown'),
        e('div',{className:'batch-meta'},
          fmtDate(b.date),
          b.unitsProduced?' \u2022 '+b.unitsProduced+' units':'',
          b.scent?' \u2022 '+b.scent:'',
          b.author?' \u2022 '+b.author:'',
          b.expiryDate?' \u2022 Exp: '+fmtDate(b.expiryDate):''
        ),
        b.notes ? e('div',{style:{fontSize:'12px',color:'var(--text-light)',marginTop:'4px'}},
          renderNoteWithLinks(b.notes, function(r){
            // Defer to RecipeDetail via a lightweight in-memory hand-off
            window._geckoOpenRecipe = r;
            window.dispatchEvent(new CustomEvent('gecko-open-recipe',{detail:r}));
          })
        ) : null,
        // Cost rollup — only show if at least one ingredient has a price set
        (function(){
          if(!b.recipeId) return null;
          var rec = getAllRecipes().find(function(r){return r.id===b.recipeId});
          if(!rec) return null;
          var scale = (function(){
            var rg = rec.batchSize || 100;
            if(b.batchSizeGrams && b.batchSizeGrams > 0) return b.batchSizeGrams / rg;
            if(b.unitsProduced && b.containerSize) return (b.unitsProduced*b.containerSize) / rg;
            if(b.unitsProduced) return b.unitsProduced / Math.max(1, Math.round(rg/50));
            return 1;
          })();
          var cost = computeRecipeCost(rec, scale, b.unitsProduced || 0);
          if(cost.totalCost === 0) return null;
          var partial = cost.missing.length > 0;
          return e('div',{style:{fontSize:'11px',color:'var(--text-muted)',marginTop:'4px'}},
            'Cost: $'+cost.totalCost.toFixed(2)+(partial?'+':''),
            (b.unitsProduced && cost.perUnitCost) ? ' · $'+cost.perUnitCost.toFixed(2)+(partial?'+':'')+'/unit' : ''
          );
        })(),
        // Photos (local only)
        b.id ? e(BatchPhotos,{batchId:b.id,batchCode:b.batchNumber}) : null,
        // QR — links to the batch's public page (same code that prints on the QR sheet)
        rowQrPng ? e('div',{style:{marginTop:'8px',textAlign:'center',padding:'8px',background:'#fff',borderRadius:'6px'}},
          e('img',{src:rowQrPng,style:{width:'90px',height:'90px',display:'block',margin:'0 auto',imageRendering:'pixelated'},alt:'QR: '+b.batchNumber}),
          e('div',{style:{fontSize:'10px',fontFamily:'monospace',color:'#333',marginTop:'4px'}},b.batchNumber)
        ) : null
      );
    })) : null,
    // Buyers-for-recall modal — opens automatically when a batch is marked

    (function(){

      if(!b) return null;
      var rec = getAllRecipes().find(function(r){return r.id === b.recipeId});

      var mapping = b.recipeId ? mappings[b.recipeId] : null;

        mapping: mapping,
        onSelectCustomer: function(email){ setCustomerDetailEmail(email); },

      });
    })(),

    // Customer detail modal — opens when a buyer email is clicked
    // (either from the buyers-for-recall modal or a future batch-detail
    // surface). Read-only Shopify lookup of order history.
    customerDetailEmail ? e(CustomerDetailModal, {
      email: customerDetailEmail,
      onClose: function(){ setCustomerDetailEmail(null); }
    }) : null,

    // Row overflow menu — bottom-sheet listing every action available for
    // the open row. Replaces the cluster of buttons that used to live in
    // the row header. Status changes happen here so the row itself stays
    // calm and scannable.
    (function(){
      if(!openRowMenuId) return null;
      var b = logs.find(function(x){return x.id === openRowMenuId});
      if(!b) return null;
      var rowMappings = ls('shopifyMappings',{});
      var rowMap = b.recipeId ? rowMappings[b.recipeId] : null;
      var curStatus = b.status || 'completed';
      var pickerStatus = (curStatus==='failed'||curStatus==='sold_out') ? curStatus : 'completed';
      var needsManualRelease = !!(rowMap && rowMap.curingMode === 'manual' && !b.shopifyReleased);
      var isRecalled = curStatus === 'failed';
      function close(){ setOpenRowMenuId(null); }
      function pickStatus(s){ close(); changeBatchStatus(b.id, s); }
      return e('div',{className:'modal-overlay',onClick:close},
        e('div',{className:'modal',style:{padding:0,maxWidth:'420px'},onClick:function(ev){ev.stopPropagation()}},
          e('div',{style:{padding:'var(--space-3) var(--space-4) var(--space-2)',borderBottom:'1px solid var(--border-light)'}},
            e('div',{style:{fontSize:'var(--text-sm)',fontWeight:'var(--weight-semi)'}},'Batch '+b.batchNumber),
            e('div',{style:{fontSize:'var(--text-xs)',color:'var(--text-muted)',marginTop:'2px'}},b.recipeName||'Unknown recipe')
          ),
          e('div',{className:'row-menu-section-label'},'Status'),
          e('div',{className:'row-menu-sheet'},
            e('button',{className:'row-menu-item'+(pickerStatus==='completed'?' active-state':''),onClick:function(){pickStatus('completed')}},
              e('span',{className:'rm-icon'},Icon('check',18)),
              e('span',null,'Mark active')
            ),
            e('button',{className:'row-menu-item'+(pickerStatus==='sold_out'?' active-state':''),onClick:function(){pickStatus('sold_out')}},
              e('span',{className:'rm-icon'},Icon('package',18)),
              e('span',null,'Mark sold out')
            ),
            e('button',{className:'row-menu-item'+(pickerStatus==='failed'?' active-state':' danger'),onClick:function(){pickStatus('failed')}},
              e('span',{className:'rm-icon'},Icon('alert',18)),
              e('span',null,'Mark recalled')
            )
          ),
          e('div',{className:'row-menu-section-label'},'Actions'),
          e('div',{className:'row-menu-sheet'},
            needsManualRelease ? e('button',{className:'row-menu-item',onClick:function(){close(); manualReleaseBatch(b.id)}},
              e('span',{className:'rm-icon'},Icon('refresh',18)),
              e('span',null,'Release to Shopify ('+(b.unitsProduced||0)+' units)')
            ) : null,
            isRecalled ? e('button',{className:'row-menu-item',onClick:function(){close(); setBuyersForBatchId(b.id)}},
              e('span',{className:'rm-icon'},Icon('mail',18)),
              e('span',null,'Show buyers + email')
            ) : null,
            props.onLabels ? e('button',{className:'row-menu-item',onClick:function(){close(); props.onLabels({recipeId:b.recipeId,batchId:b.id})}},
              e('span',{className:'rm-icon'},Icon('tag',18)),
              e('span',null,'Print labels')
            ) : null,
            e('button',{className:'row-menu-item',onClick:function(){close(); printBatchCertificate(b)}},
              e('span',{className:'rm-icon'},Icon('printer',18)),
              e('span',null,'Print certificate')
            ),
            e('button',{className:'row-menu-item danger',onClick:function(){close(); removeBatchLocal(b.id)}},
              e('span',{className:'rm-icon'},Icon('trash',18)),
              e('span',null,'Remove batch')
            )
          )
        )
      );
    })()
  );
}

// ── Calendar Page ──
function CalendarPage(props){
  var ms = useState(new Date().getMonth());
  var month = ms[0], setMonth = ms[1];
  var ys = useState(new Date().getFullYear());
  var year = ys[0], setYear = ys[1];
  // `scheduled` lives in component state so handlers can re-render the page
  // immediately after add / mark-complete / remove. Re-pulled from
  // localStorage on every sync tick so a remote update from another device
  // shows up here too.
  var schState = useState(function(){return ls('scheduledBatches',[])});
  var scheduled = schState[0], setScheduled = schState[1];
  var syncTick = useSyncTick();
  useEffect(function(){
    if(syncTick > 0) setScheduled(ls('scheduledBatches',[]));
  },[syncTick]);
  var showAdd = useState(null);
  var addDay = showAdd[0], setAddDay = showAdd[1];

  function prevMonth(){
    if(month===0){setMonth(11);setYear(year-1)}
    else setMonth(month-1);
  }
  function nextMonth(){
    if(month===11){setMonth(0);setYear(year+1)}
    else setMonth(month+1);
  }

  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var prevDays = new Date(year, month, 0).getDate();
  var todayDate = new Date();
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  var cells = [];
  // Previous month
  for(var i = firstDay-1; i >= 0; i--){
    cells.push({day:prevDays-i,month:month-1,otherMonth:true});
  }
  // Current month
  for(var d = 1; d <= daysInMonth; d++){
    cells.push({day:d,month:month,otherMonth:false,isToday:d===todayDate.getDate()&&month===todayDate.getMonth()&&year===todayDate.getFullYear()});
  }
  // Next month
  var remaining = 42 - cells.length;
  for(var j = 1; j <= remaining; j++){
    cells.push({day:j,month:month+1,otherMonth:true});
  }

  function getEventsForDay(day,m){
    var dateStr = year+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    return scheduled.filter(function(s){return s.date===dateStr});
  }

  function addScheduledBatch(day){
    setAddDay(day);
  }

  return e('div',{className:'container'},
    e('div',{style:{fontSize:'16px',fontWeight:600,marginBottom:'10px'}},'Production Calendar'),
    e('div',{className:'cal-nav'},
      e('button',{className:'cal-nav-btn',onClick:prevMonth},'\u2039'),
      e('span',{className:'cal-month-label'},monthNames[month]+' '+year),
      e('button',{className:'cal-nav-btn',onClick:nextMonth},'\u203A')
    ),
    e('div',{className:'cal-month'},
      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){
        return e('div',{key:d,className:'cal-day-header'},d);
      }),
      cells.map(function(cell,i){
        var events = !cell.otherMonth ? getEventsForDay(cell.day, cell.month) : [];
        return e('div',{key:i,className:'cal-day'+(cell.otherMonth?' other-month':'')+(cell.isToday?' today':''),onClick:function(){if(!cell.otherMonth)addScheduledBatch(cell.day)}},
          e('div',{className:'cal-day-num'},cell.day),
          events.map(function(ev,j){
            return e('div',{key:j,className:'cal-event'},ev.recipeName || 'Batch');
          })
        );
      })
    ),

    // Add scheduled batch modal
    addDay ? e('div',{className:'modal-overlay',onClick:function(){setAddDay(null)}},
      e('div',{className:'modal',onClick:function(ev){ev.stopPropagation()}},
        e('div',{className:'modal-title'},
          e('span',null,'Schedule Batch \u2014 '+monthNames[month]+' '+addDay),
          e('button',{className:'modal-close',onClick:function(){setAddDay(null)}},'\u2715')
        ),
        e(ScheduleBatchForm,{date:year+'-'+String(month+1).padStart(2,'0')+'-'+String(addDay).padStart(2,'0'),onSave:function(batch){
          var next = (ls('scheduledBatches',[])).concat([batch]);
          lsSet('scheduledBatches', next);
          setScheduled(next);
          setAddDay(null);
          showToast('Batch scheduled');
        }})
      )
    ) : null,

    // Upcoming batches — show empty state when none scheduled so the page
    // doesn't feel half-finished when mum opens the calendar fresh.
    scheduled.length === 0 ? e('div',{style:{marginTop:'16px'}},
      EmptyState({
        iconName:'calendar',
        title:'No batches scheduled',
        message:'Tap a day above to plan a batch — handy for staggering big production days.'
      })
    ) : null,
    scheduled.length > 0 ? e('div',{style:{marginTop:'16px'}},
      e('div',{style:{fontSize:'14px',fontWeight:600,marginBottom:'8px'}},'Scheduled Batches'),
      scheduled.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).map(function(s){
        // Identify by `s.id` (assigned by ScheduleBatchForm via uid()), not
        // by index \u2014 the displayed list is sorted but localStorage isn't, so
        // a sort-mismatched index would mark/remove the wrong row.
        return e('div',{key:s.id||(s.recipeId+'_'+s.date),className:'batch-card'},
          e('div',{style:{display:'flex',justifyContent:'space-between'}},
            e('span',{className:'batch-product'},s.recipeName),
            e('span',{className:'batch-status '+(s.status||'planned')},s.status||'planned')
          ),
          e('div',{className:'batch-meta'},fmtDate(s.date)+' \u2022 '+(s.units||0)+' units'+(s.scent?' \u2022 '+s.scent:'')),
          e('div',{style:{marginTop:'4px'},className:'no-print'},
            e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px'},onClick:function(){
              // Run the same notes / units / scent prompts as a normal log,
              // pre-filled from this scheduled row. On success, mark the
              // scheduled entry completed too so it shades green in the list.
              markScheduledComplete(s).then(function(batch){
                if(!batch) return;
                var current = ls('scheduledBatches',[]);
                var next = current.map(function(item){
                  if(item.id !== s.id && !(item===s)) return item;
                  return Object.assign({}, item, {status:'completed'});
                });
                lsSet('scheduledBatches', next);
                setScheduled(next);
              });
            }},'Mark Complete'),
            e('button',{className:'tool-btn',style:{fontSize:'11px',padding:'4px 10px',marginLeft:'4px'},onClick:function(){
              var current = ls('scheduledBatches',[]);
              var next = current.filter(function(item){
                // Match by id where present; fall back to object identity for
                // legacy rows that pre-date the id field.
                if(s.id) return item.id !== s.id;
                return item !== s;
              });
              lsSet('scheduledBatches', next);
              if(s.id) recordTombstone('scheduledBatches', s.id);
              setScheduled(next);
              showToast('Removed');
            }},'Remove')
          )
        );
      })
    ) : null
  );
}

// ── Today's Workshop ──
// Print-friendly runsheet for a given day's scheduled batches. Mum
// prefers paper; this page is the paper version of her day, computed
// from the scheduled batches + recipes already in the app. Defaults
// to today's date but Heath can pick any day from the URL hash.
//
// Per-batch: ingredients × scale → grams needed.
// Aggregated: total grams per ingredient across the whole day +
// stock check (red if we'll run out, gold if cutting it close).
// Order: largest batch first to minimise re-cleaning between batches.
function TodayWorkshopPage(props){
  var dateState = useState(props.date || today());
  var date = dateState[0], setDate = dateState[1];
  var scheduled = ls('scheduledBatches',[]);
  var todays = scheduled.filter(function(s){return s.date === date && (s.status||'planned') !== 'completed'});
  var allRecipes = getAllRecipes();
  var stockData = ls('ingredientData',{});

  // Compute per-batch ingredient demand. scale = total grams / 100 (recipes
  // are 100g master). Ordered by total grams desc — biggest first.
  var rows = todays.map(function(s){
    var rec = allRecipes.find(function(r){return r.id===s.recipeId});
    var totalGrams = (s.units||0) * (s.fillWeight||50);
    var scale = totalGrams / 100;
    var ingredients = [];
    if(rec && rec.phases){
      rec.phases.forEach(function(phase){
        (phase.ingredients||[]).forEach(function(ing){
          if(!ing.name) return;
          var grams = (ing.grams||0) * scale;
          if(grams <= 0) return;
          ingredients.push({
            name: ing.name,
            phase: phase.letter || '',
            grams: grams,
            function: ing.function || ''
          });
        });
      });
    }
    return { sched:s, recipe:rec, totalGrams:totalGrams, scale:scale, ingredients:ingredients };
  }).sort(function(a,b){return b.totalGrams - a.totalGrams});

  // Aggregate ingredient demand across the whole day
  var demand = {};
  rows.forEach(function(r){
    r.ingredients.forEach(function(ing){
      var key = ing.name.toLowerCase();
      if(!demand[key]) demand[key] = { name: ing.name, grams: 0 };
      demand[key].grams += ing.grams;
    });
  });
  // Stock check: short = stock < demand, tight = stock < demand × 1.1
  var aggregateRows = Object.keys(demand).map(function(k){
    var item = demand[k];
    var ud = stockData[k] || {};
    var stock = (typeof ud.stock === 'number') ? ud.stock : null;
    var status = 'ok';
    if(stock !== null){
      if(stock < item.grams) status = 'short';
      else if(stock < item.grams * 1.1) status = 'tight';
    } else {
      status = 'unknown';
    }
    return { name: item.name, grams: item.grams, stock: stock, status: status };
  }).sort(function(a,b){return b.grams - a.grams});

  function statusBadge(status){
    if(status === 'short') return e('span',{className:'batch-status failed'},'Short');
    if(status === 'tight') return e('span',{style:{fontSize:'10px',padding:'2px 8px',borderRadius:'var(--radius-pill)',background:'var(--gold-soft)',color:'var(--gold)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}},'Tight');
    if(status === 'unknown') return e('span',{style:{fontSize:'10px',padding:'2px 8px',borderRadius:'var(--radius-pill)',background:'var(--bg-sunken)',color:'var(--text-muted)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}},'No data');
    return e('span',{className:'batch-status completed'},'OK');
  }

  function printRunbook(){ window.print(); }

  return e('div',{className:'container'},
    e('button',{className:'back-btn no-print',onClick:props.onBack},'← Back'),
    e('div',{style:{display:'flex',alignItems:'center',gap:'12px',marginBottom:'12px',flexWrap:'wrap'}},
      e('div',{style:{flex:1,minWidth:0}},
        e('div',{style:{fontSize:'18px',fontWeight:600}}, "Today's Workshop"),
        e('div',{style:{fontSize:'12px',color:'var(--text-muted)',marginTop:'2px'}},'Runsheet for '+fmtDate(date)+' · '+rows.length+' batch'+(rows.length===1?'':'es'))
      ),
      e('input',{type:'date',value:date,onChange:function(ev){setDate(ev.target.value)},className:'form-input no-print',style:{maxWidth:'180px'}}),
      e('button',{className:'tool-btn primary no-print',onClick:printRunbook}, Icon('printer',14), 'Print runsheet')
    ),

    rows.length === 0 ? EmptyState({
      iconName:'calendar',
      title:'Nothing scheduled',
      message:'No batches planned for ' + fmtDate(date) + '. Pick a different day or schedule something from the calendar.',
      action:{label:'Open calendar', onClick:function(){props.nav && props.nav('calendar')}}
    }) : null,

    // Aggregate demand summary — at the top so any shortfalls jump out
    rows.length > 0 ? e('div',{className:'card',style:{marginBottom:'12px'}},
      e('div',{className:'card-body',style:{padding:'14px'}},
        e('div',{style:{fontSize:'14px',fontWeight:600,marginBottom:'10px'}},'Ingredients needed today'),
        e('table',{className:'ing-table',style:{margin:0}},
          e('thead',null,
            e('tr',null,
              e('th',null,'Ingredient'),
              e('th',{className:'num'},'Need'),
              e('th',{className:'num'},'Stock'),
              e('th',null,'Status')
            )
          ),
          e('tbody',null,
            aggregateRows.map(function(r){
              return e('tr',{key:r.name},
                e('td',null,r.name),
                e('td',{className:'num'}, r.grams.toFixed(1) + 'g'),
                e('td',{className:'num',style:{color:r.status==='short'?'var(--red)':'var(--text)'}}, r.stock !== null ? r.stock.toFixed(0) + 'g' : '—'),
                e('td',null, statusBadge(r.status))
              );
            })
          )
        ),
        aggregateRows.some(function(r){return r.status==='short'}) ? e('div',{style:{fontSize:'12px',color:'var(--red)',marginTop:'10px'}},'⚠ At least one ingredient is short of today\'s demand. Top up before starting.') : null
      )
    ) : null,

    // Per-batch runsheet — largest first (heuristic: minimise re-cleaning)
    rows.map(function(row, i){
      var s = row.sched;
      return e('div',{key:s.id||i,className:'card',style:{marginBottom:'10px'}},
        e('div',{className:'card-body',style:{padding:'14px'}},
          e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'10px',marginBottom:'10px',flexWrap:'wrap'}},
            e('div',{style:{flex:1,minWidth:0}},
              e('div',{style:{fontSize:'11px',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.05em'}},'Batch ' + (i+1) + ' of ' + rows.length),
              e('div',{style:{fontSize:'15px',fontWeight:600,marginTop:'2px'}}, s.recipeName || 'Unknown recipe'),
              e('div',{style:{fontSize:'12px',color:'var(--text-muted)',marginTop:'2px'}},
                (s.units||0) + ' × ' + (s.fillWeight||50) + 'g = ' + row.totalGrams.toFixed(0) + 'g total' +
                (s.scent ? ' · scent: ' + s.scent : '')
              )
            ),
            row.recipe ? e('button',{className:'tool-btn primary no-print',onClick:function(){
              if(props.onStartProduction) props.onStartProduction(row.recipe);
            }}, Icon('play',14), 'Start') : null,
            !row.recipe ? e('span',{style:{fontSize:'12px',color:'var(--red)'}},'Recipe not found') : null
          ),
          row.ingredients.length > 0 ? e('table',{className:'ing-table',style:{margin:0}},
            e('thead',null,
              e('tr',null,
                e('th',null,'Phase'),
                e('th',null,'Ingredient'),
                e('th',{className:'num'},'Grams'),
                e('th',null,'Function')
              )
            ),
            e('tbody',null,
              row.ingredients.map(function(ing,j){
                return e('tr',{key:j},
                  e('td',{style:{fontFamily:'monospace',fontSize:'11px',color:'var(--text-muted)'}}, ing.phase || '—'),
                  e('td',null, ing.name),
                  e('td',{className:'num'}, ing.grams.toFixed(2)),
                  e('td',{style:{fontSize:'11px',color:'var(--text-muted)'}}, ing.function)
                );
              })
            )
          ) : e('div',{style:{fontSize:'12px',color:'var(--text-muted)',fontStyle:'italic'}},'No ingredient data on this recipe.')
        )
      );
    })
  );
}

// ── Notifications Card (Web Push) ──
// Lives in Settings. Lets the user enable browser/phone push notifications.
// State machine: 'unsupported' → device doesn't have push (e.g., old Safari)
//                'no-shopify' → worker URL/HMAC not configured yet
//                'denied' → user clicked Block on the permission prompt
//                'off' → supported but not subscribed
//                'on' → subscribed, has clientId, ready to receive pushes
function NotificationsCard(props){
  var s = useState('checking');
  var status = s[0], setStatus = s[1];
  var es = useState(null);
  var err = es[0], setErr = es[1];
  var bs = useState(false);
  var busy = bs[0], setBusy = bs[1];

  function refreshStatus(){
    if(!pushSupported()) { setStatus('unsupported'); return; }
    if(!shopifyConfigured()) { setStatus('no-shopify'); return; }
    if(Notification.permission === 'denied') { setStatus('denied'); return; }
    var clientId = ls('pushClientId', null);
    if(clientId && Notification.permission === 'granted'){
      // Verify a real subscription exists in the browser
      if(navigator.serviceWorker.getRegistration){
        navigator.serviceWorker.getRegistration().then(function(reg){
          if(reg) reg.pushManager.getSubscription().then(function(sub){
            setStatus(sub ? 'on' : 'off');
          });
          else setStatus('off');
        });
      } else setStatus('on');
      return;
    }
    setStatus('off');
  }
  useEffect(refreshStatus, []);

  async function handleEnable(){
    setBusy(true); setErr(null);
    try{
      await pushSubscribe();
      showToast('Notifications enabled');
      refreshStatus();
    } catch(e){
      console.warn('subscribe failed', e);
      setErr(e && e.message ? e.message : String(e));
    } finally { setBusy(false); }
  }
  async function handleTest(){
    setBusy(true); setErr(null);
    try{
      var res = await pushTest();
      if(res && res.ok) showToast('Push sent — check your phone');
      else if(res && res.dropped) { showToast('Subscription expired — re-enabling'); refreshStatus(); }
      else setErr(res && res.reason ? res.reason : 'Push test failed');
    } catch(e){
      setErr(e && e.message ? e.message : String(e));
    } finally { setBusy(false); }
  }
  async function handleDisable(){
    if(!await dialogConfirm('Turn off notifications?','You won\'t get pings until you re-enable.',{confirmLabel:'Turn off'})) return;
    setBusy(true); setErr(null);
    try{
      await pushUnsubscribe();
      showToast('Notifications turned off');
      refreshStatus();
    } catch(e){
      setErr(e && e.message ? e.message : String(e));
    } finally { setBusy(false); }
  }

  var statusLine, statusColor, primaryBtn;
  if(status === 'unsupported'){
    statusLine = 'Your browser doesn\'t support push notifications.';
    statusColor = 'var(--text-muted)';
  } else if(status === 'no-shopify'){
    statusLine = 'Set up Shopify Integration above first — notifications use the same worker.';
    statusColor = 'var(--text-muted)';
    // Give the user a clear next step instead of a dead-end sentence.
    primaryBtn = e('button',{className:'tool-btn',onClick:function(){
      var card = document.querySelector('[data-tut="cloud-sync"]') || document.querySelector('.card');
      // Scroll to the Shopify Integration section title — find by text.
      var allCards = document.querySelectorAll('.card');
      for(var i = 0; i < allCards.length; i++){
        var t = allCards[i].textContent || '';
        if(t.indexOf('Shopify Integration') >= 0){ card = allCards[i]; break; }
      }
      if(card && card.scrollIntoView) card.scrollIntoView({behavior:'smooth', block:'start'});
    }}, 'Open Shopify card');
  } else if(status === 'denied'){
    statusLine = 'You\'ve blocked notifications in this browser. Re-enable them in your browser\'s site settings, then come back.';
    statusColor = 'var(--red)';
  } else if(status === 'on'){
    statusLine = '✓ On — this device will get pings when batches need releasing, stock runs low, or orders come in.';
    statusColor = 'var(--green)';
    primaryBtn = e('button',{className:'tool-btn',onClick:handleTest,disabled:busy,style:{marginRight:'8px'}}, busy?'…':'Send test');
  } else if(status === 'off' || status === 'checking'){
    statusLine = 'Off — turn this on to get pings on this device.';
    statusColor = 'var(--text-muted)';
    primaryBtn = e('button',{className:'tool-btn primary',onClick:handleEnable,disabled:busy,style:{marginRight:'8px'}}, busy?'…':'Enable');
  }

  return e('div',{className:'card'},
    e('div',{className:'card-body',style:{padding:'16px'}},
      e('div',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'14px',fontWeight:600,marginBottom:'4px'}},
        e('span',{style:{color:'var(--text-muted)',display:'flex'}},Icon('bell',18)),
        'Notifications'),
      e('div',{style:{fontSize:'12px',color:'var(--text-muted)',marginBottom:'10px'}},'Get pinged on this device when something needs your attention.'),
      e('div',{style:{fontSize:'12px',color:statusColor,marginBottom:'10px',lineHeight:1.5}},statusLine),
      err ? e(ErrorCard,{title:'Notifications hiccup',message:err}) : null,
      e('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px'}},
        primaryBtn,
        status === 'on' ? e('button',{className:'tool-btn',onClick:handleDisable,disabled:busy}, busy?'…':'Turn off') : null
      )
    )
  );
}

// Strip section.html \u2192 plain text (keeps line breaks where useful)
function _sectionText(html){
  if(!html) return '';
  return String(html)
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/p>/gi,'\n')
    .replace(/<li[^>]*>/gi,'\u2022 ')
    .replace(/<\/li>/gi,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')
    .replace(/&nbsp;/g,' ').replace(/&#39;/g,"'").replace(/&quot;/g,'"')
    .replace(/[ \t]+/g,' ')
    .replace(/\n[ \t]+/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

// Pull the block matching `scentName` out of a multi-scent text section.
// Recipe INCI / Allergen sections often pack every scent variant into one
// section as `Option 1 — Lavender Calm` headers followed by the per-scent
// list. When the active scent matches one of those headers, return just
// that block. Falls back to the full text if:
//   - The text has no recognisable Option/scent headers (single-scent recipe)
//   - We can't find the requested scent name
function _extractScentBlock(fullText, scentName){
  if(!fullText) return '';
  if(!scentName) return fullText;
  // Try to detect "Option N — Name" headers (em-dash, en-dash, hyphen).
  // Matches at the start of a line; greedy across multiple options.
  var headerRe = /(^|\n)\s*Option\s*\d+\s*[—–\-:]\s*([^\n]+)/gi;
  var matches = [];
  var m;
  while((m = headerRe.exec(fullText)) !== null){
    matches.push({ name: (m[2]||'').trim(), start: m.index + m[0].indexOf('Option') });
  }
  if(matches.length < 2) return fullText; // single block or no headers — nothing to split
  // Find the scent that matches by case-insensitive substring match either way.
  var lcScent = scentName.toLowerCase();
  var hit = matches.find(function(x){
    var lcName = x.name.toLowerCase();
    return lcName === lcScent || lcName.indexOf(lcScent) >= 0 || lcScent.indexOf(lcName) >= 0;
  });
  if(!hit) return fullText;
  // Slice from this header to the next one (or end).
  var hitIdx = matches.indexOf(hit);
  var nextStart = hitIdx + 1 < matches.length ? matches[hitIdx + 1].start : fullText.length;
  return fullText.slice(hit.start, nextStart).trim();
}

// Find the INCI list in a recipe's sections (case-insensitive). When a
// scentName is provided AND the section contains multiple "Option N —"
// blocks, returns just the matching scent's block.
function _extractINCI(recipe, scentName){
  if(!recipe || !recipe.sections) return '';
  // Match by category=='inci' first, then by title containing "INCI"
  var sec = recipe.sections.find(function(s){return s.category==='inci'});
  if(!sec) sec = recipe.sections.find(function(s){return s.title && /\binci\b/i.test(s.title)});
  if(!sec) sec = recipe.sections.find(function(s){return s.title && /ingredient/i.test(s.title)});
  if(!sec) return '';
  return _extractScentBlock(_sectionText(sec.html), scentName);
}

// Find allergen disclosure. Same per-scent slicing as _extractINCI.
function _extractAllergens(recipe, scentName){
  if(!recipe || !recipe.sections) return '';
  var sec = recipe.sections.find(function(s){return s.title && /allerg/i.test(s.title)});
  if(!sec) return '';
  return _extractScentBlock(_sectionText(sec.html), scentName);
}

// Map each recipe to one or more Shopify products. Configure batch prefix
// and curing/release behaviour per recipe. Phase 1 surface; bundle support
// comes in a follow-on phase.
function ShopifyMappingPage(props){
  var ps = useState([]);
  var products = ps[0], setProducts = ps[1];
  var ms = useState(ls('shopifyMappings',{}));
  var mappings = ms[0], setMappings = ms[1];
  var lstate = useState({state:'idle'});
  var loadState = lstate[0], setLoadState = lstate[1];
  var es = useState(null);
  var editingRecipeId = es[0], setEditingRecipeId = es[1];

  function loadProducts(){
    if(!shopifyConfigured()){
      setLoadState({state:'unconfigured'});
      return;
    }
    setLoadState({state:'loading'});
    shopifyFetch('/shopify/products?limit=250').then(function(data){
      setProducts(data.products || []);
      setLoadState({state:'loaded', count: (data.products||[]).length});
    }).catch(function(err){
      setLoadState({state:'error', message: err.message});
    });
  }
  useEffect(loadProducts, []);

  function persistMappings(next){
    setMappings(next);
    lsSet('shopifyMappings', next);
  }
  function saveRecipeMapping(recipeId, mapping){
    var next = Object.assign({}, mappings);
    next[recipeId] = mapping;
    persistMappings(next);
    showToast('Mapping saved');
    setEditingRecipeId(null);
  }
  function clearRecipeMapping(recipeId){
    var next = Object.assign({}, mappings);
    delete next[recipeId];
    persistMappings(next);
    showToast('Mapping cleared');
    setEditingRecipeId(null);
  }
  function defaultPrefix(name){
    return (name||'').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase() || 'PRD';
  }

  var allRecipes = getAllRecipes();
  var productsById = {};
  products.forEach(function(p){ productsById[p.id] = p; });

  return e('div',{className:'container'},
    e('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}},
      e('button',{className:'tool-btn',onClick:function(){props.onBack && props.onBack()}},'← Back'),
      e('div',{style:{fontSize:'16px',fontWeight:600}},'Shopify Mapping')
    ),

    loadState.state==='unconfigured' ? e(ErrorCard,{
      title:'Shopify not configured',
      message:'Open Settings → Shopify Integration first.'
    }) : null,

    loadState.state==='loading' ? e('div',{className:'card'},
      e('div',{className:'card-body',style:{padding:'var(--space-4)'}},
