        step < total - 1 ?
          e('button',{onClick:goNext,style:{
            flex:1,padding:'11px',borderRadius:'12px',fontSize:'13px',fontWeight:700,
            cursor:'pointer',background:'var(--gold)',border:'none',color:'#1a1a1a'
          }},'Next \u2192')
        :
          e('button',{onClick:exit,style:{
            flex:1,padding:'11px',borderRadius:'12px',fontSize:'13px',fontWeight:700,
            cursor:'pointer',background:'var(--gold)',border:'none',color:'#1a1a1a'
          }},'\u2714 Done')
      )
    )
  );
}

// ============================================================
// APP ROOT
// ============================================================
function App(){
  var ps = useState('dashboard');
  var page = ps[0], setPage = ps[1];
  var rs = useState(null);
  var selectedRecipe = rs[0], setSelectedRecipe = rs[1];
  var pr = useState(null);
  var prodRecipe = pr[0], setProdRecipe = pr[1];
  var _pr = useState(ls('activeProfile','Heath'));
  var profile = _pr[0], setProfileState = _pr[1];
  var _tut = useState(null);
  var tutorialMode = _tut[0], setTutorialMode = _tut[1];
  // First-run onboarding — renders the wizard if onboardingDone isn't
  // set in localStorage. We check ONCE on mount; the user can dismiss
  // it and we stamp the flag so it never re-fires.
  var _ob = useState(function(){return !ls('onboardingDone', null)});
  var showOnboarding = _ob[0], setShowOnboarding = _ob[1];
  var _lc = useState({recipeId:null, batchId:null});
  var _labelCtx = _lc[0], setLabelCtx = _lc[1];

  function openLabels(opts){
    setLabelCtx({recipeId: opts && opts.recipeId, batchId: opts && opts.batchId});
    setPage('labels');
    window.scrollTo(0,0);
  }

  // Global search modal state
  var _gs = useState(false);
  var searchOpen = _gs[0], setSearchOpen = _gs[1];

  // Workshop mode + dark mode on load
  useEffect(function(){
    if(ls('workshopMode',false)) document.body.classList.add('workshop');
    if(ls('darkMode',false)) document.body.classList.add('dark');
  },[]);

  // Auto-sync on load + start collab polling. If workspace is locked
  // (encrypted PAT, no session cache yet), prompt for the passphrase first.
  useEffect(function(){
    if(sessionStorage.getItem('gecko_justSynced')){
      sessionStorage.removeItem('gecko_justSynced');
    }
    var config=ls('syncConfig',null);
    if(!config || !config.gistId) return function(){stopCollabPolling()};

    function startSync(){
      if(!sessionStorage.getItem('gecko_justSynced')){
        doFullSync(true).then(function(){
          startCollabPolling();
          window.dispatchEvent(new CustomEvent('gecko-sync-update'));
        });
      } else {
        startCollabPolling();
      }
    }

    if(getActivePAT()){
      startSync();
    } else if(config.encrypted){
      // Locked — prompt for passphrase
      unlockPAT().then(function(token){
        if(token) startSync();
      });
    }
    return function(){stopCollabPolling()};
  },[]);

  // Listen for sync updates to force re-render
  var _syncTick=useState(0);
  var syncTick=_syncTick[0],setSyncTick=_syncTick[1];
  useEffect(function(){
    function onSyncUpdate(){setSyncTick(function(t){return t+1})}
    function onOpenRecipe(ev){
      var r = ev.detail || window._geckoOpenRecipe;
      if(r){ setSelectedRecipe(r); setPage('detail'); window.scrollTo(0,0); }
    }
    window.addEventListener('gecko-sync-update',onSyncUpdate);
    window.addEventListener('gecko-open-recipe',onOpenRecipe);
    // 1Hz countdown tick — only re-renders when actually cooling down,
    // otherwise the cheap isSyncCooldown() check returns immediately.
    var iv = setInterval(function(){
      if(typeof isSyncCooldown==='function' && isSyncCooldown()){
        setSyncTick(function(t){return t+1});
      }
    }, 1000);
    return function(){
      window.removeEventListener('gecko-sync-update',onSyncUpdate);
      window.removeEventListener('gecko-open-recipe',onOpenRecipe);
      clearInterval(iv);
    };
  },[]);

  function nav(p){setPage(p);setSelectedRecipe(null);setProdRecipe(null);window.scrollTo(0,0)}

  function selectRecipe(r){setSelectedRecipe(r);setPage('detail');window.scrollTo(0,0)}

  function duplicateRecipe(recipe){
    // Pick the latest version's content (so duplicate captures user edits, not the bundled original)
    var latestVer = ls('recipeVersions_'+recipe.id, []).slice(-1)[0];
    var srcPhases = latestVer ? latestVer.phases : recipe.phases;
    var srcSections = latestVer ? latestVer.sections : recipe.sections;
    var srcName = latestVer ? latestVer.name : recipe.name;
    dialogPrompt('Duplicate recipe', srcName + ' (copy)', {
      body:'Creates a fresh copy you can edit independently. Your original recipe stays unchanged.',
      placeholder:'New recipe name',
      confirmLabel:'Duplicate'
    }).then(function(newName){
      if(!newName || !newName.trim()) return;
      var copy = {
        id: uid(),
        name: newName.trim(),
        phases: JSON.parse(JSON.stringify(srcPhases||[])),
        scentProfiles: JSON.parse(JSON.stringify(recipe.scentProfiles||[])),
        sections: JSON.parse(JSON.stringify(srcSections||[])),
        batchSize: recipe.batchSize || 100,
        format: recipe.format || '',
        shelfLife: recipe.shelfLife || '12 months',
        ifraCategory: recipe.ifraCategory || '',
        category: recipe.category || '',
        productLine: recipe.productLine || '',
        targetRRP: recipe.targetRRP || '',
        totalIngredients: recipe.totalIngredients || 0,
        qcItems: recipe.qcItems ? recipe.qcItems.slice() : [],
        version: 'V1.0',
        duplicatedFrom: recipe.id,
        duplicatedAt: new Date().toISOString()
      };
      // Re-uid all nested ids so edits don't bleed back to the original
      (copy.phases||[]).forEach(function(p){
        p.id = uid();
        (p.ingredients||[]).forEach(function(ing){ ing.id = uid(); });
      });
      var ur = ls('userRecipes', []);
      ur.push(copy);
      lsSet('userRecipes', ur);
      logActivity('duplicated recipe', recipe.name+' → '+copy.name);
      showToast('"'+copy.name+'" created');
      setSelectedRecipe(copy);
      setPage('detail');
      window.scrollTo(0,0);
    });
  }

  function deleteRecipe(recipe){
    dialogConfirm('Delete "'+recipe.name+'"?','It will be moved to Trash with all its versions and notes, and can be restored within 30 days.',{confirmLabel:'Delete',danger:true}).then(function(ok){
      if(!ok) return;
      var isUserRecipe = ls('userRecipes',[]).some(function(r){return r.id===recipe.id});
      // Snapshot everything to trash before removing
      if(typeof trashAdd==='function'){
        trashAdd('recipe',{
          recipe:recipe,
          isUserRecipe:isUserRecipe,
          versions:ls('recipeVersions_'+recipe.id,[]),
          edits:ls('recipeEdits_'+recipe.id,null),
          notes:ls('notes_'+recipe.id,[])
        });
      }
      if(isUserRecipe){
        var ur = ls('userRecipes',[]).filter(function(r){return r.id!==recipe.id});
        lsSet('userRecipes',ur);
        recordTombstone('userRecipes', recipe.id);
      } else {
        var del = ls('deletedRecipes',[]);
        if(del.indexOf(recipe.id)===-1) del.push(recipe.id);
        lsSet('deletedRecipes',del);
      }
      localStorage.removeItem('recipeVersions_'+recipe.id);
      localStorage.removeItem('recipeEdits_'+recipe.id);
      localStorage.removeItem('notes_'+recipe.id);
      showToast('"'+recipe.name+'" moved to Trash');
      logActivity('deleted recipe',recipe.name);
      nav('recipes');
    });
  }

  function startProduction(r){setProdRecipe(r);setPage('production');window.scrollTo(0,0)}

  // Pull-to-refresh handler — wired into the PullToRefresh wrappers around
  // Recipes / Ingredients / Batches list pages. If cloud sync is set up,
  // forces a doFullSync; otherwise just bumps the syncTick so memoized
  // data re-reads. Returns a Promise so the indicator can spin until it
  // resolves.
  function _doPullRefresh(){
    showToast('Refreshing…');
    var cfg = ls('syncConfig', null);
    var syncReady = !!(cfg && cfg.pat && cfg.gistId) && typeof doFullSync === 'function';
    var op = syncReady ? doFullSync(true) : Promise.resolve('local');
    return Promise.resolve(op).then(function(s){
      window.dispatchEvent(new CustomEvent('gecko-sync-update'));
      if(s === 'error') showToast('Refresh failed');
      else if(s === 'cooldown' || s === 'locked') showToast(s === 'locked' ? 'Workspace is locked' : 'Sync paused — wait for cooldown');
      else showToast('Up to date');
    }).catch(function(e){
      console.warn('pull refresh failed', e);
      showToast('Refresh failed');
    });
  }

  // Persist an already-completed batch (no prompts). Used by both the
  // single-batch logBatch flow AFTER prompts resolve, and the multi-batch
  // walkthrough handler which prompts ONCE and loops here. Pass the
  // merged recipe explicitly so callers using a fresher version (e.g.
  // RecipeDetail mid-edit) get the right INCI on the public page.
  function persistLoggedBatch(batch, recipe){
    var rec = recipe || selectedRecipe || (batch.recipeId ? getAllRecipes().find(function(r){return r.id===batch.recipeId}) : null);
    // Snapshot total cost at log time so the recipe page can later show
    // unit-cost trends even if ingredient prices change. Cheap if data
    // is available; harmless 0 otherwise.
    if(rec && (typeof computeRecipeCost === 'function')){
      try {
        var scale = (batch.unitsProduced * (batch.containerSize||50)) / (rec.batchSize||100);
        var cost = computeRecipeCost(rec, scale, batch.unitsProduced || 1);
        batch.totalCost = cost && typeof cost.totalCost === 'number' ? cost.totalCost : 0;
      } catch(_){ batch.totalCost = 0 }
    }
    // Stamp the latest recipe-version label so audits show what was made
    if(rec){
      var versions = ls('recipeVersions_'+rec.id, []);
      var latest = versions.length > 0 ? versions[versions.length-1] : null;
      batch.recipeVersion = latest ? latest.versionNumber : (rec.version || 'V1.0');
    }
    batch.loggedAt = batch.loggedAt || Date.now();
    var stockOp = (typeof deductStockForBatch === 'function')
      ? deductStockForBatch(batch, rec)
      : Promise.resolve(true);
    return Promise.resolve(stockOp).then(function(go){
      if(go === false) return false;
      var logs = ls('batchLogs',[]);
      logs.push(batch);
      lsSet('batchLogs', logs);
      logActivity('logged batch', '#'+batch.batchNumber+' of '+(rec ? rec.name : ''));
      if(typeof enqueueBatchToShopify === 'function') enqueueBatchToShopify(batch, rec);
      if(typeof publishBatchPublic === 'function') publishBatchPublic(batch, rec);
      return true;
    });
  }

  function logBatch(batch, recipeOverride){
    var notesStep;
    if(!batch.notes && !batch._notesHandled){
      notesStep = dialogPrompt('Production notes (optional)','',{multiline:true,placeholder:'e.g. used a touch more beeswax due to summer temps'});
    } else {
      notesStep = Promise.resolve(batch.notes||null);
    }
    notesStep.then(function(notes){
      if(notes !== null && notes !== undefined && !batch.notes) batch.notes = notes || '';
      delete batch._notesHandled;
      return dialogPrompt('Units produced','10',{inputType:'number',body:'How many finished units came out of this batch?'});
    }).then(function(units){
      if(units === null) return null;
      var rec = recipeOverride || (batch.recipeName ? getAllRecipes().find(function(r){return r.id===batch.recipeId}) : null);
      if(rec && rec.scentProfiles && rec.scentProfiles.length > 0){
        return dialogPrompt('Scent variant', rec.scentProfiles[0].name, {body:'Which scent did you make?'}).then(function(scent){
          // Cancel from the scent prompt aborts the log entirely (was previously
          // saving an empty-scent batch on cancel).
          if(scent === null) return null;
          return {units:units, scent:scent};
        });
      }
      return {units:units, scent:''};
    }).then(function(result){
      if(!result) return;
      batch.unitsProduced = parseInt(result.units) || 0;
      batch.scent = result.scent;
      var rec = recipeOverride || selectedRecipe;
      batch.expiryDate = addMonths(today(), parseShelfMonths(rec ? rec.shelfLife : '12 months'));
      persistLoggedBatch(batch, rec).then(function(ok){
        if(ok) showToast('Batch '+batch.batchNumber+' logged!');
      });
    });
  }

  function removeBatch(batchId){
    dialogConfirm('Remove batch?','It will be moved to Trash and can be restored within 30 days.',{confirmLabel:'Remove',danger:true}).then(function(ok){
      if(!ok) return;
      var logs = ls('batchLogs',[]);
      var removed = logs.find(function(b){return b.id===batchId});
      if(typeof trashAdd==='function' && removed) trashAdd('batch',removed);
      logs = logs.filter(function(b){return b.id !== batchId});
      lsSet('batchLogs',logs);
      showToast('Batch moved to Trash');
    });
  }

  // Render page
  var content;
  if(page === 'production' && prodRecipe){
    content = e(ProductionWalkthrough,{recipe:prodRecipe,onBack:function(){setPage('detail');setProdRecipe(null);window.scrollTo(0,0)},onLogBatch:function(r,batchNotes,prodBatchId,batchCount){
      // Multi-batch mode: prompt for units + scent ONCE, then apply
      // those values to N batch rows in a single transaction. Earlier
      // version called logBatch() in a loop — every iteration tried to
      // open its own dialog, only one could be visible at a time, and
      // N-1 batches silently dropped.
      var count = Math.max(1, parseInt(batchCount,10) || 1);
      // Single-batch path keeps the existing flow (prompts in logBatch).
      if(count <= 1){
        var batch = {id:prodBatchId||uid(),batchNumber:genBatchNum(r.name),recipeId:r.id,recipeName:r.name,scent:'',batchSizeGrams:0,unitsProduced:0,containerSize:0,date:today(),qcResults:[],notes:batchNotes||'',_notesHandled:true,status:'completed',author:ls('activeProfile','Heath'),expiryDate:''};
        // Pass the merged recipe through so publishBatchPublic + Shopify
        // queue see fresh INCI / sections for in-progress edits.
        logBatch(batch, r);
        // Save the per-recipe production note once
        if(batchNotes && batchNotes.trim()){
          var nKey1 = 'notes_'+r.id;
          var notes1 = ls(nKey1,[]);
          notes1.push({id:uid(),text:'[Batch '+batch.batchNumber+'] '+batchNotes.trim(),date:today(),author:ls('activeProfile','Heath')});
          lsSet(nKey1,notes1);
        }
        setPage('detail');setProdRecipe(null);
        return;
      }
      // Multi-batch: prompt once, persist N times, no second dialog flash.
      dialogPrompt('Units per batch','10',{inputType:'number',body:'You\'re logging '+count+' batches. How many finished units came out of EACH one?'}).then(function(units){
        if(units === null) return null;
        if(r.scentProfiles && r.scentProfiles.length > 0){
          return dialogPrompt('Scent variant', r.scentProfiles[0].name, {body:'Which scent did you make for all '+count+' batches?'}).then(function(scent){
            if(scent === null) return null;
            return {units:units, scent:scent};
          });
        }
        return {units:units, scent:''};
      }).then(function(result){
        if(!result) return;
        var unitsN = parseInt(result.units, 10) || 0;
        var scentName = result.scent || '';
        var firstBatchNum = null;
        var ops = [];
        for(var n = 0; n < count; n++){
          var idForRow = (n === 0 && prodBatchId) ? prodBatchId : uid();
          var batchN = {
            id: idForRow,
            batchNumber: genBatchNum(r.name),
            recipeId: r.id, recipeName: r.name,
            scent: scentName,
            batchSizeGrams: 0,
            unitsProduced: unitsN,
            containerSize: 0,
            date: today(),
            qcResults: [],
            notes: batchNotes || '',
            status: 'completed',
            author: ls('activeProfile','Heath'),
            expiryDate: addMonths(today(), parseShelfMonths(r.shelfLife || '12 months'))
          };
          if(n === 0) firstBatchNum = batchN.batchNumber;
          ops.push(persistLoggedBatch(batchN, r));
        }
        Promise.all(ops).then(function(){
          if(batchNotes && batchNotes.trim()){
            var nKey = 'notes_'+r.id;
            var existingNotes = ls(nKey,[]);
            var label = count > 1 ? 'Batches ' + firstBatchNum + ' ×' + count : 'Batch ' + firstBatchNum;
            existingNotes.push({id:uid(),text:'['+label+'] '+batchNotes.trim(),date:today(),author:ls('activeProfile','Heath')});
            lsSet(nKey,existingNotes);
          }
          showToast('Logged ' + count + ' batches');
          setPage('detail');setProdRecipe(null);
        });
      });
    }});
  } else if(page === 'detail' && selectedRecipe){
    content = e(RecipeDetail,{recipe:selectedRecipe,onBack:function(){nav('recipes')},onLogBatch:logBatch,onUpdateRecipe:function(){},onStartProduction:startProduction,onDelete:deleteRecipe,onDuplicate:duplicateRecipe,onLabels:function(r){openLabels({recipeId:r.id})}});
  } else if(page === 'recipes'){
    content = e(PullToRefresh,{onRefresh:_doPullRefresh}, e(RecipeList,{onSelect:selectRecipe,nav:nav}));
  } else if(page === 'ingredients'){
    content = e(PullToRefresh,{onRefresh:_doPullRefresh}, e(IngredientsPage,{onSelectRecipe:selectRecipe}));
  } else if(page === 'batches'){
    content = e(PullToRefresh,{onRefresh:_doPullRefresh}, e(BatchesPage,{onLabels:openLabels}));
  } else if(page === 'calendar'){
    content = e(CalendarPage,{});
  } else if(page === 'addRecipe'){
    content = e(AddRecipePage,{onBack:function(){nav('recipes')},onSelectRecipe:selectRecipe});
  } else if(page === 'settings'){
    content = e(SettingsPage,{nav:nav,onStartTutorial:function(mode){setTutorialMode(mode)}});
  } else if(page === 'bundles'){
    content = e(BundlesPage,{onBack:function(){nav('settings')}});
  } else if(page === 'shopify-mapping'){
    content = e(ShopifyMappingPage,{onBack:function(){nav('settings')}});
  } else if(page === 'trash'){
    content = e(TrashPage,{onBack:function(){nav('settings')}});
  } else if(page === 'worker-calls'){
    content = e(WorkerCallsPage,{onBack:function(){nav('settings')}});
  } else if(page === 'activity-feed'){
    content = e(ActivityFeedPage,{onBack:function(){nav('settings')}});
  } else if(page === 'today-workshop'){
    content = e(TodayWorkshopPage,{
      onBack:function(){nav('dashboard')},
      nav:nav,
      onStartProduction:function(rec){selectRecipe(rec); setTimeout(function(){
        // Match the existing Produce flow — set prodRecipe + page='production'
        setProdRecipe(rec);
        setPage('production');
        window.scrollTo(0,0);
      },0)}
    });
  } else if(page === 'labels'){
    content = e(LabelExportPage,{onBack:function(){nav('batches')},recipeId:_labelCtx.recipeId,batchId:_labelCtx.batchId});
  } else {
    content = e(Dashboard,{nav:nav,onSelectRecipe:selectRecipe});
  }

  return e('div',null,
    // First-run onboarding — sits in front of everything until dismissed
    showOnboarding ? e(OnboardingWizard,{
      onClose:function(){setShowOnboarding(false)},
      onStartTutorial:function(mode){setTutorialMode(mode)}
    }) : null,
    // Tutorial overlay (renders ON TOP of the real app)
    tutorialMode ? e(TutorialOverlay,{
      mode:tutorialMode,
      onExit:function(){setTutorialMode(null);nav('settings')},
      onNav:function(p){setPage(p);setSelectedRecipe(null);setProdRecipe(null);window.scrollTo(0,0)},
      onSelectRecipe:function(r){setSelectedRecipe(r);setPage('detail');window.scrollTo(0,0)},
      onStartProduction:function(r){setProdRecipe(r);setPage('production');window.scrollTo(0,0)}
    }) : null,
    // Header
    e('div',{className:'app-header'},
      e('div',null,
        e('h1',null,'BatchFlow'),
        e('div',{className:'subtitle'},'Production Demo')
      ),
      e('span',{style:{display:'flex',alignItems:'center',gap:'8px'}},
        e('button',{className:'gs-trigger',onClick:function(){setSearchOpen(true)},title:'Search (recipes, batches, sales, notes)','aria-label':'Search'},Icon('search',18)),
        (function(){
          if(!ls('syncConfig',null)) return null;
          var status = ls('syncStatus','ok');
          var cooling = isSyncCooldown();
          var remaining = cooling ? syncCooldownRemainingSec() : 0;
          var color = cooling ? '#FF9800' :
                      (status==='ok' ? '#4CAF50' :
                       status==='offline' ? '#9B8B7A' :
                       status==='auth-error' ? '#F44336' : '#FF9800');
          var label, tip;
          if(cooling){
            var mm = Math.floor(remaining/60), ss = remaining%60;
            var txt = mm>0 ? mm+':'+String(ss).padStart(2,'0') : ss+'s';
            label = '☁ ' + txt;
            tip = 'Sync paused — too many changes. Resuming in ' + txt + '.';
          } else if(status==='offline'){
            label = '☁ offline';
            tip = 'Offline — sync will resume when you\'re reconnected.';
          } else if(status==='auth-error'){
            label = '☁ ✕';
            tip = 'Sync token rejected — open Settings to fix.';
          } else {
            var n = getOnlineUsers().length;
            label = n>1 ? '☁ '+n : '☁';
            tip = 'Sync active — ' + n + ' online';
          }
          return e('span',{
            style:{fontSize:'10px',color:color,cursor:'pointer',fontVariantNumeric:'tabular-nums'},
            title:tip,
            onClick:function(){setPage('settings')}
          }, label);
        })(),
        e('button',{'data-tut':'profile-btn',className:'profile-btn',onClick:function(){
          var profiles = ls('profiles',['Heath','Kendal']);
          var current = ls('activeProfile','Heath');
          var idx = profiles.indexOf(current);
          var next = profiles[(idx+1)%profiles.length];
          lsSet('activeProfile',next);
          setProfileState(next);logActivity('switched profile','to '+next);
          showToast('Switched to '+next);
        }},profile)
      )
    ),

    content,

    // Dialog host (renders modals on top of everything)
    e(DialogHost),

    // Global search modal
    searchOpen ? e(GlobalSearch,{
      onClose: function(){setSearchOpen(false)},
      onSelectRecipe: function(r){setSelectedRecipe(r);setPage('detail');window.scrollTo(0,0)},
      onNav: function(p){nav(p)}
    }) : null,

    // Toast
    e('div',{id:'toast',className:'toast',style:{display:'none'},role:'status','aria-live':'polite','aria-atomic':'true'}),

    // Bottom Nav
    e('div',{className:'bottom-nav no-print'},
      [{id:'dashboard',icon:'home',label:'Home'},
       {id:'recipes',icon:'clipboard',label:'Recipes'},
       {id:'ingredients',icon:'flask',label:'Ingredients'},
       {id:'calendar',icon:'calendar',label:'Calendar'},
       {id:'batches',icon:'package',label:'Batches'},
       {id:'settings',icon:'settings',label:'Settings'}
      ].map(function(t){
        var isActive = page === t.id || (t.id==='recipes' && (page==='detail'||page==='addRecipe'));
        return e('button',{key:t.id,className:'nav-tab'+(isActive?' active':''),onClick:function(){nav(t.id)},'aria-current':isActive?'page':undefined,'aria-label':t.label},
          e('span',{className:'nav-icon'},Icon(t.icon,22)),
          e('span',null,t.label)
        );
      })
    )
  );
}


// ============================================================

// public showcase can never reach a real account, gist, Shopify
// store, R2 bucket, or push subscription.
// ============================================================
if (typeof DEMO_MODE !== 'undefined' && DEMO_MODE) {
  // Cloud sync — no-op
  if (typeof cloudPush === 'function') cloudPush = function(){ return Promise.resolve('demo'); };
  if (typeof cloudPull === 'function') cloudPull = function(){ return Promise.resolve(null); };

  if (typeof doFullSync === 'function') doFullSync = function(){ return Promise.resolve('demo'); };
  if (typeof scheduleSyncPush === 'function') scheduleSyncPush = function(){};
  if (typeof startCollabPolling === 'function') startCollabPolling = function(){};
  if (typeof stopCollabPolling === 'function') stopCollabPolling = function(){};

  // Shopify API — return canned data matching the real Worker shapes so
  // the dashboard charts (Shopify card + Trends sparklines) populate with
  // believable numbers. Inventory velocity returns empty so the ingredient
  // demand forecast hides cleanly (it requires real recipe-to-Shopify
  // variant mappings to be useful).
  if (typeof shopifyConfigured === 'function') shopifyConfigured = function(){ return true; };
  if (typeof shopifyDashboard === 'function') shopifyDashboard = function(){ return Promise.resolve({
    shop: { name: 'BatchFlow Demo Store', currency: 'NZD' },
    fetchedAt: Date.now(),
    rangeDays: 7,

<script>
// Service worker registration — single SW (sw.js) handles BOTH offline
// caching (network-first with cache fallback) AND web push. Earlier
// versions registered an inline blob SW for offline alongside sw.js
// for push; whichever ran second wiped the first.
if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    if(reg && reg.update) try{reg.update()}catch(e){}
  }).catch(function(err){
    console.warn('SW registration failed:', err && err.message);
  });
  // When a new SW takes control the cached page is stale — refresh once
  var _swSwapped = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(_swSwapped) return;
    _swSwapped = true;
    if(typeof showToast==='function') showToast('App updated — refreshing…');
    setTimeout(function(){window.location.reload()}, 1200);
  });
}
</script>
